}
function drawRoster(){
  [...cardsEl.children].forEach((el,i) => {
    const on = i===rosterSel;
    el.classList.toggle('sel', on);
    el.classList.toggle('lock', !held_(CAST[i]));   // recheck: you've walked since
    if(on) el.scrollIntoView({block:'nearest'});
  });
}
function openRoster(){
  rosterOpen = true; rosterSel = Math.max(0, CAST.indexOf(player.char));
  sfx('pop', 0.5);
  rosterEl.classList.add('on'); drawRoster();
}
function closeRoster(){ rosterOpen = false; rosterEl.classList.remove('on'); }
function pickRoster(){
  const c = CAST[rosterSel];
  if(!held_(c)) return;            // not rescued yet — and never Qorvex
  becomeDoggo(c); closeRoster();
}
function perRow(){
  return Math.max(1, Math.floor(cardsEl.clientWidth / (cardsEl.children[0].offsetWidth + 9)));
}
function rosterKey(e){
  const n = CAST.length, k = perRow();
  if(e.code==='ArrowLeft'){ rosterSel = (rosterSel+n-1)%n; drawRoster(); }
  if(e.code==='ArrowRight'){ rosterSel = (rosterSel+1)%n; drawRoster(); }
  if(e.code==='ArrowUp'){ rosterSel = (rosterSel-k+n)%n; drawRoster(); }
  if(e.code==='ArrowDown'){ rosterSel = (rosterSel+k)%n; drawRoster(); }
  if(e.code==='Enter'||e.code==='KeyE'||e.code==='Space') pickRoster();
  if(e.code==='Escape') closeRoster();
}
const KENNELS = [];
for(let r=0;r<MAP_H;r++) for(let c=0;c<MAP_W;c++) if(grid[r][c]==='K') KENNELS.push({c,r});

function nearKennel(){
  const cx = (player.x+player.w/2)/T, cy = (player.y+player.h/2)/T;
  for(const k of KENNELS)
    if(Math.abs(k.c+0.5-cx)<1.4 && Math.abs(k.r+1-cy)<2) return k;
  return null;
}

// Walking past one banks it. It used to only happen when you pressed E, so a
// kennel you passed without swapping at wasn't a checkpoint at all.
function touchKennel(){
  const k = nearKennel();
  if(k){ checkX = k.c*T - 2; checkY = k.r*T - player.h; }
}

function reset(){
  doors.forEach(d => { d.open = false; d.t = 0; });
  plasmaOpen = false; orbs.length = 0; vapor.length = 0;
  COINS.forEach(c => c.got = false);
  coinsGot = 0; coinValue = 0; hudCoins.textContent = coinLabel();
  player.hp = 100; player.hurt = 0; player.dash = 0; player.dashCd = 0;
  byId('dalmatian').locked = true; rebuildCards();
  enemies.length = 0; lasers.length = 0; sparks.length = 0;
  buildEnemies();
  for(let r=42;r<48;r++) grid[r][47] = 'P';       // the panel heals
  seen.clear();
  checkX = 5*T; checkY = 14*T - 36;
  player.x = checkX; player.vx = 0; player.vy = 0;
  becomeDoggo(byId('barkmc'));
  player.y = 14*T - player.h;
  sayEl.classList.remove('on'); sayT = 0;
  bannerEl.classList.remove('on'); cleared = false;
}

// ───────────────────────────────────────────── update
let cleared = false, spin = 0;
function update(dt){
  if(sayT > 0){ sayT -= dt; if(sayT <= 0) sayEl.classList.remove('on'); }
  if(rosterOpen) return;
  const ch = player.char;
  player.digging = ch.move==='dig' && overlapsDirt(player);

  // ── bunker timers
  if(player.hurt   > 0) player.hurt   -= dt;
  if(player.dashCd > 0) player.dashCd -= dt;
  if(player.dash   > 0) player.dash   -= dt;
  updateEnemies(dt);
  storyBeats();
  hpFill.style.width = Math.max(0, player.hp) + '%';
  hpFill.style.background = player.hp > 55 ? '#3ddc84' : player.hp > 25 ? '#ffc93c' : '#e63946';

  if(player.digging){
    const ix = (R()?1:0) - (L()?1:0);
    const iy = (D()?1:0) - (U()||J()?1:0);
    player.vx = ix*DIG_SPEED; player.vy = iy*DIG_SPEED || 40;
    if(ix) player.face = ix;
    player.gliding = false;
  } else {
    const ix = (R()?1:0) - (L()?1:0);
    if(ix){
      // Turning gets full bite, so a doggo that takes a while to WIND UP still
      // answers the stick immediately — that's the difference between "heavy" and
      // "slippery".
      const turning = ix * player.vx < 0;
      player.vx += ix * ACCEL * (ch.accelMul || 1) * (turning ? 2.8 : 1) * dt;
      player.face = ix;
    } else {
      const f = FRICTION * (ch.frictionMul || 1) * dt;
      player.vx = Math.abs(player.vx) <= f ? 0 : player.vx - Math.sign(player.vx)*f;
    }
    const zooming = player.zoom > 0;
    const flying  = ch.move==='glide' && !player.onGround && player.vy > 0 && J();
    const base = RUN * (ch.speedMul || 1) * (zooming ? ZOOM_SPEED : 1);
    const cap  = flying ? PLANE_RUN : base;
    player.vx = Math.max(-cap, Math.min(cap, player.vx));

    if(player.onGround){ player.coyote = COYOTE; player.wallCoyote = 0; }
    else player.coyote -= dt;
    player.wallCoyote -= dt;
    if(J() && !keys._jheld) player.buffer = BUFFER; else player.buffer -= dt;
    keys._jheld = J();

    const jm = (ch.jumpMul || 1) * (zooming ? ZOOM_JUMP : 1);
    if(player.buffer>0 && player.coyote>0){
      player.vy = JUMP_V * jm;
      player.buffer = 0; player.coyote = 0; player.onGround = false;
      snd('jump');
    } else if((zooming || ch.wallJump) && player.buffer>0 && player.wallCoyote>0 && player.wall){
      player.vy = JUMP_V * jm * 0.92;              // wall kick, away from the wall
      player.vx = -player.wall * base * WALL_KICK;
      player.face = Math.sign(player.vx);
      player.buffer = 0; player.wallCoyote = 0;
      snd('kick');
    }
    const cut = -170 * jm;
    if(player.vy < cut && !J()) player.vy = cut;

    if(player.onGround){ player.flightT = 0; player.lift = PLANE_LIFT; player.pitch = 0; }
    player.gliding = player.thrusting = flying;
    if(flying){
      const waist = player.y + player.h*0.5;
      const my = mouseY === null ? waist : mouseY + oy;
      // -1 nose fully up · 0 trimmed · +1 nose fully down. Smoothed, so the
      // transition through level is a slope and not a cliff.
      const raw  = Math.max(-1, Math.min(1, (my - waist) / PLANE_RANGE));
      const want = Math.abs(raw) < PLANE_DEAD ? 0 : raw;
      player.pitch += (want - player.pitch) * Math.min(1, PLANE_EASE*dt);

      const up = Math.max(0, -player.pitch), down = Math.max(0, player.pitch);
      player.lifting = up > 0.15 && player.lift > 0;
      player.diving  = down > 0.15;
      // the reserve drains only as hard as he is actually pulling, and the
      // decay clock slows while he's straining instead of stopping dead
      if(up > 0 && player.lift > 0) player.lift -= dt*up;
      player.flightT += dt * (1 - up*0.85);

      const decay = Math.min(MAX_FALL, PLANE_SINK0 * Math.exp(player.flightT / PLANE_TAU));
      const hold  = player.lift > 0 ? PLANE_HOLD : decay;
      const sink  = down > 0 ? decay + (PLANE_DIVE - decay) * down*down
                             : decay + (hold - decay) * up;
      player.vy += (sink - player.vy) * Math.min(1, (5.5 + down*7)*dt);
    } else {
      player.lifting = player.diving = false; player.pitch = 0;
      player.vy += GRAV*dt;
      player.vy = Math.min(player.vy, MAX_FALL);
    }
  }

  // the dash commits: straight, brief, and faster than the run cap — set AFTER
  // the cap clamp above, or the clamp quietly eats it
  if(player.dash > 0) player.vx = player.face * DASH_SPEED;

  pushCrates(dt);

  const fellAt = player.vy;
  player.fellFrom = player.onGround ? player.y
                                    : Math.min(player.fellFrom ?? player.y, player.y);
  player.onGround = false;
  player.x += player.vx*dt; collide('x');
  player.y += player.vy*dt; collide('y');

  // hold E once the swing has played out and the sword drops level for a charge
  const armed = player.char.id === 'knight' || player.char.id === 'king';
  if(swing > 0) swing = Math.max(0, swing - dt*4);
  // no swing gate -- holding E has to couch it even mid-swing, or a held press
  // just swings once and never levels out, which is why charging did nothing
  const holding = armed && !rosterOpen && keys.KeyE;
  couch += ((holding ? 1 : 0) - couch) * Math.min(1, dt*9);
  couch = Math.max(0, Math.min(1, couch));
  if(armed){
    // REST is where his old drawing held it: up behind the shoulder, blade above
    // his head. A swing sweeps forward and BACK to rest (sine, not a ramp, or it
    // finishes pointing at the floor and stays there). Couched levels it at 90.
    const REST = -0.18;
    const ang = couch > 0.02
      ? REST + couch * (Math.PI/2 - REST)
      : REST + Math.sin((1 - swing) * Math.PI) * 2.4;
    swordArc.unshift(ang);
    if(swordArc.length > 6) swordArc.pop();
    // Charging: sword out, running at something. It clears cracked crates, and it
    // SHOVES anything else forward -- or forward and UP if the level move is
    // blocked, which is what frees a block stranded against a step. Reaches two
    // crates high, so a stack goes as one rather than the top one being left
    // hanging.
    if(couch > 0.7 && Math.abs(player.vx) > 60){
      const dir = player.face > 0 ? 1 : -1;
      const cx = Math.floor((player.x + player.w/2)/T);
      const foot = Math.floor((player.y + player.h - 1)/T);
      for(let r = foot; r >= foot - 1; r--){          // two crates of height
        const k = crateAt(cx + dir, r);
        if(!k) continue;
        if(k.kind === 'crackedCrate' || k.kind === 'crackedBlock'){
          CRATES.splice(CRATES.indexOf(k), 1); snd('smash'); continue;
        }
        if(k.pushT > 0) continue;
        if(crateFits(k, k.c + dir, k.r)){
          k.c += dir; k.ox -= dir*T; k.pushT = PUSH_GAP;
        } else if(crateFits(k, k.c + dir, k.r - 1)){
          k.c += dir; k.r -= 1; k.ox -= dir*T; k.oy += T; k.pushT = PUSH_GAP;
        }
      }
    }
  } else { couch = 0; swordArc.length = 0; }
  if(spiked()) respawn();

  // footsteps pace themselves off the walk cycle, so they speed up when he does
  if(player.onGround && Math.abs(player.vx) > 25 && !player.digging){
    player.stepPhase += Math.abs(player.vx)*dt;
    if(player.stepPhase > 34){ player.stepPhase = 0; snd('step'); }
  } else player.stepPhase = 0;
  if(player.onGround && !player.wasGround && fellAt > 260) snd('land', fellAt);
  // over ten tiles and the landing kills you
  if(player.onGround && !player.wasGround && !player.gliding &&
     !inDark(player.x + player.w/2, player.y + player.h) &&
     player.y - (player.fellFrom ?? player.y) > 10*T){ respawn(); }
  touchKennel();
  player.wasGround = player.onGround;

  if(player.digging){
    player.digT -= dt;
    if(player.digT <= 0){ player.digT = 0.15; snd('dig'); }
  } else player.digT = 0;

  // the chip: robo doors just open for whoever is wearing one, and stay open
  if(ch.chip){
    const c0=Math.floor((player.x-6)/T), c1=Math.floor((player.x+player.w+5)/T);
    const r0=Math.floor(player.y/T), r1=Math.floor((player.y+player.h-1)/T);
    for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++){
      const d = doorAt(c,r);
      if(d && d.kind === 'R' && !d.open){ d.open = true; d.t = 0; snd('door'); }
    }
  }
  doors.forEach(d => { if(d.open) d.t = Math.min(1, (d.t||0) + dt*3); });

  // You cannot swim DOWN — that's the gate. But you can always get back OUT:
  // you bob to the surface, keep steering, and haul yourself up the edge.
  if(inWater(player)){
    player.vy = Math.min(player.vy, 0) - 240*dt;
    player.vx *= 0.94;
    if(player.y + player.h > WATER_ROW*T + 10){
      player.y = WATER_ROW*T + 10 - player.h;
      player.vy = Math.min(player.vy, 0);
    }
    player.coyote = COYOTE;                 // treading water counts as footing
  }

  // plasma orbs
  for(let i=orbs.length-1;i>=0;i--){
    const o = orbs[i];
    o.x += o.vx*dt; o.y += (o.vy||0)*dt; o.life -= dt;
    const c = Math.floor(o.x/T), r = Math.floor(o.y/T);
    const t = (c>=0&&c<MAP_W&&r>=0&&r<MAP_H) ? grid[r][c] : '#';
    if(t==='S'){ plasmaOpen = true; snd('barrier'); orbs.splice(i,1); continue; }
    const hard = t==='#' || t==='d' || (t==='B' && !plasmaOpen) ||
                 (t==='R' && !(doorAt(c,r)||{}).open);
    if(hard || o.life<=0) orbs.splice(i,1);
  }

  // ── NANO. Shrinking pulls his legs in until he fits a one-tile gap; expanding
  // swells his head until he can reach a shelf nobody else gets to. The hitbox
  // follows, and his FEET stay put while it changes — grow with your head in the
  // ceiling and you'd otherwise be shoved through it.
  // Three drawings, so three states rather than a slider: -1 small, 0, +1 tall.
  // The hitbox is taken from the ART's own proportions, and his FEET stay planted
  // while it changes — grow with your head in a ceiling and you'd be shoved
  // through it, so a change that doesn't fit is simply refused.
  // -1 small, 0 normal, +1 tall. Eased, not snapped, and the hitbox tracks it the
  // whole way with his FEET planted — grow into a ceiling and the growth simply
  // stalls there rather than shoving him through it.
  const nanoH = v => v < 0 ? 34 + v*9 : 34 + v*34;      // 25 / 34 / 68
  const want  = ch.move === 'size' ? (D() ? -1 : U() ? 1 : 0) : 0;
  if(ch.move === 'size'){
    const cur = player.size || 0;
    if(Math.abs(want - cur) > 1e-3){
      const step = Math.sign(want - cur) * dt * 4.4;
      const next = Math.abs(step) > Math.abs(want-cur) ? want : cur + step;
      const feet = player.y + player.h, nh = Math.round(nanoH(next));
      if(!blocked(ch, player.x, feet-nh, player.w, nh)){
        player.size = next; player.h = nh; player.y = feet-nh;
      }
    }
  } else if(player.size){                                // swapped away mid-stretch
    player.size = 0; player.h = ch.h;
  }
  player.peri = 0;

  if(player.zoom > 0){
    player.zoom = Math.max(0, player.zoom - dt);
    player.trail.unshift({x:player.x, y:player.y, f:player.face});
    if(player.trail.length > 7) player.trail.pop();
    const left = Math.ceil(player.zoom);
    if(left !== player._zshown){
      player._zshown = left;
      hudMove.textContent = left ? `ZOOMIES — ${left}s` : ch.blurbCache || ch.ability;
    }
    if(player.zoom === 0){
      player.trail.length = 0; musicForBiome();
      hudMove.textContent = `atk ${ch.atk} · spd ${ch.spd} — ${ch.ability}`;
    }
  } else if(player.trail.length) player.trail.length = 0;

  // wingtip condensation — spawn off the back of the wing while the engine is lit,
  // then let each puff drift, swell and thin out
  if(player.thrusting){
    const tipX = player.x + (player.face > 0 ? 2 : player.w - 2);
    const tipY = player.y + player.h*0.72;
    for(let i=0;i<(player.lifting?3:2);i++)      // denser while he's straining
      vapor.push({ x: tipX, y: tipY + (i?5:-3),
                   vx: -player.face*(40 + Math.random()*50) + player.vx*0.12,
                   vy: -14 - Math.random()*22,
                   t: 0, life: 0.55 + Math.random()*0.35 });
  }
  for(let i=vapor.length-1;i>=0;i--){
    const p = vapor[i];
    p.t += dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= 0.94; p.vy *= 0.96;
    if(p.t >= p.life) vapor.splice(i,1);
  }

  spin += dt*8.5;
  COINS.forEach(c => {
    if(c.got) return;
    if(player.x < c.x+13 && player.x+player.w > c.x-13 &&
       player.y < c.y+15 && player.y+player.h > c.y-15){
      const tier = COIN_TIERS[c.tier];
      c.got = true; coinsGot++; coinValue += tier.value;
      sfx('coin', 0.35, tier.rate);
      hudCoins.textContent = coinLabel();
    }
  });

  player.phase += Math.abs(player.vx)*dt*0.06;

  // ── DALMATIAN. The roster goes from one to two.
  if(!seen.has('dal') && Math.abs(player.x - 90*T) < 2*T && player.y > 18*T){
    seen.add('dal');
    byId('dalmatian').locked = false; rebuildCards();
    sfx('bark', 0.9);
    say('DALMATIAN', 'He has been in there the whole time. He wants to know where Doggo is. ' +
        'Press E at his kennel — the roster is two now.');
  }

  const gx = 91*T, gy = 3*T;
  if(!cleared && player.x+player.w > gx && player.x < gx+3*T &&
     player.y+player.h > gy && player.y < gy+3*T){
    cleared = true; bannerEl.classList.add('on'); snd('clear');
  }

  const k = nearKennel();
  tipEl.classList.toggle('hot', !!k);
  tipEl.textContent = k ? 'KENNEL — press E to change doggo'
    : (document.body.classList.contains('touch')
        ? '← → move · JUMP · E dash'
        : '← → / A D move · Space jump · E DASH · P checkpoint · M music · R restart');
}

// ───────────────────────────────────────────── drawing
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
function fitCanvas(){
  const wrap = document.getElementById('wrap');
  const s = Math.min(wrap.clientWidth/VIEW_W, wrap.clientHeight/VIEW_H);
  const dpr = Math.min(2, devicePixelRatio||1);
  cv.width = Math.round(VIEW_W*s*dpr); cv.height = Math.round(VIEW_H*s*dpr);
  cv.style.width = (VIEW_W*s)+'px'; cv.style.height = (VIEW_H*s)+'px';
  ctx.setTransform(s*dpr,0,0,s*dpr,0,0);
}
addEventListener('resize', fitCanvas);

function rr(g,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  g.beginPath();
  g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}
function shade(hex,amt){
  const n = parseInt(hex.slice(1),16);
  const cl = v => Math.max(0,Math.min(255,v));
  return '#'+[(n>>16)+amt,((n>>8)&255)+amt,(n&255)+amt]
    .map(v=>cl(v).toString(16).padStart(2,'0')).join('');
}

// Adam's art if this doggo has any, otherwise a placeholder vector doggo in a hat.
function drawDog(g,x,y,ch,face,phase,st){
  // Qorvex carries a second, torn-up drawing — flick to it now and then so he
  // never quite holds still.
  let key = (ch.art2 && Math.floor(spin*2.4) % 11 === 0) ? ch.art2 : ch.art;
  let sizeK = 1;
  if(ch.move === 'size'){
    // his three drawings aren't the same height on paper — tall is 2x normal and
    // small is 0.74x — so the drawn height has to follow the art, or all three
    // render identically and the whole ability becomes invisible
    // dh sets the DRAWN height outright, so this is just where he is right now:
    // 0.74 fully small, 1 normal, 2.01 fully tall, and every value between.
    const v = st.size || 0;
    key   = v > 0.5 ? ch.artBig : v < -0.5 ? ch.artSmall : ch.art;
    sizeK = v < 0 ? 1 + v*0.26 : 1 + v*1.01;
  }
  const img = key && IMG[key];
  if(img && img.complete && img.naturalWidth){
    const dh = (st.dh || ch.dh || DOG_H) * sizeK;
    const s  = dh / img.naturalHeight;
    const dw = img.naturalWidth * s;
    const moving = !!st.moving;
    const bob  = moving ? Math.abs(Math.sin(phase*2))*2.2 : 0;
    const tilt = st.gliding ? (st.pitch || 0) * 0.42   // banks with the nose
               : (moving ? Math.sin(phase)*0.045 : 0);
    g.save();
    g.translate(x + ch.w/2, y + (st.h || ch.h));   // his ACTUAL feet, not the base
    g.rotate(tilt*(face<0?-1:1));
    g.scale(face<0?-1:1, 1);
    const N = ch.neck;
    if(N && st.peri > 0.01){
      const iw = img.naturalWidth, ih = img.naturalHeight, s = dh/ih;
      const hSrc = N.head*ih, nSrc = (N.body-N.head)*ih, bSrc = (1-N.body)*ih;
      const ext = st.peri * dh * 0.7;
      const bTop = -bSrc*s, nTop = bTop - nSrc*s - ext, hTop = nTop - hSrc*s;
      g.drawImage(img, 0, N.body*ih, iw, bSrc, -dw/2, bTop, dw, bSrc*s);
      g.drawImage(img, 0, N.head*ih, iw, nSrc, -dw/2, nTop, dw, nSrc*s + ext);
      g.drawImage(img, 0, 0,         iw, hSrc, -dw/2, hTop, dw, hSrc*s);
    } else {
      g.drawImage(img, -dw/2, -dh + bob, dw, dh);
    }

    // ── THE SWORD, drawn as its own sprite so it can move independently of him.
    // A tap sweeps it forward through an arc; holding E levels it out in front so
    // you can charge. The faded copies behind it are the recent angles, which is
    // what makes a swing read as motion rather than a jump-cut.
    const sw = ch.sword && IMG[ch.sword];
    if(sw && sw.complete && sw.naturalWidth && st.arc && st.arc.length){
      // measured off his OLD Knight drawing, where the sword was part of the art:
      // blade centre sat 25% of the sprite width behind him, hilt at 16% of his
      // height, blade 38% of his height. Drawn any longer and it reads as a
      // completely different weapon.
      const blade = dh * 0.61;
      const bw = sw.naturalWidth * (blade / sw.naturalHeight);
      const px = -dw*0.253, py = -dh*0.158 + bob;   // the hilt, which is the pivot
      const put = (ang, alpha) => {
        g.save(); g.globalAlpha = alpha;
        g.translate(px, py); g.rotate(ang);
        g.drawImage(sw, -bw/2, -blade, bw, blade);   // hilt on the pivot
        g.restore();
      };
      for(let i = st.arc.length - 1; i > 0; i--)
        put(st.arc[i], 0.13 * (1 - i/st.arc.length));
      put(st.arc[0], 1);
    }

    g.restore();
    return;
  }

  const w = ch.w, h = ch.h, col = ch.col;
  const bodyH = h*0.70, legTop = y + bodyH;
  const swing = Math.sin(phase)*Math.min(5, w*0.22);
  const dark = shade(col,-45);

  g.strokeStyle = dark; g.lineWidth = Math.max(3, w*0.14); g.lineCap = 'round';
  g.beginPath();
  g.moveTo(x+w*0.30+swing, legTop-1); g.lineTo(x+w*0.30+swing*0.4, y+h-1);
  g.moveTo(x+w*0.70-swing, legTop-1); g.lineTo(x+w*0.70-swing*0.4, y+h-1);
  g.stroke();

  g.strokeStyle = col; g.lineWidth = Math.max(3, w*0.13);
  g.beginPath();
  const tx = face>0 ? x : x+w;
  g.moveTo(tx, y+bodyH*0.45);
  g.quadraticCurveTo(tx-face*w*0.28, y+bodyH*0.30, tx-face*w*0.22, y+bodyH*0.02);
  g.stroke();

  g.fillStyle = dark;
  if(st.gliding){
    g.beginPath();
    g.moveTo(x+w*0.18, y+bodyH*0.22);
    g.lineTo(x-w*0.55, y+bodyH*0.02); g.lineTo(x+w*0.20, y+bodyH*0.50); g.fill();
    g.beginPath();
    g.moveTo(x+w*0.82, y+bodyH*0.22);
    g.lineTo(x+w*1.55, y+bodyH*0.02); g.lineTo(x+w*0.80, y+bodyH*0.50); g.fill();
  } else {
    g.beginPath();
    g.moveTo(x+w*0.20, y+bodyH*0.30); g.lineTo(x+w*0.10, y-bodyH*0.22);
    g.lineTo(x+w*0.46, y+bodyH*0.12); g.fill();
    g.beginPath();
    g.moveTo(x+w*0.80, y+bodyH*0.30); g.lineTo(x+w*0.90, y-bodyH*0.22);
    g.lineTo(x+w*0.54, y+bodyH*0.12); g.fill();
  }

  g.fillStyle = col; rr(g,x,y,w,bodyH,Math.min(w,bodyH)*0.42); g.fill();

  if(ch.hat === 'spots'){
    g.fillStyle = '#2c2a33';
    [[0.28,0.30,0.11],[0.62,0.52,0.09],[0.44,0.72,0.07]].forEach(([a,b,r])=>{
      g.beginPath(); g.arc(x+w*a, y+bodyH*b, w*r, 0, 7); g.fill();
    });
  }

  g.fillStyle = shade(col,22);
  const sx = face>0 ? x+w*0.58 : x+w*0.06;
  rr(g,sx,y+bodyH*0.46,w*0.36,bodyH*0.34,bodyH*0.16); g.fill();
  g.fillStyle = '#241f3d';
  g.beginPath();
  g.arc(face>0 ? sx+w*0.30 : sx+w*0.06, y+bodyH*0.60, Math.max(1.6,w*0.065), 0, 7); g.fill();

  const ex = face>0 ? x+w*0.56 : x+w*0.44;
  if(ch.hat === 'shades'){
    g.fillStyle = '#1b1830';
    rr(g, x+w*0.34, y+bodyH*0.20, w*0.52, bodyH*0.20, 3); g.fill();
  } else {
    g.fillStyle = '#fff';
    g.beginPath(); g.arc(ex, y+bodyH*0.30, Math.max(2.6,w*0.13), 0, 7); g.fill();
    g.fillStyle = '#1b1830';
    g.beginPath(); g.arc(ex+face*w*0.035, y+bodyH*0.31, Math.max(1.4,w*0.065), 0, 7); g.fill();
  }

  const hx = x+w*0.5, hy = y - bodyH*0.06;
  switch(ch.hat){
    case 'cowboy':
      g.fillStyle = '#7a4a24';
      rr(g, x-w*0.16, hy-2, w*1.32, 5, 2.5); g.fill();
      rr(g, x+w*0.24, hy-11, w*0.52, 11, 3); g.fill();
      break;
    case 'crown':
      g.fillStyle = '#ffd75e';
      g.beginPath();
      g.moveTo(x+w*0.22, hy); g.lineTo(x+w*0.22, hy-9); g.lineTo(x+w*0.36, hy-4);
      g.lineTo(x+w*0.50, hy-12); g.lineTo(x+w*0.64, hy-4); g.lineTo(x+w*0.78, hy-9);
      g.lineTo(x+w*0.78, hy); g.closePath(); g.fill();
      break;
    case 'helm':
      g.fillStyle = '#c3cad8';
      rr(g, x+w*0.16, hy-11, w*0.68, 14, 5); g.fill();
      g.fillStyle = '#3a4152';
      rr(g, x+w*0.20, hy-4, w*0.60, 3.5, 1.5); g.fill();
      break;
    case 'antenna':
      g.strokeStyle = shade(col,-55); g.lineWidth = 2.4;
      g.beginPath(); g.moveTo(hx, hy); g.lineTo(hx+3, hy-12); g.stroke();
      g.fillStyle = '#ff4d6d';
      g.beginPath(); g.arc(hx+3, hy-14, 3.4, 0, 7); g.fill();
      break;
    case 'party':
      g.fillStyle = '#4cc9f0';
      g.beginPath();
      g.moveTo(x+w*0.34, hy); g.lineTo(x+w*0.62, hy); g.lineTo(x+w*0.46, hy-15);
      g.closePath(); g.fill();
      g.fillStyle = '#ffd166';
      g.beginPath(); g.arc(x+w*0.46, hy-16, 2.6, 0, 7); g.fill();
      break;
  }
}

// Two passes so the whole mass reads as one shape: every rect fattened and drawn
// in the dark shade first, then every rect drawn in its gradient on top. Abutting
// rects overlap by PAD*2 so no seam or corner notch survives, and the only dark
// left showing is the outline around the outside — a darker version of the fill,
// never black.
const PAD = 2, OUT = 10, GRASS_H = 15;
let C = { ...BASE_C, ...BIOMES[biome].C };
function setBiome(name){
  biome = name;
  C = { ...BASE_C, ...BIOMES[name].C };
  hudBiome.textContent = name + (musOn ? '' : ' · muted');
  musicForBiome();
}
const radOf = r => 8 + ((r.x*7 + r.y*13) % 5) * 1.6;

// deterministic in WORLD space so the squiggle doesn't crawl when the camera moves
function droop(wx){
  return Math.sin(wx*0.13)*2.4 + Math.sin(wx*0.041 + 1.7)*3.4 + Math.sin(wx*0.0071 + 0.4)*2.6
       + Math.pow(Math.max(0, Math.sin(wx*0.023 + 2.2)), 7) * 15;
}
const hash = (a,b) => { const s = Math.sin(a*12.9898 + b*78.233)*43758.5453; return s - Math.floor(s); };

// Seed and place textures in WORLD space, then subtract the camera. Seeding from
// screen coords re-rolls the noise every pixel of scroll and the ground boils.
function blobs(wx, wy, w, h, n, col, rmin, rmax){
  ctx.fillStyle = col;
  for(let i=0;i<n;i++){
    const bx = wx + hash(i, wy)*w, by = wy + hash(i+91, wx)*h;
    const rad = rmin + hash(i+37, wy+i)*(rmax-rmin);
    ctx.beginPath();
    ctx.ellipse(bx-ox, by-oy, rad, rad*(0.6 + hash(i+7,wx)*0.5), hash(i,i)*3, 0, 7);
    ctx.fill();
  }
}

// subtle cracks and # marks, world-anchored
function stoneMarks(r){
  const n = Math.max(2, (r.w*r.h)/7000|0);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(52,58,70,.26)'; ctx.lineWidth = 2;
  for(let i=0;i<n;i++){
    let cx = r.x + hash(i, r.y)*r.w, cy = r.y + hash(i+61, r.x)*r.h;
    ctx.beginPath(); ctx.moveTo(cx-ox, cy-oy);
    for(let k=0;k<3;k++){
      cx += (hash(i+k, k+3)-0.5)*26; cy += (hash(i+k+17, k)-0.35)*30;
      ctx.lineTo(cx-ox, cy-oy);
    }
    ctx.stroke();
  }
  const m = Math.max(2, (r.w*r.h)/5500|0);
  ctx.lineWidth = 1.8;
  for(let i=0;i<m;i++){
    const hx = r.x + hash(i+3, r.y+9)*r.w - ox, hy = r.y + hash(i+29, r.x+5)*r.h - oy;
    const s = 6 + hash(i, r.x)*4;
    ctx.strokeStyle = hash(i,i+1) > 0.5 ? 'rgba(255,255,255,.22)' : 'rgba(52,58,70,.24)';
    ctx.beginPath();
    ctx.moveTo(hx-s, hy-s*0.35); ctx.lineTo(hx+s, hy-s*0.35);
    ctx.moveTo(hx-s, hy+s*0.35); ctx.lineTo(hx+s, hy+s*0.35);
    ctx.moveTo(hx-s*0.35, hy-s); ctx.lineTo(hx-s*0.35, hy+s);
    ctx.moveTo(hx+s*0.35, hy-s); ctx.lineTo(hx+s*0.35, hy+s);
    ctx.stroke();
  }
}

function drawTerrain(){
  const vis = ROCK.filter(r => r.x - ox < VIEW_W + 60 && r.x + r.w - ox > -60 &&
                               r.y - oy < VIEW_H + 60 && r.y + r.h - oy > -60);

  vis.forEach(r => {                                   // outline: darker shade, never black
    if(r.platform || r.pillar) return;                 // his blobs carry their own outline
    const ex = r.x-ox-PAD-OUT, ey = r.y-oy-PAD-OUT;
    const ew = r.w+(PAD+OUT)*2, eh = r.h+(PAD+OUT)*2, er = radOf(r)+OUT;
    ctx.fillStyle = r.stone ? C.stoneEdge : C.earthEdge;
    rr(ctx, ex, ey, ew, eh, er); ctx.fill();
    if(r.grass){
      // the rim ABOVE a grass mass belongs to the grass, so it's dark green, not
      // dark brown — the sides stay brown because the sides are dirt
      ctx.save();
      ctx.beginPath(); ctx.rect(ex, ey, ew, OUT+PAD+1); ctx.clip();
      ctx.fillStyle = C.grassEdge;
      rr(ctx, ex, ey, ew, eh, er); ctx.fill();
      ctx.restore();
    }
  });

  vis.forEach(r => {
    if((r.platform || r.pillar) && drawPiece(r)) return;
    const x = r.x-ox-PAD, y = r.y-oy-PAD, w = r.w+PAD*2, h = r.h+PAD*2;
    ctx.save();
    rr(ctx, x, y, w, h, radOf(r)); ctx.clip();

    if(r.stone){
      const g = ctx.createLinearGradient(0, y, 0, y + Math.min(h, 260));
      g.addColorStop(0, C.stone); g.addColorStop(1, C.stoneLow);
      ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
      stoneMarks(r);
      // the lit edge. Bright, saturated, sitting proud of the white body — the
      // same job the green cap does on Adam's grass.
      ctx.fillStyle = C.capEdge; ctx.fillRect(x, y, w, 13);
      ctx.fillStyle = C.cap;     ctx.fillRect(x, y, w, 8);
      ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillRect(x, y, w, 3);
    } else {
      const g = ctx.createLinearGradient(0, y, 0, y + Math.min(h, 300));
      g.addColorStop(0, C.earth); g.addColorStop(1, C.earthLow);
      ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
      blobs(r.x, r.y, r.w, r.h, Math.max(3, (r.w*r.h)/5200|0), 'rgba(60,38,20,.30)', 5, 15);

      if(r.grass){
        const im = TERRAIN_IMG[biome + '-ground'], STRIP_H = BIOMES[biome].stripH;
        if(im && im.complete && im.naturalWidth){
          // Tile his strip, aligned to WORLD positions so it can't slide as you walk.
          const s = STRIP_H / im.naturalHeight, tw = im.naturalWidth * s;
          const x0 = Math.floor(r.x / tw) * tw;
          for(let px = x0; px < r.x + r.w + tw; px += tw)
            ctx.drawImage(im, Math.round(px-ox), Math.round(r.y-oy-PAD),
                          Math.ceil(tw)+1, STRIP_H);
        } else {
          ctx.fillStyle = C.grass; ctx.fillRect(x, y, w, GRASS_H);
        }
      }
    }
    ctx.restore();
  });
}

function drawLooseDirt(){
  const vis = DIRT.filter(r => r.x - ox < VIEW_W + 60 && r.x + r.w - ox > -60 &&
                               r.y - oy < VIEW_H + 60 && r.y + r.h - oy > -60);
  ctx.fillStyle = C.looseEdge;
  vis.forEach(r => { rr(ctx, r.x-ox-PAD-OUT, r.y-oy-PAD-OUT,
                         r.w+(PAD+OUT)*2, r.h+(PAD+OUT)*2, 8+OUT); ctx.fill(); });
  vis.forEach(r => {
    const x = r.x-ox-PAD, y = r.y-oy-PAD, w = r.w+PAD*2, h = r.h+PAD*2;
    ctx.save(); rr(ctx, x, y, w, h, 6); ctx.clip();
    const g = ctx.createLinearGradient(0, y, 0, y+h);
    g.addColorStop(0, C.loose); g.addColorStop(1, C.looseLow);
    ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = C.crack; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    for(let i=0;i<Math.max(4, (r.w*r.h)/700|0); i++){      // crackle, world-anchored
      let cx = r.x + hash(i, r.y)*r.w, cy = r.y + hash(i+53, r.x)*r.h;
      ctx.beginPath(); ctx.moveTo(cx-ox, cy-oy);
      for(let k=0;k<3;k++){
        cx += (hash(i+k, k)-0.5)*16; cy += (hash(i+k+9, k)-0.5)*16;
        ctx.lineTo(cx-ox, cy-oy);
      }
      ctx.stroke();
    }
    ctx.restore();
  });
}

// Headlamp. The cone stops at the first solid tile in front of him — and because
// loose dirt isn't solid to a digger, his beam reaches straight through the stuff
// he's about to tunnel into.
function drawLamp(){
  const ch = player.char;
  if(!ch.lamp) return;
  const im = IMG[ch.art];
  if(!(im && im.complete && im.naturalWidth)) return;
  const dh = ch.dh || DOG_H, dw = dh * im.naturalWidth / im.naturalHeight;
  const fx = player.face > 0 ? ch.lamp.x : 1 - ch.lamp.x;
  const wx = player.x + player.w/2 - dw/2 + dw*fx;
  const wy = player.y + player.h - dh + dh*ch.lamp.y;
  const dir = player.face;

  let len = 200;
  const row = Math.floor(wy / T);
  for(let d=12; d<200; d+=8){
    if(solidFor(ch, Math.floor((wx + dir*d)/T), row)){ len = d; break; }
  }
  const lx = wx - ox, ly = wy - oy, spread = 0.30;

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createLinearGradient(lx, ly, lx + dir*len, ly);
  g.addColorStop(0,   'rgba(255,244,190,.50)');
  g.addColorStop(0.45,'rgba(255,236,155,.20)');
  g.addColorStop(1,   'rgba(255,228,130,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(lx, ly);
  ctx.lineTo(lx + dir*len, ly - len*spread);
  ctx.lineTo(lx + dir*len, ly + len*spread);
  ctx.closePath(); ctx.fill();
  const rg = ctx.createRadialGradient(lx, ly, 0, lx, ly, 15);
  rg.addColorStop(0,'rgba(255,251,225,.70)'); rg.addColorStop(1,'rgba(255,240,180,0)');
  ctx.fillStyle = rg;
  ctx.beginPath(); ctx.arc(lx, ly, 15, 0, 7); ctx.fill();
  ctx.restore();
}

let camX = 0, camY = 0, ox = 0, oy = 0;
function draw(){
  const cx = player.x + player.w/2 + player.face*330*player.peri;
  const tx = Math.max(0, Math.min(MAP_W*T - VIEW_W, cx - VIEW_W/2));
  const ty = Math.max(0, Math.min(MAP_H*T - VIEW_H,
                                  player.y + player.h/2 - VIEW_H*0.56));
  camX += (tx - camX)*0.12;
  camY += (ty - camY)*0.09;
  ox = Math.round(camX); oy = Math.round(camY);

  drawBunkerBack();
  drawTerrain();
  drawLeds();
  drawLooseDirt();
  drawCrates();

  const c0 = Math.max(0, Math.floor(ox/T)-1), c1 = Math.min(MAP_W-1, Math.ceil((ox+VIEW_W)/T));
  const rr0 = Math.max(0, Math.floor(oy/T)-2), rr1 = Math.min(MAP_H-1, Math.ceil((oy+VIEW_H)/T)+1);
  for(let r=rr0;r<=rr1;r++) for(let c=c0;c<=c1;c++){
    const t = grid[r][c], x = c*T-ox, y = r*T-oy;
    if(t==='K'){
      const im = TERRAIN_IMG.kennel;
      if(im && im.complete && im.naturalWidth){
        const kh = KENNEL_H, kw = kh * im.naturalWidth / im.naturalHeight;
        ctx.drawImage(im, x + T/2 - kw/2, y + T - kh, kw, kh);   // stood on the ground
      } else {
        ctx.fillStyle = '#c0392b'; ctx.fillRect(x-6, y-T, T+12, 2*T);
      }
    } else if(t==='e'){
      // a doghouse, standing open and empty. Every one of them except yours.
      const bx = x-9, bw2 = T+18, by = y-T+2, bh = 2*T-2, roof = 24;
      ctx.fillStyle = '#8e9aa8';
      ctx.beginPath();
      ctx.moveTo(bx-6, by+roof); ctx.lineTo(bx+bw2/2, by); ctx.lineTo(bx+bw2+6, by+roof);
      ctx.closePath(); ctx.fill();
      ctx.fillRect(bx, by+roof-2, bw2, bh-roof+2);
      ctx.fillStyle = '#3c4551';                            // the dark mouth
      const dw = bw2*0.5, dx = bx+(bw2-dw)/2, dy = by+bh-30;
      ctx.beginPath();
      ctx.moveTo(dx, by+bh); ctx.lineTo(dx, dy+10);
      ctx.quadraticCurveTo(dx+dw/2, dy-9, dx+dw, dy+10);
      ctx.lineTo(dx+dw, by+bh); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#c3ccd6';                            // the nameplate
      ctx.fillRect(bx+bw2/2-7, by+roof+3, 14, 4);
    } else if(t==='R' || t==='C'){
      const d = doorAt(c,r), open = d && d.open;
      if(open){
        ctx.fillStyle = 'rgba(120,220,255,.10)'; ctx.fillRect(x+4, y, T-8, T);
        ctx.fillStyle = '#7fd4ff'; ctx.fillRect(x+4, y, T-8, 2);
      } else {
        ctx.fillStyle = '#8c96a3'; rr(ctx, x+1, y, T-2, T, 3); ctx.fill();
        ctx.fillStyle = '#aeb8c5'; rr(ctx, x+4, y+2, T-8, T-4, 2); ctx.fill();
        ctx.fillStyle = 'rgba(43,49,56,.55)';
        ctx.fillRect(x+4, y + (r%2 ? 8 : 20), T-8, 3);        // shutter slats
        if(t==='R'){                                          // chip reader — it wants you
          ctx.fillStyle = '#7fd4ff';
          ctx.beginPath(); ctx.arc(x+T/2, y+T/2, 3.4, 0, 7); ctx.fill();
        } else {                                              // locked while anything guards it
          ctx.fillStyle = '#ff4d54';
          ctx.fillRect(x+T/2-4, y+T/2-4, 8, 8);
        }
      }
    } else if(t==='P'){
      // THE CRACKED PANEL. Nothing you own can open this.
      ctx.fillStyle = '#c8ccd2'; rr(ctx, x, y, T, T, 2); ctx.fill();
      ctx.fillStyle = '#dfe3e9'; rr(ctx, x+2, y+2, T-4, T-4, 2); ctx.fill();
      ctx.strokeStyle = '#8a9199'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
      for(let i=0;i<4;i++){                                   // world-seeded cracks
        let px = x + hash(c, r+i)*T, py = y + hash(c+7, r+i)*T;
        ctx.beginPath(); ctx.moveTo(px, py);
        for(let k=0;k<3;k++){
          px += (hash(c+k, r+i+k)-0.5)*15; py += (hash(c+k+9, r+i)-0.5)*15;
          ctx.lineTo(px, py);
        }
        ctx.stroke();
      }
      ctx.fillStyle = '#ffc93c';                              // hazard flash
      ctx.fillRect(x+2, y+T/2-2, T-4, 4);
      ctx.fillStyle = 'rgba(43,49,56,.5)';
      for(let i=0;i<3;i++) ctx.fillRect(x+3+i*11, y+T/2-2, 5, 4);
    } else if(t==='L'){
      // THE HATCH A DOGGO LOCKED. No reader, no panel, nothing to show the chip.
      ctx.fillStyle = '#39414c'; rr(ctx, x, y, T, T, 3); ctx.fill();
      ctx.fillStyle = '#4d5764'; rr(ctx, x+2, y+3, T-4, T-6, 2); ctx.fill();
      ctx.strokeStyle = '#2a3038'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x+T*0.3, y+2); ctx.lineTo(x+T*0.3, y+T-2);
      ctx.moveTo(x+T*0.75, y+2); ctx.lineTo(x+T*0.75, y+T-2); ctx.stroke();
      ctx.fillStyle = '#8b939e';                              // bolts, from the far side
      [0.3, 0.75].forEach(f => { [6, T-6].forEach(dy2 => {
        ctx.beginPath(); ctx.arc(x+T*f, y+dy2, 2.6, 0, 7); ctx.fill(); }); });
    } else if(t==='w'){
      // THE FLOODED STAIRWELL. It goes a long way down.
      const surf = r === WATER_ROW;
      ctx.fillStyle = surf ? 'rgba(70,150,190,.55)' : 'rgba(30,90,130,.72)';
      ctx.fillRect(x, y, T, T);
      if(surf){
        ctx.fillStyle = 'rgba(210,245,255,.75)';
        for(let i=0;i<T;i+=5)
          ctx.fillRect(x+i, y + 2 + Math.sin((c*T+i)*0.09 + spin*0.7)*2.2, 3.5, 2.5);
      }
      ctx.fillStyle = 'rgba(127,212,255,.22)';                // lights still on, far below
      if((c+r) % 3 === 0)
        ctx.fillRect(x+T/2-2, y+T/2-2 + Math.sin(spin*0.4+c)*3, 4, 4);
    } else if(t==='p'){
      // a cell partition. Reads as a wall, is not one — you walk straight past it.
      ctx.fillStyle = 'rgba(150,162,178,.42)';
      ctx.fillRect(x+8, y, T-16, T);
      ctx.fillStyle = 'rgba(110,122,138,.34)';
      ctx.fillRect(x+8, y, 3, T);
      ctx.fillRect(x+T-11, y, 3, T);
    } else if(t==='v'){
      // a vent. Too small, too high. Not today.
      ctx.fillStyle = '#3b434e'; rr(ctx, x+2, y+6, T-4, T-12, 3); ctx.fill();
      ctx.fillStyle = '#6d7783';
      for(let i=0;i<4;i++) ctx.fillRect(x+4, y+9+i*4.5, T-8, 2.4);
    } else if(t==='G'){
      // daylight. the first green in the game is up there.
      const gg = ctx.createLinearGradient(0, y-T, 0, y+2*T);
      gg.addColorStop(0, 'rgba(255,255,255,.95)');
      gg.addColorStop(1, 'rgba(180,235,160,0)');
      ctx.fillStyle = gg; ctx.fillRect(x-6, y-T, T+12, 3*T);
    }
  }

  COINS.forEach(c => {
    if(c.got || c.x - ox < -40 || c.x - ox > VIEW_W + 40) return;
    const [fi, flip] = COIN_SEQ[(Math.floor(spin) + c.ph) % COIN_SEQ.length];
    const im = COIN_TIERS[c.tier].img[fi];
    if(!(im.complete && im.naturalWidth)) return;
    const h = COIN_H, w = h * COIN_FACE[fi];
    const bob = Math.sin(spin*0.5 + c.ph)*2.5;
    ctx.save();
    ctx.translate(c.x - ox, c.y + bob - oy);
    if(flip) ctx.scale(-1, 1);
    ctx.drawImage(im, -w/2, -h/2, w, h);
    ctx.restore();
  });

  orbs.forEach(o => {
    const im = TERRAIN_IMG.orb;
    ctx.save();
    ctx.translate(o.x-ox, o.y-oy);
    ctx.fillStyle = 'rgba(232,140,255,.30)';
    ctx.beginPath(); ctx.arc(0, 0, 13, 0, 7); ctx.fill();
    if(im && im.complete && im.naturalWidth){
      const h = ORB_H, w = h * im.naturalWidth / im.naturalHeight;
      // it can fly at any angle now, so point it along its travel -- and mirror
      // rather than rotate past vertical, or it flies upside down going left
      ctx.rotate(Math.atan2(o.vy || 0, o.vx));
      if(o.vx < 0) ctx.scale(1, -1);
      ctx.drawImage(im, -w/2, -h/2, w, h);
    } else {
      ctx.fillStyle = '#f7d5ff';
      ctx.beginPath(); ctx.arc(0, 0, 5, 0, 7); ctx.fill();
    }
    ctx.restore();
  });

  vapor.forEach(p => {
    const k = p.t / p.life;
    ctx.fillStyle = `rgba(255,255,255,${0.5*(1-k)*(1-k)})`;
    ctx.beginPath(); ctx.arc(p.x-ox, p.y-oy, 2.5 + k*9, 0, 7); ctx.fill();
  });

  drawEnemies();

  player.trail.forEach((p, i) => {                 // zoomies afterimages
    ctx.save();
    ctx.globalAlpha = 0.30 * (1 - i/player.trail.length);
    ctx.translate(Math.round(p.x-ox), Math.round(p.y-oy));
    drawDog(ctx, 0, 0, player.char, p.f, player.phase, {moving:true});
    ctx.restore();
  });
  drawLamp();
  // the dash — a hard streak, because it is the one thing that reads as "not a robot"
  if(player.dash > 0){
    const k = player.dash / DASH_TIME;
    ctx.save();
    ctx.globalAlpha = 0.42*k;
    for(let i=1;i<=3;i++){
      ctx.translate(-player.face*11, 0);
      drawDog(ctx, Math.round(player.x-ox), Math.round(player.y-oy),
              player.char, player.face, player.phase, {moving:true});
    }
    ctx.restore();
  }
  ctx.save();
  ctx.translate(Math.round(player.x-ox), Math.round(player.y-oy));
  // i-frames blink, so you can tell when the next hit will actually land
  if(player.hurt > 0) ctx.globalAlpha = (Math.floor(player.hurt*22) % 2) ? 0.35 : 1;
  drawDog(ctx, 0, 0, player.char, player.face, player.phase,
          {gliding:player.gliding, digging:player.digging, peri:player.peri, size:player.size, h:player.h,
           swing, couch, arc:swordArc,
           lifting:player.lifting, pitch:player.pitch,
           moving:Math.abs(player.vx) > 5 && player.coyote > 0});
  if(player.hurt > 0.6){
    ctx.globalCompositeOperation = 'source-atop';
    ctx.fillStyle = 'rgba(255,80,90,.75)';
    ctx.fillRect(-10, -20, player.w+20, player.h+30);
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();

  if(player.digging){
    ctx.fillStyle = 'rgba(180,130,80,.65)';
    for(let i=0;i<5;i++){
      const a = player.phase*2 + i*1.7;
      ctx.fillRect(player.x-ox+player.w/2+Math.cos(a)*13,
                   player.y-oy+player.h*0.6+Math.sin(a)*11, 3,3);
    }
  }

  drawDark();          // last, so the dark swallows the player too
}

// ───────────────────────────────────────────── loop
let last = performance.now();
function frame(now){
  let dt = (now-last)/1000; last = now;
  dt = Math.min(dt, 1/30);
  update(dt); draw();
  requestAnimationFrame(frame);
}
fitCanvas();
drawCardArt();
hudCoins.textContent = coinLabel();
becomeDoggo(byId('barkmc'));
requestAnimationFrame(frame);
window.__bark = { player, grid, CAST, byId, becomeDoggo, doors, orbs, T,
                  enemies, lasers, SHUTTERS, hurtRobot, seen, say, reset,
                  held, keys, action,
                  checkpointOf: () => ({x:checkX, y:checkY}),
                  get cam(){ return {ox, oy}; },
                  get music(){ let pk = 0;
                    if(musMeter){ const d = new Float32Array(musMeter.fftSize);
                      musMeter.getFloatTimeDomainData(d);
                      for(const v of d) pk = Math.max(pk, Math.abs(v)); }
                    return {track:musTrack, on:musOn, notes:noteCount,
                            state:actx && actx.state, peak:+pk.toFixed(3)}; },
                  get plasmaOpen(){ return plasmaOpen; } };
})();
</script>
