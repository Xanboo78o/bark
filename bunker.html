<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>B.A.R.K. — AREA 1: THE BUNKER</title>
<style>
  :root{
    --bg:#12101a; --panel:#1b1830; --panel2:#241f3d; --line:#332c52;
    --tx:#eae6f4; --mut:#9b93b8; --doggo:#ffd166; --cool:#4cc9f0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
  #stage{position:fixed;inset:0;display:flex;flex-direction:column}
  #wrap{flex:1;position:relative;overflow:hidden}
  canvas#game{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block}

  #hud{position:absolute;left:14px;top:12px;pointer-events:none;z-index:5;
    background:rgba(255,255,255,.80);padding:7px 13px 8px;border-radius:13px}
  #who{font-weight:900;letter-spacing:.12em;font-size:14px;text-transform:uppercase;
    color:#1d3346;text-shadow:0 1px 0 rgba(255,255,255,.45)}
  #move{font-size:12.5px;color:#3f5b70;margin-top:2px;text-shadow:0 1px 0 rgba(255,255,255,.4)}
  #coins{font-size:12px;font-weight:800;color:#7a6a3c;margin-top:4px;letter-spacing:.06em}
  #biome{font-size:11px;color:#6d7f8e;margin-top:2px;letter-spacing:.14em;text-transform:uppercase}
  #tip{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;z-index:5;
    font-size:13px;color:var(--mut);text-align:center;pointer-events:none;
    background:rgba(18,16,26,.72);padding:6px 14px;border-radius:99px;border:1px solid var(--line)}
  #tip.hot{color:var(--cool);border-color:var(--cool)}
  #banner{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);z-index:6;
    font-weight:900;font-size:34px;letter-spacing:-.02em;color:#06d6a0;opacity:0;
    transition:opacity .3s;pointer-events:none;text-align:center}
  #banner.on{opacity:1;pointer-events:auto}

  /* health — the bunker is the first area with damage in it */
  #hp{margin-top:5px;width:132px;height:9px;border-radius:99px;background:#00000028;
    overflow:hidden;box-shadow:inset 0 0 0 1px #0000001f}
  #hpf{height:100%;width:100%;border-radius:99px;background:#e63946;transition:width .16s}
  /* the dismantled robo, the flooded stairwell, the door your chip can't open */
  #say{position:absolute;left:50%;transform:translateX(-50%);bottom:56px;z-index:6;
    max-width:min(560px,86vw);text-align:center;font-size:14px;line-height:1.5;
    color:#ffe9b8;background:rgba(12,10,20,.9);border:1px solid #5b4a2a;
    padding:11px 18px;border-radius:14px;opacity:0;transition:opacity .25s;pointer-events:none}
  #say.on{opacity:1}
  #say b{color:#ff6b6b;letter-spacing:.1em;font-size:11px;display:block;margin-bottom:3px;
    text-transform:uppercase}

  #roster{position:absolute;inset:0;z-index:20;display:none;
    background:rgba(10,8,18,.9);backdrop-filter:blur(3px);
    align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:16px}
  #roster.on{display:flex}
  #roster h2{margin:0;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--cool)}
  #cards{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;
    max-width:1000px;max-height:66vh;overflow-y:auto;padding:4px}
  .card{width:114px;background:var(--panel);border:2px solid var(--line);border-radius:13px;
    padding:8px 7px;text-align:center;cursor:pointer;transition:border-color .12s,transform .12s}
  .card.sel{border-color:var(--doggo);transform:translateY(-3px)}
  .card.lock{opacity:.45}
  .card canvas{display:block;margin:0 auto 4px;background:var(--panel2);border-radius:8px}
  .card b{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;line-height:1.25}
  .card .stat{font-size:10px;color:var(--cool);margin-top:3px;letter-spacing:.04em}
  .card .abil{display:block;font-size:10.5px;color:var(--tx);margin-top:3px;line-height:1.3}
  .card .note{display:block;font-size:9.5px;color:var(--mut);margin-top:3px;line-height:1.3}
  #rhint{font-size:12px;color:var(--mut)}

  #pad{display:none;gap:8px;padding:10px 12px 14px;background:var(--panel);border-top:1px solid var(--line)}
  #pad button{flex:1;background:var(--panel2);color:var(--tx);border:1px solid var(--line);
    border-radius:12px;padding:16px 0;font-size:17px;font-weight:800;touch-action:none}
  #pad button:active{background:var(--line)}
  body.touch #pad{display:flex}

  /* one game: every screen can get back to the front door */
  #nav{position:fixed;left:14px;bottom:14px;z-index:30;font:700 11px/1 ui-sans-serif,system-ui,sans-serif;
    letter-spacing:.18em;text-transform:uppercase;text-decoration:none;color:#9b93b8;
    background:rgba(18,16,26,.82);border:1px solid #332c52;padding:9px 14px;border-radius:99px}
  #nav:hover{color:#ffd166;border-color:#ffd166}
</style>
</head>
<body>
<a id="nav" href="index.html">◀ Menu</a>
<div id="stage">
  <div id="wrap">
    <canvas id="game"></canvas>
    <div id="hud"><div id="who"></div><div id="move"></div>
      <div id="coins">0 / 9 coins</div><div id="biome">the bunker</div>
      <div id="hp"><div id="hpf"></div></div></div>
    <div id="tip"></div>
    <div id="say"></div>
    <div id="banner">OUT OF THE BUNKER<br><a href="index.html" style="display:inline-block;margin-top:18px;font-size:14px;letter-spacing:.18em;color:#0a0810;background:#06d6a0;padding:12px 22px;border-radius:12px;text-decoration:none">End of Chapter 1</a></div>
    <div id="roster">
      <h2>Kennel — pick who goes out</h2>
      <div id="cards"></div>
      <div id="rhint">← → ↑ ↓ to browse · Enter to take them · Esc to cancel</div>
    </div>
  </div>
  <div id="pad">
    <button data-k="left">←</button>
    <button data-k="right">→</button>
    <button data-k="up">↑</button>
    <button data-k="use">E</button>
    <button data-k="jump">JUMP</button>
  </div>
</div>
<script>
(() => {
'use strict';

// ───────────────────────────────────────────── config
const T = 32;
const VIEW_W = 672, VIEW_H = 448;   // 21 x 14 tiles — zoomed in, so the camera pans vertically too

const GRAV      = 1800;
const MAX_FALL  = 900;
const RUN       = 215;
const ACCEL     = 2000;
const FRICTION  = 2400;
const JUMP_V    = -565;
const COYOTE    = 0.09;
const BUFFER    = 0.10;
const GLIDE_FALL= 50;
const GLIDE_RUN = 255;
// He flies whichever way he's already pointed — the mouse doesn't steer him. What
// it does is hold him up: cursor above his waist and he strains for it, spending a
// two-second reserve before the sag sets in. The sag is exponential, so a flight
// ends the way a paper plane does — level, level, level, gone. He never climbs,
// which is what keeps him off Alien's wall and Billie's wall.
const PLANE_RUN   = 335;
const PLANE_SINK0 = 30;     // px/s at the start of a glide
const PLANE_TAU   = 0.9;    // sink doubles about every 0.6s once the reserve is out
const PLANE_LIFT  = 2.0;    // seconds of "trying", refilled on landing
// Near-zero, not merely slow: at 30px/s he spent his whole altitude budget while
// straining and the reserve only bought about one extra second instead of two.
const PLANE_HOLD  = 4;
const PLANE_DIVE  = 720;    // cursor below him — he puts the nose down and drops
const PLANE_DEAD  = 8;      // deadzone around his waist so it doesn't flicker
const DIG_SPEED = 135;
// BARKmc's dash. It does 5 damage, which is nothing — its real job is the i-frames.
const DASH_TIME = 0.17, DASH_SPEED = 640, DASH_CD = 0.40;
const ORB_SPEED = 430;
// ZOOMIES. Jump height goes with the SQUARE of takeoff speed, so 1.75x is already
// 3x the height — 8 tiles, where Alien's big jump only manages 4.7.
const ZOOM_TIME  = 45;
const ZOOM_SPEED = 1.9;
const ZOOM_JUMP  = 1.75;
// Small horizontal kick on purpose: a big shove would mean you can only wall-jump
// inside a shaft with two facing walls, and there aren't any. This way holding
// toward the wall re-contacts it, so a single face can be climbed.
const WALL_KICK  = 0.55;
const WALL_GRACE = 0.12;

// ───────────────────────────────────────────── the roster
// Stats and abilities are lifted straight from the Doggo Battles wiki — ANormalName1's
// canon, in menu order. `art` is set only where Adam has drawn something; everything
// else is a placeholder vector doggo wearing a hat until his real art lands.
// Drawn height per doggo, tuned so their BODIES match rather than their pictures.
// Two earlier attempts both failed: scaling by image height shrank whoever wore a
// hat, and scaling by nose-to-tail length made bodies equal on paper but not to the
// eye. These numbers come from the area of each drawing's lower body — the part no
// hat, crown or antenna touches — so a taller `dh` here means more of the picture is
// headgear, not that the dog is bigger. Verified by lining them all up side by side.
const DOG_H = 44;

const CAST = [
  // you. Xanboo78o's doggo, still wearing the collar he tore off.
  { id:'barkmc', name:'BARKmc', col:'#f5a623', w:26, h:34, tag:'ADAM',
    art:'BARKmc', bw:260, move:'dash', chip:true,
    atk:'5', spd:'Normal', ability:'Dash — E. A dodge that stings.',
    note:'you · the one that got away' },
  // rescued at the end of the bunker. Locked until then.
  { id:'dalmatian', name:'Dalmatian Doggo', col:'#e9e9ee', hat:'spots', w:26, h:34, tag:'DB',
    art:'Dalmatian-Doggo', bw:260, locked:true,
    atk:'Normal', spd:'Normal', ability:'None', note:"#2 · Doggo's best friend" },
];

const byId = id => CAST.find(c => c.id === id);

const IMG = {};
CAST.forEach(c => [c.art, c.art2].filter(Boolean).forEach(n => {
  if(IMG[n]) return;
  const im = new Image();
  im.onload = () => drawCardArt();
  im.src = 'doggos/' + n + '.png';
  IMG[n] = im;
}));

// Adam's four-frame coin: face, turning, nearly edge, edge.
const COIN_IMG = [11,12,13,14].map(n => { const im = new Image(); im.src = 'doggos/coin'+n+'.png'; return im; });
// A real spin is 360° and four frames only cover 90°, so run them out and back,
// flipping horizontally after each edge-on step — that's where a coin's visible face
// actually swaps. [frame, flipped, width multiplier].
//
// All four of Adam's frames are used. His edge frame is a 23px sliver, which is
// three pixels at game scale, so it gets widened — enough to have thickness, not
// so much that its straight sides read as a blocky bar.
// Silhouette widths land on 27 / 22 / 14 / 8.
const COIN_SEQ = [
  [0,0,1.00], [1,0,1.05], [2,0,1.30], [3,0,3.00],
  [2,1,1.30], [1,1,1.05], [0,1,1.00], [1,1,1.05],
  [2,1,1.30], [3,1,3.00], [2,0,1.30], [1,0,1.05],
];
const COIN_H = 27;

// Adam's five biome sheets. Each is a ground strip plus a set of floating-platform
// blobs; every colour below was sampled out of his own art.
const BASE_C = {
  // WHITE CONCRETE AND QUARTZ. Somebody built this place nicely to keep dogs in it.
  // Outline is a darker shade of the fill, never black — Adam's rule.
  stone:'#f2f4f7', stoneLow:'#dbe0e7', stoneEdge:'#aeb6c2',
  loose:'#b07c48', looseLow:'#8d6136', looseEdge:'#6f4c2a', crack:'#5e3f22',
};
// The bunker is an INTERIOR — no sky, no hills, no clouds. Everything is stone,
// which here means poured concrete and bolted plate.
const BIOMES = {
  bunker: { plats:0, stripH:30, indoor:true, C:{
    back:'#c9d2dc', backLow:'#aab6c4', seam:'#9aa7b6',      // the far wall, behind everything
    led:'#eaf6ff', ledGlow:'#7fd4ff', ledAlert:'#ff4d54',   // high-quality strip lighting
    earth:'#f2f4f7', earthLow:'#dbe0e7', earthEdge:'#aeb6c2',
    under:'#c9d2dc', underMud:'#b6c2d0', grass:'#f2f4f7', grassEdge:'#aeb6c2' } },
};
const BIOME_NAMES = Object.keys(BIOMES);
const TERRAIN_IMG = {};
let biome = 'bunker';

// ───────────────────────────────────────────── AREA 1 — THE BUNKER
// '.' air   '#' solid plate   'K' kennel (Dalmatian's cell)   'R' robo door (chip)
// 'P' cracked panel — only a laser breaks it     'L' doggo-locked door — the chip is useless
// 'C' security shutter — opens when its room is clear         'w' water (you cannot swim)
// 'e' empty doghouse (decor)   'v' vent grille (decor, a promise)   'G' the way up
//
// Seven rooms, ~10 minutes. Floor is row 18 throughout; the shaft at the end climbs out.
const MAP_W = 216, MAP_H = 21;
const grid = Array.from({length:MAP_H}, () => Array(MAP_W).fill('.'));
const fill = (x,y,w,h,ch) => { for(let r=y;r<y+h;r++) for(let c=x;c<x+w;c++)
  if(r>=0&&r<MAP_H&&c>=0&&c<MAP_W) grid[r][c]=ch; };
const put = (x,y,ch) => fill(x,y,1,1,ch);

fill(0,18,MAP_W,3,'#');            // the floor. walking surface = row 18
fill(0,0,MAP_W,10,'#');            // the ceiling slab

// ── 1 · THE CELL (x 2-11) — teaches move, jump, and that the chip opens doors
fill(1,13,1,5,'#');                // back wall of your cell
put(4,17,'e');                     // your own doghouse, the only one that was occupied
fill(11,13,1,5,'R');               // cell door — walk into it and it opens. you are disguised.

// ── 2 · THE CELL BLOCK (x 12-46) — teaches the premise with no cutscene
fill(12,12,MAP_W-12,1,'.');        // corridors run 6 tiles tall from here on
// 'p' partitions are BACKGROUND, never solid — a 5-tile wall is unjumpable
// (jump height is 88.7px = 2.77 tiles) and these were sealing the corridor.
[15,20,25,31,37,42].forEach(x => { put(x,17,'e'); fill(x-1,13,1,5,'p'); });  // cells, all standing open
fill(28,15,3,1,'#'); fill(34,13,3,1,'#');      // a couple of easy hops
put(44,11,'v');                                // PROMISE: a vent, too high, too small

// ── 3 · LASER-DOG (x 47-76) — the verb, in its simplest form: laser vs WALL
fill(47,10,1,3,'#');               // room lip
fill(56,16,4,1,'#');               // a block of cover mid-room
fill(76,13,1,5,'P');               // CRACKED PANEL — his laser is the only thing that opens this

// ── 4 · THE DISMANTLED ONE (x 77-116) — the turn. exposition, and both promises.
fill(90,18,7,3,'w');               // PROMISE: the flooded stairwell → THE AQUADEPTHS
fill(89,18,1,3,'#'); fill(97,18,1,3,'#');
fill(103,15,3,1,'#');
// PROMISE: the doggo-locked door → DELETION DEPTHS HIGHWAY.
// A HATCH IN THE FLOOR, not a wall. The Highway goes down, and a promise must
// never sit across the only path — as a wall this sealed off rooms 5, 6 and 7.
fill(111,18,5,1,'L');

// ── 5 · THE PATROL (x 117-150) — the verb again, escalated: robot vs ROBOT
fill(117,10,1,3,'#');
fill(126,16,3,1,'#');  fill(136,14,3,1,'#');   // ledges to break line of sight
fill(150,13,1,5,'C');              // shutter — opens when this room is clear

// ── 6 · THE GUARD ROOM (x 151-190) — the exam. three of them.
fill(151,10,1,3,'#');
fill(160,15,4,1,'#'); fill(172,16,3,1,'#'); fill(180,13,3,1,'#');
put(168,9,'v');                    // PROMISE: a ceiling hatch
fill(190,13,1,5,'C');              // Dalmatian's cell door — opens when the guards are down

// ── 7 · DALMATIAN, AND UP (x 191-215)
put(194,17,'K');                   // his cell. the roster goes from one to two.

// THE WAY OUT. Cut UP out of the ground as a solid staircase, not floating
// platforms — those you simply walk underneath and never notice.
// Two rules it obeys: a step rises at most TWO tiles (the jump clears 2.77), and
// nothing sits within FIVE rows above a take-off point (the apex puts your head
// 3.9 tiles up, and you clang into anything closer).
fill(198,0,MAP_W-199,18,'.');      // carve the ceiling slab away above the stair
fill(199,16,3,5,'#');
fill(202,14,3,7,'#');
fill(205,12,3,9,'#');
fill(208,10,3,11,'#');
fill(211,8,4,13,'#');
fill(211,6,4,1,'G');               // daylight, and out

fill(0,0,1,MAP_H,'#'); fill(MAP_W-1,0,1,MAP_H,'#');

// coins — hand-placed, one at a time, each somewhere worth the detour
const COINS = [[6,16],[28,14],[34,12],[58,15],[85,17],[104,14],[137,13],[161,14],[181,12]]
  .map(([c,r]) => ({ x:c*T + T/2, y:r*T + T/2, got:false, ph:(c*7 + r*3) % 12 }));
let coinsGot = 0;


const doors = [];
for(let c=0;c<MAP_W;c++){
  let run = null;
  for(let r=0;r<MAP_H;r++){
    const t = grid[r][c];
    if(t==='R'||t==='C'){
      if(!run || run.kind!==t){ run={c,r0:r,r1:r,open:false,kind:t}; doors.push(run); }
      else run.r1=r;
    }
    else run = null;
  }
}
const doorAt = (c,r) => doors.find(d => d.c===c && r>=d.r0 && r<=d.r1);
let plasmaOpen = false;

// Terrain is a tile grid for collision but must not LOOK like one. Merge runs of
// tiles into as few big rectangles as possible, then draw those as one rounded
// mass — Doggo Battles' chunky slabs, no grid seams.
function mergeRects(pred){
  const used = Array.from({length:MAP_H}, () => new Array(MAP_W).fill(false));
  const out = [];
  for(let r=0;r<MAP_H;r++) for(let c=0;c<MAP_W;c++){
    if(used[r][c] || !pred(c,r)) continue;
    let w = 1;
    while(c+w < MAP_W && pred(c+w,r) && !used[r][c+w]) w++;
    let h = 1;
    grow: while(r+h < MAP_H){
      for(let i=0;i<w;i++) if(!pred(c+i, r+h) || used[r+h][c+i]) break grow;
      h++;
    }
    for(let rr=r;rr<r+h;rr++) for(let cc=c;cc<c+w;cc++) used[rr][cc] = true;
    out.push({x:c*T, y:r*T, w:w*T, h:h*T});
  }
  return out;
}
const ROCK = mergeRects((c,r) => grid[r][c]==='#');
const DIRT = mergeRects((c,r) => grid[r][c]==='d');
// Indoors there is no ground line: every mass in here is poured plate, so it all
// draws as 'stone'. (Outdoors this is the height test that splits wall from earth.)
const SURFACE = MAP_H*T;
ROCK.forEach(r => { r.platform = false; r.stone = true; r.grass = false; });

// ───────────────────────────────────────────── player
const player = {
  char: byId('barkmc'), x: 4*T, y: 18*T-36, w:28, h:36, hp:100, hurt:0, dash:0, dashCd:0,
  vx:0, vy:0, onGround:false, face:1, phase:0, coyote:0, buffer:0,
  gliding:false, digging:false, peri:0,
  zoom:0, wall:0, wallCoyote:0, trail:[],
  thrusting:false, lifting:false, flightT:0, lift:PLANE_LIFT
};
const vapor = [];        // wingtip condensation
const orbs = [];

// ═══════════════════════════════════════════════════════════════════════════
// ENEMY AI  —  "thats like 90% of the game" (Adam)
//
// The premise: you are WEARING THE CHIP, so a robot that sees you walking
// calmly just carries on. It is not blind — it has decided you are staff.
// Suspicion is what you spend by acting like a dog: dashing, sprinting,
// crowding them, standing somewhere you shouldn't be. One robot that works it
// out SHOUTS, and the room turns.
//
// Your dash does 5 damage against 145 HP, so you never kill anything yourself.
// You kill them with each other. The AI knows that — it checks for a buddy in
// the firing line BEFORE it starts aiming, but never again before it fires.
// That gap is the whole skill: it isn't a stupid robot, it's a slow one.
// ═══════════════════════════════════════════════════════════════════════════

const DMG = {
  laserPlayer: 12, laserRobo: 45,       // 145 HP  ≈ 4 friendly lasers
  swingPlayer: 22, swingRobo: 60,       // 175 HP  ≈ 3 friendly swings
  dashRobo:     5,                      // yours. 29 hits. it is a statement, not an attack.
};

const KINDS = {
  cyclops: { art:'Robo-Doggo-Cyclops', hp:145, w:30, h:34, dh:46,
             role:'ranged', speed:82, sight:760, fov:0.62, aimTime:0.95,
             hold:230, fire:430, cool:1.5 },
  patrol:  { art:'Robo-Doggo-V2',      hp:145, w:30, h:34, dh:44,
             role:'ranged', speed:98, sight:560, fov:0.50, aimTime:0.72,
             hold:170, fire:340, cool:1.15 },
  brute:   { art:'heavyrobodoggo',     hp:175, w:38, h:38, dh:54,
             role:'melee',  speed:122, sight:520, fov:0.70, wind:0.5,
             reach:78, cool:1.25 },
  scrapped:{ art:'Scrapped-Robo-Doggo', hp:1, w:32, h:34, dh:46,
             role:'inert', speed:0, sight:0, fov:0, inert:true },
};
Object.values(KINDS).forEach(k => {
  if(IMG[k.art]) return;
  const im = new Image(); im.src = 'doggos/' + k.art + '.png'; IMG[k.art] = im;
});

const enemies = [];
const lasers  = [];
const sparks  = [];

function spawn(kind, tx, ty, opt){
  const K = KINDS[kind];
  const e = {
    kind, K, art:K.art, w:K.w, h:K.h, dh:K.dh, col:'#9aa3ad', bw:260,
    x:tx*T, y:ty*T - K.h, vx:0, vy:0, face:-1, phase:0, onGround:true,
    hp:K.hp, max:K.hp, dead:false,
    state:'calm', sus:0, lost:0, look:0,           // perception
    aim:0, cd:Math.random()*0.8, wind:0, swing:0,  // action timers
    flash:0, shove:0, alertPop:0,
    home:[(opt&&opt.x0!=null?opt.x0:tx-4)*T, (opt&&opt.x1!=null?opt.x1:tx+4)*T],
    zone:(opt&&opt.zone) || null,
  };
  enemies.push(e); return e;
}

// ── line of sight. A robot cannot see through plate, a shut door, or the panel.
const blocksSight = (c,r) => {
  if(c<0||c>=MAP_W||r<0||r>=MAP_H) return true;
  const t = grid[r][c];
  if(t==='#'||t==='P'||t==='L') return true;
  if(t==='R'||t==='C'){ const d = doorAt(c,r); return !(d && d.open); }
  return false;
};
function clearLine(ax, ay, bx, by){
  const dx = bx-ax, dy = by-ay;
  const steps = Math.ceil(Math.hypot(dx,dy) / (T*0.5));
  for(let i=1;i<steps;i++){
    const x = ax + dx*i/steps, y = ay + dy*i/steps;
    if(blocksSight((x/T)|0, (y/T)|0)) return false;
  }
  return true;
}

const eyeOf = e => ({ x: e.x + e.w/2, y: e.y + e.h*0.32 });
const midOf = p => ({ x: p.x + p.w/2, y: p.y + p.h*0.45 });

// ── PERCEPTION. Returns how fast this robot is losing faith in your disguise.
function suspicionRate(e, dist){
  const p = player;
  // NEGATIVE means it is actively reassured. Walking calmly at a distance has to
  // be sustainable forever, or you could never cross a room. You spend suspicion
  // on purpose: crowd them, sprint, or dash.
  let rate = -0.25;
  const speed = Math.abs(p.vx);
  if(p.dash > 0)            rate += 3.6;              // no robot dashes. this is the loud one.
  else if(speed > RUN*0.62) rate += 1.25;             // running reads wrong
  if(dist < 95)             rate += 1.75;             // close enough to smell that you are warm
  else if(dist < 200)       rate += 0.32;
  return rate > 0 ? rate * (1 - Math.min(0.5, dist/1300)) : rate;
}

function shout(src){
  enemies.forEach(e => {
    if(e === src || e.dead || e.K.inert) return;
    if(Math.hypot(e.x-src.x, e.y-src.y) > 470) return;
    if(!clearLine(eyeOf(e).x, eyeOf(e).y, eyeOf(src).x, eyeOf(src).y)) return;
    if(e.state !== 'hunting'){ e.state = 'hunting'; e.sus = 1; e.alertPop = 0.9; e.lost = 0; }
  });
}

function perceive(e, dt){
  const eye = eyeOf(e), me = midOf(player);
  const dx = me.x - eye.x, dy = me.y - eye.y;
  const dist = Math.hypot(dx, dy);
  const facing = Math.sign(dx) === e.face || Math.abs(dx) < 20;
  const withinCone = Math.abs(dy) < Math.abs(dx)*e.K.fov + 70;

  const sees = dist < e.K.sight && facing && withinCone &&
               clearLine(eye.x, eye.y, me.x, me.y);
  e.sees = sees;

  if(sees) e.sus += suspicionRate(e, dist) * dt;
  else     e.sus -= (e.state==='hunting' ? 0.16 : 0.62) * dt;
  e.sus = Math.max(0, Math.min(1.35, e.sus));

  if(e.state === 'hunting'){
    e.lost = sees ? 0 : e.lost + dt;
    if(e.lost > 6.5 && e.sus < 0.35){ e.state = 'suspicious'; e.lost = 0; }
  } else if(e.sus >= 1){
    e.state = 'hunting'; e.alertPop = 0.9; e.lost = 0; shout(e);
    sfx('bark', 0.35);
  } else if(e.sus >= 0.42){
    e.state = 'suspicious';
  } else if(e.sus < 0.12){
    e.state = 'calm';
  }
  return dist;
}

// ── Would this shot hit one of ours? Checked when the robot DECIDES to aim.
// It is not checked again when the trigger goes. That gap is the game.
function friendInLine(e){
  const eye = eyeOf(e), me = midOf(player);
  const dir = Math.sign(me.x - eye.x) || e.face;
  for(const o of enemies){
    if(o === e || o.dead || o.K.inert) continue;
    const ahead = (o.x + o.w/2 - eye.x) * dir;
    if(ahead <= 0 || ahead > Math.abs(me.x - eye.x)) continue;
    if(eye.y > o.y - 6 && eye.y < o.y + o.h + 6) return true;
  }
  return false;
}

function fire(e){
  const eye = eyeOf(e), me = midOf(player);
  const dir = Math.sign(me.x - eye.x) || e.face;
  lasers.push({ x: eye.x + dir*e.w*0.55, y: eye.y, vx: dir*940, from:e, life:1.6 });
  sfx('pop', 0.32);
  e.cd = e.K.cool;
}

function hurtRobot(e, amount, src){
  if(e.dead || e.K.inert) return;
  e.hp -= amount; e.flash = 0.22;
  // being shot by your own side is exactly as alerting as being shot by a dog
  if(e.state !== 'hunting'){ e.state = 'hunting'; e.sus = 1; e.alertPop = 0.9; shout(e); }
  if(e.hp <= 0){
    e.hp = 0; e.dead = true; e.deadT = 0;
    // Insurance against a soft-lock: the only thing that can open the cracked
    // panel is this one Cyclops. If it dies first the room is sealed forever,
    // so it takes the wall with it when it goes.
    if(e.x < 100*T && PANEL_COLS.some(c => grid[17][c] === 'P')) PANEL_COLS.forEach(breakPanel);
    for(let i=0;i<16;i++) sparks.push({ x:e.x+e.w/2, y:e.y+e.h*0.5,
      vx:(Math.random()-0.5)*300, vy:-Math.random()*260, life:0.5+Math.random()*0.4 });
    sfx('pop', 0.6);
  }
}

function hurtPlayer(amount, fromX){
  if(player.hurt > 0 || player.dash > 0) return;      // dashing is a dodge. that is its job.
  player.hp -= amount; player.hurt = 0.85;
  player.vx = Math.sign(player.x + player.w/2 - fromX) * 250;
  player.vy = -210;
  if(player.hp <= 0){ player.hp = 0; killPlayer(); }
}

// ── The brute's swing. It hits EVERYTHING in the arc, which is the point.
function swingHits(e){
  const cx = e.x + e.w/2 + e.face*e.K.reach*0.55, cy = e.y + e.h*0.55;
  const R = e.K.reach;
  if(Math.hypot(player.x+player.w/2-cx, player.y+player.h/2-cy) < R)
    hurtPlayer(DMG.swingPlayer, e.x+e.w/2);
  enemies.forEach(o => {
    if(o === e || o.dead || o.K.inert) return;
    if(Math.hypot(o.x+o.w/2-cx, o.y+o.h/2-cy) < R) hurtRobot(o, DMG.swingRobo, e);
  });
  for(let i=0;i<7;i++) sparks.push({ x:cx, y:cy, vx:e.face*(90+Math.random()*220),
    vy:(Math.random()-0.6)*220, life:0.3+Math.random()*0.25 });
}

function walkEnemy(e, dir, dt, mul){
  const sp = e.K.speed * (mul||1);
  e.vx = dir * sp;
  if(dir) e.face = dir;
  const nx = e.x + e.vx*dt;
  // don't walk into plate, and don't walk off a ledge
  const lead = nx + (dir>0 ? e.w+2 : -2);
  const footR = ((e.y + e.h + 4)/T)|0, midR = ((e.y + e.h*0.5)/T)|0;
  if(blocksSight((lead/T)|0, midR) || !blocksSight((lead/T)|0, footR)){ e.vx = 0; e.face = -dir || e.face; }
  else e.x = nx;
  e.phase += Math.abs(e.vx)*dt*0.05;
}

// ── the cracked panel. Only a laser opens it, and there is exactly one laser
// source in that room: the thing trying to kill you.
function breakPanel(c){
  for(let r=0;r<MAP_H;r++) if(grid[r][c]==='P') grid[r][c]='.';
  for(let n=0;n<26;n++) sparks.push({ x:c*T+T/2, y:(13+Math.random()*5)*T,
    vx:(Math.random()-0.5)*420, vy:-Math.random()*320, life:0.6+Math.random()*0.5 });
  sfx('pop', 0.8);
  say('THE PANEL BLOWS OUT', 'Their weapons are the only weapons in here. Use theirs.');
}

// ── security shutters. They hold until every robot in their room is scrap.
const SHUTTERS = [];
function checkShutters(){
  SHUTTERS.forEach(sh => {
    if(sh.door.open) return;
    const left = enemies.some(e => !e.dead && !e.K.inert &&
                              e.x > sh.zone[0]*T && e.x < sh.zone[1]*T);
    if(!left){ sh.door.open = true; sfx('pop', 0.7); say(sh.title, sh.text); }
  });
}

function killPlayer(){
  player.hp = 100; player.hurt = 1.2;
  player.x = checkpoint.x; player.y = checkpoint.y; player.vx = 0; player.vy = 0;
  enemies.forEach(e => { if(!e.dead){ e.state='calm'; e.sus=0; e.aim=0; e.wind=0; e.swing=0; } });
  lasers.length = 0;
  say('CAUGHT', 'They put you back. Nothing in here can be beaten by biting it.');
}

function updateEnemies(dt){
  enemies.forEach(e => {
    if(e.ghost == null) e.ghost = e.hp;
    if(e.ghost > e.hp) e.ghost = Math.max(e.hp, e.ghost - dt*130);
    if(e.flash > 0) e.flash -= dt;
    if(e.alertPop > 0) e.alertPop -= dt;
    if(e.dead){ e.deadT += dt; return; }
    if(e.K.inert) return;

    const dist = perceive(e, dt);
    const me = midOf(player), eye = eyeOf(e);
    if(e.cd > 0) e.cd -= dt;

    if(e.state === 'calm'){
      // a patrol walks its stretch; a guard holds its post and sweeps its head
      e.aim = 0; e.wind = 0;
      if(e.home[1] - e.home[0] > T*1.5){
        if(e.x < e.home[0]) e.face = 1;
        if(e.x + e.w > e.home[1]) e.face = -1;
        walkEnemy(e, e.face, dt, 0.55);
      } else {
        e.look += dt;
        if(e.look > 2.6){ e.look = 0; e.face = -e.face; }
        e.vx = 0;
      }
      return;
    }

    if(e.state === 'suspicious'){
      // turns toward you and stares. Doesn't shoot. This is your warning.
      e.vx = 0; e.aim = 0; e.wind = 0;
      const dir = Math.sign(me.x - eye.x);
      if(dir) e.face = dir;
      return;
    }

    // ── HUNTING
    const dir = Math.sign(me.x - eye.x) || e.face;

    if(e.K.role === 'melee'){
      if(e.swing > 0){ e.swing -= dt; e.vx = 0; return; }
      if(e.wind > 0){
        e.wind -= dt; e.vx = 0; e.face = dir;
        if(e.wind <= 0){ swingHits(e); e.swing = 0.28; e.cd = e.K.cool; }
        return;
      }
      if(dist < e.K.reach*0.92 && e.cd <= 0){ e.wind = e.K.wind; e.vx = 0; return; }
      walkEnemy(e, dir, dt, dist < e.K.reach*1.4 ? 0.7 : 1);
      return;
    }

    // ── ranged: hold your distance, aim, fire.
    if(e.aim > 0){
      e.aim -= dt; e.vx = 0; e.face = dir;
      // COMMITTED. It does not look again. Move a friend into the beam now and it eats it.
      if(e.aim <= 0) fire(e);
      return;
    }
    if(dist > e.K.hold*1.35)      walkEnemy(e, dir, dt);
    else if(dist < e.K.hold*0.72) walkEnemy(e, -dir, dt, 0.8);
    else { e.vx = 0; e.face = dir; }

    // SEE far, ENGAGE close. If it opens up from across the map the beam spends
    // most of a second in flight, and "step out of the line" stops being a dodge
    // and becomes a hover. Firing range is deliberately much shorter than sight.
    if(e.cd <= 0 && e.sees && dist < e.K.fire &&
       Math.abs(me.y - eye.y) < 46 && !friendInLine(e))
      e.aim = e.K.aimTime;                    // the one and only friendly-fire check
  });

  // ── lasers
  for(let i=lasers.length-1;i>=0;i--){
    const L = lasers[i];
    const steps = 4, dx = L.vx*dt/steps;
    let gone = false;
    for(let k=0;k<steps && !gone;k++){
      L.x += dx; L.life -= dt/steps;
      const c = (L.x/T)|0, r = (L.y/T)|0;
      if(L.life <= 0){ gone = true; break; }
      // a cracked panel is the ONLY wall a laser opens
      if(c>=0&&c<MAP_W&&r>=0&&r<MAP_H && grid[r][c]==='P'){ breakPanel(c); gone = true; break; }
      if(blocksSight(c,r)){
        for(let n=0;n<6;n++) sparks.push({ x:L.x, y:L.y, vx:-Math.sign(L.vx)*(60+Math.random()*180),
          vy:(Math.random()-0.5)*200, life:0.25+Math.random()*0.2 });
        gone = true; break;
      }
      for(const o of enemies){                       // FRIENDLY FIRE
        if(o === L.from || o.dead || o.K.inert) continue;
        if(L.x > o.x && L.x < o.x+o.w && L.y > o.y && L.y < o.y+o.h){
          hurtRobot(o, DMG.laserRobo, L.from); gone = true; break;
        }
      }
      if(gone) break;
      if(L.x > player.x && L.x < player.x+player.w &&
         L.y > player.y && L.y < player.y+player.h){ hurtPlayer(DMG.laserPlayer, L.x); gone = true; }
    }
    if(gone) lasers.splice(i,1);
  }

  for(let i=sparks.length-1;i>=0;i--){
    const s = sparks[i];
    s.x += s.vx*dt; s.y += s.vy*dt; s.vy += 900*dt; s.life -= dt;
    if(s.life <= 0) sparks.splice(i,1);
  }

  checkShutters();
}


function solidFor(ch, c, r){
  if(c<0||c>=MAP_W||r<0||r>=MAP_H) return true;
  const t = grid[r][c];
  if(t==='#') return true;
  if(t==='d') return ch.move !== 'dig';
  if(t==='B') return !plasmaOpen;
  if(t==='P') return true;                       // cracked panel — only a laser opens it
  if(t==='L') return true;                       // a doggo locked this. the chip does nothing.
  if(t==='C'){ const d = doorAt(c,r); return !(d && d.open); }   // shutter, opens on room clear
  if(t==='R'){ const d = doorAt(c,r); return !(d && d.open); }
  return false;                                  // p w e v G are all walk-through
}
const isWater = (c,r) => c>=0&&c<MAP_W&&r>=0&&r<MAP_H && grid[r][c]==='w';
function inWater(p){
  const c = ((p.x+p.w/2)/T)|0, r = ((p.y+p.h*0.75)/T)|0;
  return isWater(c,r);
}
const isDirt = (c,r) => c>=0&&c<MAP_W&&r>=0&&r<MAP_H && grid[r][c]==='d';

function box(p){
  return { c0:Math.floor(p.x/T), c1:Math.floor((p.x+p.w-1)/T),
           r0:Math.floor(p.y/T), r1:Math.floor((p.y+p.h-1)/T) };
}
function overlapsDirt(p){
  const {c0,c1,r0,r1} = box(p);
  for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++) if(isDirt(c,r)) return true;
  return false;
}
function collide(axis){
  const {c0,c1,r0,r1} = box(player);
  for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++){
    if(!solidFor(player.char,c,r)) continue;
    if(axis==='x'){
      if(player.vx>0){ player.x = c*T - player.w; player.wall = 1; player.wallCoyote = WALL_GRACE; }
      else if(player.vx<0){ player.x = (c+1)*T; player.wall = -1; player.wallCoyote = WALL_GRACE; }
      player.vx = 0;
    } else {
      if(player.vy>0){ player.y = r*T - player.h; player.vy=0; player.onGround=true; }
      else if(player.vy<0){ player.y = (r+1)*T; player.vy=0; }
    }
  }
}
function blocked(ch,x,y,w,h){
  const c0=Math.floor(x/T), c1=Math.floor((x+w-1)/T);
  const r0=Math.floor(y/T), r1=Math.floor((y+h-1)/T);
  for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++) if(solidFor(ch,c,r)) return true;
  return false;
}

function becomeDoggo(ch){
  const feet = player.y + player.h;
  let ny = feet - ch.h, nx = player.x + (player.w - ch.w)/2;
  if(blocked(ch,nx,ny,ch.w,ch.h)){
    for(let k=1;k<=6;k++){ if(!blocked(ch,nx,ny-k*4,ch.w,ch.h)){ ny -= k*4; break; } }
  }
  const swapped = player.char !== ch;
  player.char = ch; player.w = ch.w; player.h = ch.h;
  player.x = nx; player.y = ny; player.vy = Math.min(player.vy,0); player.peri = 0;
  if(swapped) sfx('bark', 0.5);
  player.zoom = 0; player.trail.length = 0; player._zshown = -1;   // zoomies don't survive a swap
  hudWho.textContent = ch.name;
  hudMove.textContent = `atk ${ch.atk} · spd ${ch.spd} — ${ch.ability}`;
}

// ───────────────────────────────────────────── sound
// The three short ones are Scratch's own library sounds, straight out of Doggo
// Battles. Played through Audio elements, not fetch + decodeAudioData, because
// fetch is blocked on file:// and this page gets opened by double-clicking it.
function sfx(name, vol){
  const a = new Audio('sfx/' + name + '.wav');
  a.volume = vol; a.play().catch(() => {});
}

// ───────────────────────────────────────────── music
// Original score, synthesised live — no files, nothing borrowed. The DB project's
// music is other people's (Funkytown, Fortnite rips, stock trailer beds), so there
// was nothing there to build a theme on.
//
// Notes are MIDI numbers; melody events are [startBeat, lengthInBeats, note].
const SCORES = {
  // THE DOGGO THEME. A minor, slow. The hook is the first two bars — a rising
  // call that falls back down, like someone saying a dog's name across a field.
  doggo: {
    bpm: 70, len: 32, lead: 'triangle',
    chords: [[57,60,64],[53,57,60],[48,52,55],[55,59,62],
             [57,60,64],[53,57,60],[48,52,55],[55,59,62]],
    bass:   [45,41,36,43,45,41,36,43],
    mel: [[0,2,69],[2,1,72],[3,1,71],   [4,3,69],[7,1,67],
          [8,1,67],[9,1,64],[10,2,67],  [12,2,62],[14,2,64],
          [16,2,76],[18,1,74],[19,1,72],[20,3,72],[23,1,69],
          [24,1,71],[25,1,67],[26,2,64],[28,4,62]],
  },
  // Underground and stone. D minor, slower, mostly silence.
  deep: {
    bpm: 58, len: 16, lead: 'sine',
    chords: [[50,53,57],[46,50,53],[53,57,60],[45,49,52]],
    bass:   [38,34,41,33],
    mel: [[0,3,62],[3,1,65], [4,2,64],[6,2,62], [8,4,57], [12,2,60],[14,2,62]],
  },
  // Water and ash. E minor, floating, no real tune — just long tones drifting.
  drift: {
    bpm: 54, len: 16, lead: 'sine',
    chords: [[52,55,59],[48,52,55],[57,60,64],[50,54,57]],
    bass:   [40,36,45,38],
    mel: [[0,4,64],[4,4,67],[8,4,69],[12,2,71],[14,2,67]],
  },
};
const BIOME_TRACK = { grass:'doggo', rock:'deep', city:'deep', water:'drift', wildfire:'drift' };

let actx = null, musBus = null, musOn = true, musTrack = null, musMeter = null;
let beatCursor = 0, nextBeatAt = 0, musTimer = null;

function initAudio(){
  if(actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  musBus = actx.createGain(); musBus.gain.value = 0;
  const lp = actx.createBiquadFilter();          // takes the edge off — no chiptune buzz
  lp.type = 'lowpass'; lp.frequency.value = 3200; lp.Q.value = 0.6;
  const dly = actx.createDelay(1.0); dly.delayTime.value = 0.36;
  const fb = actx.createGain(); fb.gain.value = 0.3;
  const wet = actx.createGain(); wet.gain.value = 0.3;
  // A limiter on the end so the whole thing can sit at a real listening level
  // without the pad, bass and melody peaks stacking up into clipping.
  const comp = actx.createDynamicsCompressor();
  comp.threshold.value = -12; comp.knee.value = 8;
  comp.ratio.value = 6; comp.attack.value = 0.01; comp.release.value = 0.2;
  musBus.connect(lp); lp.connect(comp);
  lp.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(wet); wet.connect(comp);
  musMeter = actx.createAnalyser(); musMeter.fftSize = 2048;
  comp.connect(musMeter);
  comp.connect(actx.destination);
}
const hz = m => 440 * Math.pow(2, (m - 69) / 12);

let noteCount = 0;
function voice(t, midi, dur, peak, type, detune){
  noteCount++;
  const o = actx.createOscillator();
  o.type = type; o.frequency.value = hz(midi); o.detune.value = detune || 0;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + 0.07);          // soft attack, never a click
  g.gain.setTargetAtTime(0.0001, t + dur * 0.6, dur * 0.3);
  o.connect(g); g.connect(musBus);
  o.start(t); o.stop(t + dur + 1.4);
}

function musicTick(){
  if(!musTrack || !actx) return;
  const s = SCORES[musTrack], spb = 60 / s.bpm;
  while(nextBeatAt < actx.currentTime + 0.3){
    const b = beatCursor % s.len, t = nextBeatAt;
    if(b % 4 === 0){
      const bar = (b / 4) | 0;
      s.chords[bar].forEach((n, i) => {            // pad, two slightly detuned layers
        voice(t, n, spb * 3.8, 0.055, 'sine', -6);
        voice(t, n + 12, spb * 3.8, 0.026, 'sine', 6 + i * 3);
      });
      voice(t, s.bass[bar], spb * 3.6, 0.150, 'sine');
      voice(t, s.bass[bar] + 12, spb * 3.6, 0.045, 'triangle');
    }
    s.mel.forEach(e => {
      if(e[0] !== b) return;
      voice(t, e[2], e[1] * spb, 0.190, s.lead, -4);   // two detuned copies = warmth
      voice(t, e[2], e[1] * spb, 0.120, s.lead, 5);
      voice(t, e[2] - 12, e[1] * spb, 0.045, 'sine');
    });
    beatCursor++; nextBeatAt += spb;
  }
}

function startMusic(){
  if(!musOn) return;
  initAudio();
  if(actx.state === 'suspended') actx.resume();
  if(musTimer) return;
  musTrack = BIOME_TRACK[biome] || 'doggo';
  beatCursor = 0; nextBeatAt = actx.currentTime + 0.15;
  musBus.gain.setTargetAtTime(1.0, actx.currentTime, 0.45);
  musTimer = setInterval(musicTick, 30);
}
function musicForBiome(){
  const want = BIOME_TRACK[biome] || 'doggo';
  if(!musTimer || want === musTrack) { musTrack = want; return; }
  musTrack = want; beatCursor = 0; nextBeatAt = actx.currentTime + 0.15;
}
function toggleMusic(){
  musOn = !musOn;
  if(musOn){ startMusic(); }
  else {
    if(musBus) musBus.gain.setTargetAtTime(0, actx.currentTime, 0.25);
    clearInterval(musTimer); musTimer = null;
  }
  hudBiome.textContent = biome + (musOn ? '' : ' · muted');
}

// ───────────────────────────────────────────── input
const keys = {};
const held = { left:false, right:false, up:false, jump:false, use:false };
// any real gesture anywhere unlocks audio, not just the on-screen buttons
addEventListener('pointerdown', startMusic);

// where Airplane Doggo is aiming. Canvas space; add ox/oy for world space.
let mouseX = null, mouseY = null;
addEventListener('pointermove', e => {
  const r = cv.getBoundingClientRect();
  if(!r.width || !r.height) return;
  mouseX = (e.clientX - r.left) / r.width  * VIEW_W;
  mouseY = (e.clientY - r.top)  / r.height * VIEW_H;
});
addEventListener('keydown', e => {
  startMusic();
  if(e.code==='KeyM'){ toggleMusic(); return; }
  if(keys[e.code]) return; keys[e.code] = true;
  if(rosterOpen) rosterKey(e);
  else if(e.code==='KeyE') action();
  if(e.code==='KeyR') reset();
  if(e.code==='KeyB' && !rosterOpen)
    setBiome(BIOME_NAMES[(BIOME_NAMES.indexOf(biome)+1) % BIOME_NAMES.length]);
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
const L = () => held.left  || keys.ArrowLeft  || keys.KeyA;
const R = () => held.right || keys.ArrowRight || keys.KeyD;
const U = () => held.up    || keys.ArrowUp    || keys.KeyW;
const D = () => keys.ArrowDown || keys.KeyS;
const J = () => held.jump  || keys.Space;      // up is for LOOKING, not jumping

if(matchMedia('(pointer:coarse)').matches) document.body.classList.add('touch');
document.querySelectorAll('#pad button').forEach(b => {
  const k = b.dataset.k;
  const on  = e => { e.preventDefault(); startMusic();
                     if(k==='use') action(); else held[k]=true; };
  const off = e => { e.preventDefault(); if(k!=='use') held[k]=false; };
  b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off);
  b.addEventListener('pointercancel',off); b.addEventListener('pointerleave',off);
});

// one action button: a kennel if you're standing at one, otherwise whatever this doggo does
function action(){
  if(rosterOpen) return;
  if(nearKennel()) { openRoster(); return; }
  if(player.char.move === 'dash' && player.dashCd <= 0){
    player.dash = DASH_TIME; player.dashCd = DASH_CD;
    player.vx = player.face * DASH_SPEED;
    sfx('bark', 0.5);
    // 5 damage. Anything you touch barely notices — but it DOES notice.
    enemies.forEach(e => {
      if(e.dead || e.K.inert) return;
      if(Math.abs(e.x+e.w/2 - (player.x+player.w/2)) < 44 &&
         Math.abs(e.y+e.h/2 - (player.y+player.h/2)) < 44) hurtRobot(e, DMG.dashRobo, null);
    });
  }
}

function pickRoster(){

function perRow(){
  return Math.max(1, Math.floor(cardsEl.clientWidth / (cardsEl.children[0].offsetWidth + 9)));
}
function rosterKey(e){
  const n = CAST.length, k = perRow();
  if(e.code==='ArrowLeft'){ rosterSel = (rosterSel+n-1)%n; drawRoster(); }
  if(e.code==='ArrowRight'){ rosterSel = (rosterSel+1)%n; drawRoster(); }
  if(e.code==='ArrowUp'){ rosterSel = (rosterSel-k+n)%n; drawRoster(); }
  if(e.code==='ArrowDown'){ rosterSel = (rosterSel+k)%n; drawRoster(); }
  if(e.code==='Enter'||e.code==='KeyE'||e.code==='Space') pickRoster();
  if(e.code==='Escape') closeRoster();
}
function nearKennel(){
  const cx = (player.x+player.w/2)/T, cy = (player.y+player.h/2)/T;
  for(let r=0;r<MAP_H;r++) for(let c=0;c<MAP_W;c++)
    if(grid[r][c]==='K' && Math.abs(c+0.5-cx)<1.4 && Math.abs(r+1-cy)<2) return {c,r};
  return null;
}

function reset(){
  doors.forEach(d => d.open = false);
  plasmaOpen = false; orbs.length = 0; vapor.length = 0;
  COINS.forEach(c => c.got = false);
  coinsGot = 0; hudCoins.textContent = `0 / ${COINS.length} coins`;
  player.x = 4*T; player.vx = 0; player.vy = 0;
  becomeDoggo(byId('barkmc'));
  player.y = 18*T - player.h;
  player.hp = 100; player.hurt = 0; player.dash = 0; player.dashCd = 0;
  byId('dalmatian').locked = true; rebuildCards();
  enemies.length = 0; lasers.length = 0; sparks.length = 0;
  buildEnemies();
  SHUTTERS.forEach(sh => sh.door.open = false);
  PANEL_COLS.forEach(c => { for(let r=13;r<18;r++) if(grid[r][c]==='.') grid[r][c]='P'; });
  checkpoint = { x:4*T, y:18*T-36 };
  seen.clear();
  bannerEl.classList.remove('on'); cleared = false;
}

buildEnemies();

SHUTTERS.push(
  { door: doorAt(150,15), zone:[117,149],
    title:'ROOM CLEAR', text:'The shutter releases. They only guard what is still standing.' },
  { door: doorAt(190,15), zone:[151,189],
    title:'THE CELL RELEASES', text:'Something is moving in there.' },
