// checkpoints — the start of each room you can die in
const CHECKS = [[4,18],[48,18],[78,18],[118,18],[152,18],[192,18]];
let checkpoint = { x:4*T, y:18*T-36 };

// ── the beats that fire once, when you walk into them
function storyBeats(dt){
  const tx = (player.x + player.w/2) / T;
  const once = (key, fn) => { if(!seen.has(key)){ seen.add(key); fn(); } };

  for(const [c,r] of CHECKS) if(player.x > c*T - 40) checkpoint = { x:c*T, y:r*T-36 };

  if(tx > 12 && tx < 14) once('block', () => say('THE CELL BLOCK',
    'Every door is already open. Every doghouse is already empty. You are the last one in here.'));
  if(tx > 48 && tx < 50) once('cyc', () => say('IT DOES NOT LOOK UP',
    'The chip is holding — walk calmly and it leaves you alone. Crowd it, sprint, or DASH and it works you out. ' +
    'The way on is the cracked wall at the far end, and you cannot break it. It can.'));
  if(tx > 79 && tx < 83) once('scrap', () => say('THE DISMANTLED ONE',
    '"...unit. unit. they took them UP. all of them, up, to ALPHA. you are not on the manifest. why are you not on the—"'));
  if(tx > 88 && tx < 99 && !seen.has('water') && inWater(player))
    once('water', () => say('THE FLOODED STAIRWELL',
      'It goes down a long way. Something in the dark below is still running lights. THE AQUADEPTHS. Not today — you cannot swim.'));
  if(tx > 110 && tx < 113) once('door', () => say('THE CHIP DOES NOTHING',
    'No reader. No panel. This was bolted shut from the other side by something with paws. DELETION DEPTHS HIGHWAY.'));
  if(tx > 118 && tx < 120) once('patrol', () => say('TWO OF THEM',
    'A gun and a fist. Stand so the gun is looking through the fist.'));
  if(tx > 152 && tx < 154) once('guard', () => say('THE GUARD ROOM',
    'Three. Four hundred and thirty-five between them, and five damage in your teeth. Not your fight — theirs.'));
}

// ───────────────────────────────────────────── update
let cleared = false, spin = 0;
function update(dt){
  if(sayT > 0){ sayT -= dt; if(sayT <= 0) sayEl.classList.remove('on'); }
  if(rosterOpen) return;
  const ch = player.char;
  player.digging = ch.move==='dig' && overlapsDirt(player);

  // ── bunker timers
  if(player.hurt   > 0) player.hurt   -= dt;
  if(player.dashCd > 0) player.dashCd -= dt;
  if(player.dash   > 0){
    player.dash -= dt;
    player.vx = player.face * DASH_SPEED;      // committed, straight, and brief
  }
  updateEnemies(dt);
  storyBeats(dt);
  hpFill.style.width = Math.max(0, player.hp) + '%';
  hpFill.style.background = player.hp > 55 ? '#3ddc84' : player.hp > 25 ? '#ffc93c' : '#e63946';

  if(player.digging){
    const ix = (R()?1:0) - (L()?1:0);
    const iy = (D()?1:0) - (U()||J()?1:0);
    player.vx = ix*DIG_SPEED; player.vy = iy*DIG_SPEED || 40;
    if(ix) player.face = ix;
    player.gliding = false;
  } else {
    const ix = (R()?1:0) - (L()?1:0);
    if(ix){
      // Turning gets full bite, so a doggo that takes a while to WIND UP still
      // answers the stick immediately — that's the difference between "heavy" and
      // "slippery".
      const turning = ix * player.vx < 0;
      player.vx += ix * ACCEL * (ch.accelMul || 1) * (turning ? 2.8 : 1) * dt;
      player.face = ix;
    } else {
      const f = FRICTION * (ch.frictionMul || 1) * dt;
      player.vx = Math.abs(player.vx) <= f ? 0 : player.vx - Math.sign(player.vx)*f;
    }
    const zooming = player.zoom > 0;
    const flying  = ch.move==='glide' && !player.onGround && player.vy > 0 && J();
    const base = RUN * (ch.speedMul || 1) * (zooming ? ZOOM_SPEED : 1);
    const cap  = flying ? PLANE_RUN : base;
    player.vx = Math.max(-cap, Math.min(cap, player.vx));

    if(player.onGround){ player.coyote = COYOTE; player.wallCoyote = 0; }
    else player.coyote -= dt;
    player.wallCoyote -= dt;
    if(J() && !keys._jheld) player.buffer = BUFFER; else player.buffer -= dt;
    keys._jheld = J();

    const jm = (ch.jumpMul || 1) * (zooming ? ZOOM_JUMP : 1);
    if(player.buffer>0 && player.coyote>0){
      player.vy = JUMP_V * jm;
      player.buffer = 0; player.coyote = 0; player.onGround = false;
    } else if(zooming && player.buffer>0 && player.wallCoyote>0 && player.wall){
      player.vy = JUMP_V * jm * 0.92;              // wall kick, away from the wall
      player.vx = -player.wall * RUN * ZOOM_SPEED * WALL_KICK;
      player.face = Math.sign(player.vx);
      player.buffer = 0; player.wallCoyote = 0;
    }
    const cut = -170 * jm;
    if(player.vy < cut && !J()) player.vy = cut;

    if(player.onGround){ player.flightT = 0; player.lift = PLANE_LIFT; }
    player.gliding = player.thrusting = flying;
    if(flying){
      const waist = player.y + player.h*0.5;
      const my = mouseY === null ? waist : mouseY + oy;
      const above = my < waist - PLANE_DEAD, below = my > waist + PLANE_DEAD;
      player.lifting = above && player.lift > 0;
      player.diving  = below;
      if(player.lifting) player.lift -= dt; else player.flightT += dt;
      const sink = player.diving  ? PLANE_DIVE
                 : player.lifting ? PLANE_HOLD
                 : Math.min(MAX_FALL, PLANE_SINK0 * Math.exp(player.flightT / PLANE_TAU));
      player.vy += (sink - player.vy) * Math.min(1, (player.diving ? 14 : 9)*dt);
    } else {
      player.lifting = player.diving = false;
      player.vy += GRAV*dt;
      player.vy = Math.min(player.vy, MAX_FALL);
    }
  }

  player.onGround = false;
  player.x += player.vx*dt; collide('x');
  player.y += player.vy*dt; collide('y');

  // the chip: robo doors just open for whoever is wearing one, and stay open.
  // PASSIVE — never gate this on `move`, that slot belongs to the dash.
  if(ch.chip){
    const c0=Math.floor((player.x-6)/T), c1=Math.floor((player.x+player.w+5)/T);
    const r0=Math.floor(player.y/T), r1=Math.floor((player.y+player.h-1)/T);
    for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++){
      const d = doorAt(c,r);
      if(d && d.kind === 'R' && !d.open){ d.open = true; d.t = 0; sfx('pop', 0.45); }
    }
  }
  doors.forEach(d => { if(d.open) d.t = Math.min(1, (d.t||0) + dt*3); });

  // plasma orbs
  for(let i=orbs.length-1;i>=0;i--){
    const o = orbs[i];
    o.x += o.vx*dt; o.life -= dt;
    const c = Math.floor(o.x/T), r = Math.floor(o.y/T);
    const t = (c>=0&&c<MAP_W&&r>=0&&r<MAP_H) ? grid[r][c] : '#';
    if(t==='S'){ plasmaOpen = true; orbs.splice(i,1); continue; }
    const hard = t==='#' || t==='d' || (t==='B' && !plasmaOpen) ||
                 (t==='R' && !(doorAt(c,r)||{}).open);
    if(hard || o.life<=0) orbs.splice(i,1);
  }

  // periscope — coyote, not onGround: standing still makes onGround flicker frame to frame
  const wantPeri = ch.move==='look' && player.coyote > 0 && Math.abs(player.vx) < 12 && U();
  player.peri = Math.max(0, Math.min(1, player.peri + (wantPeri ? dt*2.2 : -dt*3.2)));

  if(player.zoom > 0){
    player.zoom = Math.max(0, player.zoom - dt);
    player.trail.unshift({x:player.x, y:player.y, f:player.face});
    if(player.trail.length > 7) player.trail.pop();
    const left = Math.ceil(player.zoom);
    if(left !== player._zshown){
      player._zshown = left;
      hudMove.textContent = left ? `ZOOMIES — ${left}s` : ch.blurbCache || ch.ability;
    }
    if(player.zoom === 0){
      player.trail.length = 0;
      hudMove.textContent = `atk ${ch.atk} · spd ${ch.spd} — ${ch.ability}`;
    }
  } else if(player.trail.length) player.trail.length = 0;

  // wingtip condensation — spawn off the back of the wing while the engine is lit,
  // then let each puff drift, swell and thin out
  if(player.thrusting){
    const tipX = player.x + (player.face > 0 ? 2 : player.w - 2);
    const tipY = player.y + player.h*0.72;
    for(let i=0;i<(player.lifting?3:2);i++)      // denser while he's straining
      vapor.push({ x: tipX, y: tipY + (i?5:-3),
                   vx: -player.face*(40 + Math.random()*50) + player.vx*0.12,
                   vy: -14 - Math.random()*22,
                   t: 0, life: 0.55 + Math.random()*0.35 });
  }
  for(let i=vapor.length-1;i>=0;i--){
    const p = vapor[i];
    p.t += dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= 0.94; p.vy *= 0.96;
    if(p.t >= p.life) vapor.splice(i,1);
  }

  // You cannot swim DOWN — that's the gate. But you must always be able to get
  // back OUT, or the first promise in the game is a hole you drown in.
  // You bob to the surface, keep steering, and can haul yourself out.
  if(inWater(player)){
    player.vy = Math.min(player.vy, 0) - 240*dt;
    player.vx *= 0.94;
    if(player.y + player.h > 18*T + 10){
      player.y = 18*T + 10 - player.h;
      player.vy = Math.min(player.vy, 0);
    }
    player.coyote = COYOTE;                 // treading water counts as footing
  }

  spin += dt*11;
  COINS.forEach(c => {
    if(c.got) return;
    if(player.x < c.x+13 && player.x+player.w > c.x-13 &&
       player.y < c.y+15 && player.y+player.h > c.y-15){
      c.got = true; coinsGot++; sfx('coin', 0.35);
      hudCoins.textContent = `${coinsGot} / ${COINS.length} coins`;
    }
  });

  player.phase += Math.abs(player.vx)*dt*0.06;

  // ── DALMATIAN. The roster goes from one to two.
  if(!seen.has('dal') && Math.abs(player.x - 194*T) < 2*T && player.y > 15*T){
    seen.add('dal');
    byId('dalmatian').locked = false; rebuildCards();
    sfx('bark', 0.9);
    say('DALMATIAN', 'He has been in there the whole time. He wants to know where Doggo is. ' +
        'Press E at his kennel — the roster is two now.');
  }

  const gx = 211*T, gy = 6*T;
  if(!cleared && player.x+player.w > gx && player.x < gx+4*T &&
     player.y+player.h > gy && player.y < gy+2*T){
    cleared = true; bannerEl.classList.add('on');
  }

  const k = nearKennel();
  tipEl.classList.toggle('hot', !!k);
  tipEl.textContent = k ? 'KENNEL — press E to change doggo'
    : (document.body.classList.contains('touch')
        ? '← → move · ↑ look · JUMP · E dash'
        : '← → / A D move · Space jump · ↑ look · E DASH · M music · R restart');
}

// ───────────────────────────────────────────── drawing
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
function fitCanvas(){
  const wrap = document.getElementById('wrap');
  const s = Math.min(wrap.clientWidth/VIEW_W, wrap.clientHeight/VIEW_H);
  const dpr = Math.min(2, devicePixelRatio||1);
  cv.width = Math.round(VIEW_W*s*dpr); cv.height = Math.round(VIEW_H*s*dpr);
  cv.style.width = (VIEW_W*s)+'px'; cv.style.height = (VIEW_H*s)+'px';
  ctx.setTransform(s*dpr,0,0,s*dpr,0,0);
}
addEventListener('resize', fitCanvas);

function rr(g,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  g.beginPath();
  g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}
function shade(hex,amt){
  const n = parseInt(hex.slice(1),16);
  const cl = v => Math.max(0,Math.min(255,v));
  return '#'+[(n>>16)+amt,((n>>8)&255)+amt,(n&255)+amt]
    .map(v=>cl(v).toString(16).padStart(2,'0')).join('');
}

// Adam's art if this doggo has any, otherwise a placeholder vector doggo in a hat.
function drawDog(g,x,y,ch,face,phase,st){
  // Qorvex carries a second, torn-up drawing — flick to it now and then so he
  // never quite holds still.
  const key = (ch.art2 && Math.floor(spin*2.4) % 11 === 0) ? ch.art2 : ch.art;
  const img = key && IMG[key];
  if(img && img.complete && img.naturalWidth){
    const dh = st.dh || ch.dh || DOG_H;
    const s  = dh / img.naturalHeight;
    const dw = img.naturalWidth * s;
    const moving = !!st.moving;
    const bob  = moving ? Math.abs(Math.sin(phase*2))*2.2 : 0;
    const tilt = st.gliding ? 0                    // stays dead level in the air
               : (moving ? Math.sin(phase)*0.045 : 0);
    g.save();
    g.translate(x + ch.w/2, y + ch.h);
    g.rotate(tilt*(face<0?-1:1));
    g.scale(face<0?-1:1, 1);
    const N = ch.neck;
    if(N && st.peri > 0.01){
      const iw = img.naturalWidth, ih = img.naturalHeight, s = dh/ih;
      const hSrc = N.head*ih, nSrc = (N.body-N.head)*ih, bSrc = (1-N.body)*ih;
      const ext = st.peri * dh * 0.7;
      const bTop = -bSrc*s, nTop = bTop - nSrc*s - ext, hTop = nTop - hSrc*s;
      g.drawImage(img, 0, N.body*ih, iw, bSrc, -dw/2, bTop, dw, bSrc*s);
      g.drawImage(img, 0, N.head*ih, iw, nSrc, -dw/2, nTop, dw, nSrc*s + ext);
      g.drawImage(img, 0, 0,         iw, hSrc, -dw/2, hTop, dw, hSrc*s);
    } else {
      g.drawImage(img, -dw/2, -dh + bob, dw, dh);
    }
    g.restore();
    return;
  }

  const w = ch.w, h = ch.h, col = ch.col;
  const bodyH = h*0.70, legTop = y + bodyH;
  const swing = Math.sin(phase)*Math.min(5, w*0.22);
  const dark = shade(col,-45);

  g.strokeStyle = dark; g.lineWidth = Math.max(3, w*0.14); g.lineCap = 'round';
  g.beginPath();
  g.moveTo(x+w*0.30+swing, legTop-1); g.lineTo(x+w*0.30+swing*0.4, y+h-1);
  g.moveTo(x+w*0.70-swing, legTop-1); g.lineTo(x+w*0.70-swing*0.4, y+h-1);
  g.stroke();

  g.strokeStyle = col; g.lineWidth = Math.max(3, w*0.13);
  g.beginPath();
  const tx = face>0 ? x : x+w;
  g.moveTo(tx, y+bodyH*0.45);
  g.quadraticCurveTo(tx-face*w*0.28, y+bodyH*0.30, tx-face*w*0.22, y+bodyH*0.02);
  g.stroke();

  g.fillStyle = dark;
  if(st.gliding){
    g.beginPath();
    g.moveTo(x+w*0.18, y+bodyH*0.22);
    g.lineTo(x-w*0.55, y+bodyH*0.02); g.lineTo(x+w*0.20, y+bodyH*0.50); g.fill();
    g.beginPath();
    g.moveTo(x+w*0.82, y+bodyH*0.22);
    g.lineTo(x+w*1.55, y+bodyH*0.02); g.lineTo(x+w*0.80, y+bodyH*0.50); g.fill();
  } else {
    g.beginPath();
    g.moveTo(x+w*0.20, y+bodyH*0.30); g.lineTo(x+w*0.10, y-bodyH*0.22);
    g.lineTo(x+w*0.46, y+bodyH*0.12); g.fill();
    g.beginPath();
    g.moveTo(x+w*0.80, y+bodyH*0.30); g.lineTo(x+w*0.90, y-bodyH*0.22);
    g.lineTo(x+w*0.54, y+bodyH*0.12); g.fill();
  }

  g.fillStyle = col; rr(g,x,y,w,bodyH,Math.min(w,bodyH)*0.42); g.fill();

  if(ch.hat === 'spots'){
    g.fillStyle = '#2c2a33';
    [[0.28,0.30,0.11],[0.62,0.52,0.09],[0.44,0.72,0.07]].forEach(([a,b,r])=>{
      g.beginPath(); g.arc(x+w*a, y+bodyH*b, w*r, 0, 7); g.fill();
    });
  }

  g.fillStyle = shade(col,22);
  const sx = face>0 ? x+w*0.58 : x+w*0.06;
  rr(g,sx,y+bodyH*0.46,w*0.36,bodyH*0.34,bodyH*0.16); g.fill();
  g.fillStyle = '#241f3d';
  g.beginPath();
  g.arc(face>0 ? sx+w*0.30 : sx+w*0.06, y+bodyH*0.60, Math.max(1.6,w*0.065), 0, 7); g.fill();

  const ex = face>0 ? x+w*0.56 : x+w*0.44;
  if(ch.hat === 'shades'){
    g.fillStyle = '#1b1830';
    rr(g, x+w*0.34, y+bodyH*0.20, w*0.52, bodyH*0.20, 3); g.fill();
  } else {
    g.fillStyle = '#fff';
    g.beginPath(); g.arc(ex, y+bodyH*0.30, Math.max(2.6,w*0.13), 0, 7); g.fill();
    g.fillStyle = '#1b1830';
    g.beginPath(); g.arc(ex+face*w*0.035, y+bodyH*0.31, Math.max(1.4,w*0.065), 0, 7); g.fill();
  }

  const hx = x+w*0.5, hy = y - bodyH*0.06;
  switch(ch.hat){
    case 'cowboy':
      g.fillStyle = '#7a4a24';
      rr(g, x-w*0.16, hy-2, w*1.32, 5, 2.5); g.fill();
      rr(g, x+w*0.24, hy-11, w*0.52, 11, 3); g.fill();
      break;
    case 'crown':
      g.fillStyle = '#ffd75e';
      g.beginPath();
      g.moveTo(x+w*0.22, hy); g.lineTo(x+w*0.22, hy-9); g.lineTo(x+w*0.36, hy-4);
      g.lineTo(x+w*0.50, hy-12); g.lineTo(x+w*0.64, hy-4); g.lineTo(x+w*0.78, hy-9);
      g.lineTo(x+w*0.78, hy); g.closePath(); g.fill();
      break;
    case 'helm':
      g.fillStyle = '#c3cad8';
      rr(g, x+w*0.16, hy-11, w*0.68, 14, 5); g.fill();
      g.fillStyle = '#3a4152';
      rr(g, x+w*0.20, hy-4, w*0.60, 3.5, 1.5); g.fill();
      break;
    case 'antenna':
      g.strokeStyle = shade(col,-55); g.lineWidth = 2.4;
      g.beginPath(); g.moveTo(hx, hy); g.lineTo(hx+3, hy-12); g.stroke();
      g.fillStyle = '#ff4d6d';
      g.beginPath(); g.arc(hx+3, hy-14, 3.4, 0, 7); g.fill();
      break;
    case 'party':
      g.fillStyle = '#4cc9f0';
      g.beginPath();
      g.moveTo(x+w*0.34, hy); g.lineTo(x+w*0.62, hy); g.lineTo(x+w*0.46, hy-15);
      g.closePath(); g.fill();
      g.fillStyle = '#ffd166';
      g.beginPath(); g.arc(x+w*0.46, hy-16, 2.6, 0, 7); g.fill();
      break;
  }
}

// Two passes so the whole mass reads as one shape: every rect fattened and drawn
// in the dark shade first, then every rect drawn in its gradient on top. Abutting
// rects overlap by PAD*2 so no seam or corner notch survives, and the only dark
// left showing is the outline around the outside — a darker version of the fill,
// never black.
const PAD = 2, OUT = 10, GRASS_H = 15;
let C = { ...BASE_C, ...BIOMES[biome].C };
function setBiome(name){
  biome = name;
  C = { ...BASE_C, ...BIOMES[name].C };
  hudBiome.textContent = name + (musOn ? '' : ' · muted');
  musicForBiome();
}
const radOf = r => 8 + ((r.x*7 + r.y*13) % 5) * 1.6;

// deterministic in WORLD space so the squiggle doesn't crawl when the camera moves
function droop(wx){
  return Math.sin(wx*0.13)*2.4 + Math.sin(wx*0.041 + 1.7)*3.4 + Math.sin(wx*0.0071 + 0.4)*2.6
       + Math.pow(Math.max(0, Math.sin(wx*0.023 + 2.2)), 7) * 15;
}
const hash = (a,b) => { const s = Math.sin(a*12.9898 + b*78.233)*43758.5453; return s - Math.floor(s); };

// Seed and place textures in WORLD space, then subtract the camera. Seeding from
// screen coords re-rolls the noise every pixel of scroll and the ground boils.
function blobs(wx, wy, w, h, n, col, rmin, rmax){
  ctx.fillStyle = col;
  for(let i=0;i<n;i++){
    const bx = wx + hash(i, wy)*w, by = wy + hash(i+91, wx)*h;
    const rad = rmin + hash(i+37, wy+i)*(rmax-rmin);
    ctx.beginPath();
    ctx.ellipse(bx-ox, by-oy, rad, rad*(0.6 + hash(i+7,wx)*0.5), hash(i,i)*3, 0, 7);
    ctx.fill();
  }
}

// subtle cracks and # marks, world-anchored
function stoneMarks(r){
  // Poured concrete, not cave rock: cast lines, a soft top light, and the odd
  // bolt. World-seeded, so it can't boil when the camera moves.
  ctx.save();
  const g = ctx.createLinearGradient(0, r.y-oy, 0, r.y-oy + Math.min(r.h, 90));
  g.addColorStop(0, 'rgba(255,255,255,.55)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(r.x-ox, r.y-oy, r.w, Math.min(r.h, 90));

  // one or two irregular pour lines per mass — never a lattice
  ctx.strokeStyle = 'rgba(120,132,148,.26)'; ctx.lineWidth = 1.4;
  const joints = Math.min(3, Math.max(0, (r.w/260)|0));
  for(let i=0;i<joints;i++){
    const x = r.x + (i + 0.5 + (hash(i, r.y)-0.5)*0.6) * (r.w/joints);
    ctx.beginPath(); ctx.moveTo(x-ox+0.5, r.y-oy); ctx.lineTo(x-ox+0.5, r.y+r.h-oy); ctx.stroke();
  }

  const n = Math.max(1, (r.w*r.h)/26000|0);                        // tie-rod bolts
  for(let i=0;i<n;i++){
    const bx = r.x + hash(i, r.y)*r.w - ox, by = r.y + hash(i+61, r.x)*r.h - oy;
    ctx.fillStyle = 'rgba(140,152,168,.34)';
    ctx.beginPath(); ctx.arc(bx, by, 3, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.beginPath(); ctx.arc(bx-0.8, by-0.8, 1.3, 0, 7); ctx.fill();
  }
  ctx.restore();
}

function drawTerrain(){
  const vis = ROCK.filter(r => r.x - ox < VIEW_W + 60 && r.x + r.w - ox > -60 &&
                               r.y - oy < VIEW_H + 60 && r.y + r.h - oy > -60);

  vis.forEach(r => {                                   // outline: darker shade, never black
    if(r.platform) return;                             // his blobs carry their own outline
    const ex = r.x-ox-PAD-OUT, ey = r.y-oy-PAD-OUT;
    const ew = r.w+(PAD+OUT)*2, eh = r.h+(PAD+OUT)*2, er = radOf(r)+OUT;
    ctx.fillStyle = r.stone ? C.stoneEdge : C.earthEdge;
    rr(ctx, ex, ey, ew, eh, er); ctx.fill();
    if(r.grass){
      // the rim ABOVE a grass mass belongs to the grass, so it's dark green, not
      // dark brown — the sides stay brown because the sides are dirt
      ctx.save();
      ctx.beginPath(); ctx.rect(ex, ey, ew, OUT+PAD+1); ctx.clip();
      ctx.fillStyle = C.grassEdge;
      rr(ctx, ex, ey, ew, eh, er); ctx.fill();
      ctx.restore();
    }
  });

  vis.forEach(r => {
    if(r.platform){
      const n = BIOMES[biome].plats;
      const im = TERRAIN_IMG[biome + '-plat' + ((((r.x/T)|0) + ((r.y/T)|0)) % n + 1)];
      if(im && im.complete && im.naturalWidth)
        ctx.drawImage(im, r.x-ox-7, r.y-oy-6, r.w+14, r.h+13);
      return;
    }
    const x = r.x-ox-PAD, y = r.y-oy-PAD, w = r.w+PAD*2, h = r.h+PAD*2;
    ctx.save();
    rr(ctx, x, y, w, h, radOf(r)); ctx.clip();

    if(r.stone){
      const g = ctx.createLinearGradient(0, y, 0, y + Math.min(h, 260));
      g.addColorStop(0, C.stone); g.addColorStop(1, C.stoneLow);
      ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
      stoneMarks(r);
    } else {
      const g = ctx.createLinearGradient(0, y, 0, y + Math.min(h, 300));
      g.addColorStop(0, C.earth); g.addColorStop(1, C.earthLow);
      ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
      blobs(r.x, r.y, r.w, r.h, Math.max(3, (r.w*r.h)/5200|0), 'rgba(60,38,20,.30)', 5, 15);

      if(r.grass){
        const im = TERRAIN_IMG[biome + '-ground'], STRIP_H = BIOMES[biome].stripH;
        if(im && im.complete && im.naturalWidth){
          // Tile his strip, aligned to WORLD positions so it can't slide as you walk.
          const s = STRIP_H / im.naturalHeight, tw = im.naturalWidth * s;
          const x0 = Math.floor(r.x / tw) * tw;
          for(let px = x0; px < r.x + r.w + tw; px += tw)
            ctx.drawImage(im, Math.round(px-ox), Math.round(r.y-oy-PAD),
                          Math.ceil(tw)+1, STRIP_H);
        } else {
          ctx.fillStyle = C.grass; ctx.fillRect(x, y, w, GRASS_H);
        }
      }
    }
    ctx.restore();
  });
}

function drawLooseDirt(){
  const vis = DIRT.filter(r => r.x - ox < VIEW_W + 60 && r.x + r.w - ox > -60 &&
                               r.y - oy < VIEW_H + 60 && r.y + r.h - oy > -60);
  ctx.fillStyle = C.looseEdge;
  vis.forEach(r => { rr(ctx, r.x-ox-PAD-OUT, r.y-oy-PAD-OUT,
                         r.w+(PAD+OUT)*2, r.h+(PAD+OUT)*2, 8+OUT); ctx.fill(); });
  vis.forEach(r => {
    const x = r.x-ox-PAD, y = r.y-oy-PAD, w = r.w+PAD*2, h = r.h+PAD*2;
    ctx.save(); rr(ctx, x, y, w, h, 6); ctx.clip();
    const g = ctx.createLinearGradient(0, y, 0, y+h);
    g.addColorStop(0, C.loose); g.addColorStop(1, C.looseLow);
    ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = C.crack; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    for(let i=0;i<Math.max(4, (r.w*r.h)/700|0); i++){      // crackle, world-anchored
      let cx = r.x + hash(i, r.y)*r.w, cy = r.y + hash(i+53, r.x)*r.h;
      ctx.beginPath(); ctx.moveTo(cx-ox, cy-oy);
      for(let k=0;k<3;k++){
        cx += (hash(i+k, k)-0.5)*16; cy += (hash(i+k+9, k)-0.5)*16;
        ctx.lineTo(cx-ox, cy-oy);
      }
      ctx.stroke();
    }
    ctx.restore();
  });
}

function drawSky(){
  const sy = SURFACE - oy;                               // ground line, in screen space
  const g = ctx.createLinearGradient(0, -oy, 0, sy);
  g.addColorStop(0, C.skyTop); g.addColorStop(1, C.skyLow);
  ctx.fillStyle = g; ctx.fillRect(0, 0, VIEW_W, Math.max(0, sy));

  ctx.fillStyle = 'rgba(255,255,255,.72)';               // clouds
  for(let i=0;i<14;i++){
    const cx = ((i*337 - ox*0.18) % (VIEW_W+420)) - 210;
    const cy = 40 + (i%4)*62 - oy*0.35, s = 20 + (i%3)*10;
    ctx.beginPath();
    ctx.ellipse(cx, cy, s*1.9, s*0.72, 0, 0, 7);
    ctx.ellipse(cx+s*0.9, cy-s*0.34, s*1.1, s*0.66, 0, 0, 7);
    ctx.ellipse(cx-s*1.0, cy-s*0.14, s*0.9, s*0.52, 0, 0, 7);
    ctx.fill();
  }
  [[0.10, C.hillFar, 118], [0.22, C.hill, 74]].forEach(([par, col, amp]) => {
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, sy);
    for(let x=0; x<=VIEW_W; x+=14){
      const wx = x + ox*par;
      ctx.lineTo(x, sy - amp - Math.sin(wx*0.0032)*amp*0.42 - Math.sin(wx*0.0011+2)*amp*0.3);
    }
    ctx.lineTo(VIEW_W, sy); ctx.closePath(); ctx.fill();
  });

  const deep = MAP_H*T;                                   // underground backdrop
  ctx.fillStyle = C.under;
  ctx.fillRect(0, sy, VIEW_W, VIEW_H - sy);
  ctx.save(); ctx.beginPath(); ctx.rect(0, sy, VIEW_W, VIEW_H - sy); ctx.clip();
  ctx.fillStyle = C.underMud;                             // mud spots, pinned to world cells
  const CELL = 210, k0 = Math.floor(ox/CELL)-1, k1 = Math.ceil((ox+VIEW_W)/CELL);
  for(let k=k0;k<=k1;k++) for(let j=0;j<4;j++){
    const bx = k*CELL + hash(k, j)*CELL - ox;
    const by = SURFACE + hash(k+5, j)*(deep-SURFACE) - oy;
    const rad = 9 + hash(k+11, j)*21;
    ctx.beginPath();
    ctx.ellipse(bx, by, rad, rad*(0.55 + hash(k, j+3)*0.5), hash(k,j)*3, 0, 7);
    ctx.fill();
  }
  ctx.restore();
}

// Runs the exact flight model forward from where he is now, assuming you hold the
// cursor where it is, and reports where he'd touch down. He stays level in the air,
// so this marker is the only thing telling you where you're actually going.
function predictLanding(){
  const ch = player.char, step = 1/60;
  let x = player.x, y = player.y, vy = player.vy;
  let ft = player.flightT, lf = player.lift;
  for(let i=0;i<260;i++){
    let sink;
    if(player.diving) sink = PLANE_DIVE;
    else if(player.lifting && lf > 0){ lf -= step; sink = PLANE_HOLD; }
    else { ft += step; sink = Math.min(MAX_FALL, PLANE_SINK0 * Math.exp(ft / PLANE_TAU)); }
    vy += (sink - vy) * Math.min(1, (player.diving ? 14 : 9)*step);
    x += player.vx*step; y += vy*step;
    if(blocked(ch, x, y, player.w, player.h)) return {x, y};
  }
  return null;
}

let camX = 0, camY = 0, ox = 0, oy = 0;
// ═════════════ THE BUNKER, DRAWN ═════════════
// White concrete, quartz panelling, and strip lighting that is far too good for
// a place where you keep animals. The lights are also the HUD: they run white
// while you're passing as staff and go red the moment a robot works you out.
function alertLevel(){
  let a = 0;
  for(const e of enemies){
    if(e.dead || e.K.inert) continue;
    if(e.x - ox < -300 || e.x - ox > VIEW_W + 300) continue;
    a = Math.max(a, e.state === 'hunting' ? 1 : e.state === 'suspicious' ? 0.45 : 0);
  }
  return a;
}
let ledMix = 0;

function drawBunkerBack(){
  const g = ctx.createLinearGradient(0, -oy, 0, MAP_H*T - oy);
  g.addColorStop(0, C.back); g.addColorStop(1, C.backLow);
  ctx.fillStyle = g; ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  // NO GRID. Irregular vertical joints only, world-seeded so they never crawl,
  // spaced unevenly so the eye reads "poured wall", not "tiles".
  ctx.save();
  ctx.strokeStyle = C.seam; ctx.lineWidth = 1.5;
  const SPAN = 260;
  for(let k = Math.floor(ox/SPAN)-1; k < (ox+VIEW_W)/SPAN + 1; k++){
    const x = k*SPAN + hash(k, 3)*180;          // jittered, so no two are the same distance apart
    ctx.globalAlpha = 0.30 + hash(k, 9)*0.35;
    ctx.beginPath(); ctx.moveTo(x-ox+0.5, 0); ctx.lineTo(x-ox+0.5, VIEW_H); ctx.stroke();
  }
  ctx.restore();
  // soft quartz mottle — big overlapping blooms, no cells
  ctx.save();
  for(let k = Math.floor(ox/210)-1; k < (ox+VIEW_W)/210 + 1; k++)
    for(let j = Math.floor(oy/190)-1; j < (oy+VIEW_H)/190 + 1; j++){
      const bx = k*210 + hash(k, j)*190, by = j*190 + hash(k+31, j)*170;
      const r  = 90 + hash(k+7, j+5)*140;
      const g2 = ctx.createRadialGradient(bx-ox, by-oy, 0, bx-ox, by-oy, r);
      g2.addColorStop(0, `rgba(255,255,255,${0.05 + hash(k, j+11)*0.07})`);
      g2.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g2;
      ctx.fillRect(bx-ox-r, by-oy-r, r*2, r*2);
    }
  ctx.restore();

  // ── the strip lighting
  const want = alertLevel();
  ledMix += (want - ledMix) * 0.08;
  const alarm = ledMix > 0.5 && (Math.sin(spin*1.9) > -0.35);
  const col   = ledMix > 0.02
    ? `rgb(${234 + (255-234)*ledMix | 0},${246 - 168*ledMix | 0},${255 - 171*ledMix | 0})`
    : C.led;
  const glow  = ledMix > 0.02 ? C.ledAlert : C.ledGlow;

  [10*T, 18*T].forEach((wy, i) => {
    const y = wy - oy + (i ? 2 : -4);
    if(y < -30 || y > VIEW_H + 30) return;
    const gg = ctx.createLinearGradient(0, y - 26, 0, y + 26);
    gg.addColorStop(0, 'rgba(0,0,0,0)');
    gg.addColorStop(0.5, glow.replace(')', ',0.30)').replace('rgb','rgba').replace('#','')
      .startsWith('rgba') ? glow : glow);
    gg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.save();
    ctx.globalAlpha = 0.22 + ledMix*0.30;
    ctx.fillStyle = glow;
    ctx.fillRect(0, y - 22, VIEW_W, 44);
    ctx.restore();
    // the strip itself, broken into fittings
    for(let x = Math.floor(ox/140)*140; x < ox+VIEW_W+140; x += 140){
      const on = !alarm || (((x/140)|0) % 2 === 0);
      ctx.fillStyle = on ? col : '#8b929c';
      ctx.fillRect(x-ox+10, y - 2, 120, 4.5);
    }
  });
}

// ── health bars. Segmented by ONE FRIENDLY LASER, so the bar tells you how many
// more shots you need to walk into it. The white ghost is the hit you just landed.
function healthBar(x, y, w, hp, max, ghost, seg, hot){
  const h = 7;
  ctx.fillStyle = 'rgba(10,14,20,.75)';
  rr(ctx, x-2, y-2, w+4, h+4, 5); ctx.fill();
  if(ghost > hp){
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    rr(ctx, x, y, w*ghost/max, h, 3.5); ctx.fill();
  }
  const k = hp/max;
  ctx.fillStyle = hot ? '#ff4d54' : k > 0.5 ? '#ff8f4d' : '#ff4d54';
  rr(ctx, x, y, Math.max(0, w*k), h, 3.5); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.30)';
  rr(ctx, x, y, Math.max(0, w*k), h*0.42, 3); ctx.fill();
  ctx.fillStyle = 'rgba(10,14,20,.55)';                    // segment ticks
  for(let v = seg; v < max; v += seg) ctx.fillRect(x + w*v/max - 0.75, y, 1.5, h);
}

function drawEnemies(){
  enemies.forEach(e => {
    if(e.x - ox < -160 || e.x - ox > VIEW_W + 160) return;

    if(e.dead){
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - e.deadT*0.55);
      ctx.translate(Math.round(e.x-ox), Math.round(e.y-oy + Math.min(14, e.deadT*40)));
      ctx.rotate(Math.min(1.35, e.deadT*1.6) * e.face);
      drawDog(ctx, 0, 0, e, e.face, 0, {moving:false});
      ctx.restore();
      return;
    }

    // vision cone — you can see what it can see. That is the whole stealth game.
    if(!e.K.inert && e.state !== 'hunting'){
      const eye = eyeOf(e);
      const a = e.state === 'suspicious' ? 0.16 : 0.08;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = e.state === 'suspicious' ? '#ffc93c' : '#9fdcff';
      ctx.beginPath();
      ctx.moveTo(eye.x-ox, eye.y-oy);
      const R = e.K.sight, sp = e.K.fov;
      ctx.lineTo(eye.x-ox + e.face*R, eye.y-oy - R*sp - 70);
      ctx.lineTo(eye.x-ox + e.face*R, eye.y-oy + R*sp + 70);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    ctx.save();
    ctx.translate(Math.round(e.x-ox), Math.round(e.y-oy));
    drawDog(ctx, 0, 0, e, e.face, e.phase, {moving:Math.abs(e.vx) > 6});
    if(e.flash > 0){                                   // hit flash
      ctx.globalCompositeOperation = 'source-atop';
      ctx.fillStyle = `rgba(255,255,255,${e.flash*3})`;
      ctx.fillRect(-10, -20, e.w+20, e.h+30);
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.restore();

    if(e.K.inert) return;

    // the charging eye — your window to move a friend into the line
    if(e.aim > 0){
      const eye = eyeOf(e), k = 1 - e.aim/e.K.aimTime;
      ctx.save();
      ctx.globalAlpha = 0.30 + k*0.55;
      ctx.strokeStyle = '#ff4d54'; ctx.lineWidth = 1 + k*2.5;
      ctx.setLineDash([9, 7]); ctx.lineDashOffset = -spin*9;
      ctx.beginPath();
      ctx.moveTo(eye.x-ox, eye.y-oy);
      ctx.lineTo(eye.x-ox + e.face*900, eye.y-oy);
      ctx.stroke();
      ctx.restore();
      ctx.fillStyle = '#ff4d54';
      ctx.beginPath(); ctx.arc(eye.x-ox + e.face*e.w*0.4, eye.y-oy, 3 + k*6, 0, 7); ctx.fill();
    }
    // the brute winding up
    if(e.wind > 0){
      const k = 1 - e.wind/e.K.wind;
      ctx.strokeStyle = `rgba(255,77,84,${0.35 + k*0.5})`; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(e.x-ox + e.w/2 + e.face*e.K.reach*0.55, e.y-oy + e.h*0.55,
              e.K.reach*(0.5 + k*0.5), 0, 7);
      ctx.stroke();
    }

    const bw = 46, bx = e.x-ox + e.w/2 - bw/2, by = e.y-oy - 22;
    healthBar(bx, by, bw, e.hp, e.max, e.ghost, DMG.laserRobo, e.state==='hunting');

    // suspicion — the ? filling up is your warning that the disguise is slipping
    if(e.state === 'suspicious'){
      const k = Math.min(1, e.sus);
      ctx.fillStyle = 'rgba(10,14,20,.72)';
      ctx.beginPath(); ctx.arc(bx+bw/2, by-16, 11, 0, 7); ctx.fill();
      ctx.strokeStyle = '#ffc93c'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(bx+bw/2, by-16, 9, -Math.PI/2, -Math.PI/2 + k*6.283); ctx.stroke();
      ctx.fillStyle = '#ffc93c'; ctx.font = '900 12px ui-sans-serif,system-ui';
      ctx.textAlign = 'center'; ctx.fillText('?', bx+bw/2, by-11.5);
    } else if(e.state === 'hunting'){
      const pop = 1 + Math.max(0, e.alertPop)*0.9;
      ctx.save();
      ctx.translate(bx+bw/2, by-16); ctx.scale(pop, pop);
      ctx.fillStyle = 'rgba(10,14,20,.72)';
      ctx.beginPath(); ctx.arc(0, 0, 11, 0, 7); ctx.fill();
      ctx.fillStyle = '#ff4d54'; ctx.font = '900 14px ui-sans-serif,system-ui';
      ctx.textAlign = 'center'; ctx.fillText('!', 0, 5);
      ctx.restore();
    }
    ctx.textAlign = 'left';
  });

  lasers.forEach(L => {
    const x = L.x-ox, y = L.y-oy, len = 34*Math.sign(L.vx);
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = '#ff4d54'; ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x-len, y); ctx.lineTo(x, y); ctx.stroke();
    ctx.restore();
    ctx.strokeStyle = '#fff2f2'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x-len*0.8, y); ctx.lineTo(x, y); ctx.stroke();
  });

  sparks.forEach(s => {
    ctx.fillStyle = `rgba(255,${180 + Math.random()*60|0},90,${Math.min(1, s.life*2)})`;
    ctx.fillRect(s.x-ox-1.5, s.y-oy-1.5, 3.5, 3.5);
  });
}

function draw(){
  const cx = player.x + player.w/2 + player.face*330*player.peri;
  const tx = Math.max(0, Math.min(MAP_W*T - VIEW_W, cx - VIEW_W/2));
  const ty = Math.max(0, Math.min(MAP_H*T - VIEW_H,
                                  player.y + player.h/2 - VIEW_H*0.56));
  camX += (tx - camX)*0.12;
  camY += (ty - camY)*0.09;
  ox = Math.round(camX); oy = Math.round(camY);

  drawBunkerBack();
  drawTerrain();
  drawLooseDirt();

  const c0 = Math.max(0, Math.floor(ox/T)-1), c1 = Math.min(MAP_W-1, Math.ceil((ox+VIEW_W)/T));
  const rr0 = Math.max(0, Math.floor(oy/T)-2), rr1 = Math.min(MAP_H-1, Math.ceil((oy+VIEW_H)/T)+1);
  for(let r=rr0;r<=rr1;r++) for(let c=c0;c<=c1;c++){
    const t = grid[r][c], x = c*T-ox, y = r*T-oy;

    if(t==='e' || t==='K'){
      // a doghouse. Every one of them in here is standing open and empty
      // except the last, which is not.
      const mine = t==='K';
      const bx = x-9, bw = T+18, by = y-T+2, bh = 2*T-2, roof = 24;
      ctx.fillStyle = mine ? '#4cc9f0' : '#8e9aa8';
      ctx.beginPath();
      ctx.moveTo(bx-6, by+roof); ctx.lineTo(bx+bw/2, by); ctx.lineTo(bx+bw+6, by+roof);
      ctx.closePath(); ctx.fill();
      ctx.fillRect(bx, by+roof-2, bw, bh-roof+2);
      ctx.fillStyle = mine ? '#0d1a24' : '#3c4551';         // the dark mouth
      const dw = bw*0.5, dx = bx+(bw-dw)/2, dy = by+bh-30;
      ctx.beginPath();
      ctx.moveTo(dx, by+bh); ctx.lineTo(dx, dy+10);
      ctx.quadraticCurveTo(dx+dw/2, dy-9, dx+dw, dy+10);
      ctx.lineTo(dx+dw, by+bh); ctx.closePath(); ctx.fill();
      ctx.fillStyle = mine ? '#ffd166' : '#c3ccd6';         // the nameplate
      ctx.fillRect(bx+bw/2-7, by+roof+3, 14, 4);

    } else if(t==='R' || t==='C'){
      const d = doorAt(c,r), open = d && d.open;
      if(open){
        ctx.fillStyle = 'rgba(120,220,255,.10)'; ctx.fillRect(x+4, y, T-8, T);
        ctx.fillStyle = '#7fd4ff'; ctx.fillRect(x+4, y, T-8, 2);
      } else {
        ctx.fillStyle = '#8c96a3'; rr(ctx, x+1, y, T-2, T, 3); ctx.fill();
        ctx.fillStyle = '#aeb8c5'; rr(ctx, x+4, y+2, T-8, T-4, 2); ctx.fill();
        ctx.fillStyle = 'rgba(43,49,56,.55)';
        ctx.fillRect(x+4, y + (r%2 ? 8 : 20), T-8, 3);        // shutter slats
        if(t==='R'){                                          // chip reader — it wants you
          ctx.fillStyle = '#7fd4ff';
          ctx.beginPath(); ctx.arc(x+T/2, y+T/2, 3.4, 0, 7); ctx.fill();
        } else {                                              // locked while anything guards it
          ctx.fillStyle = '#ff4d54';
          ctx.fillRect(x+T/2-4, y+T/2-4, 8, 8);
        }
      }

    } else if(t==='P'){
      // THE CRACKED PANEL. Nothing you own can open this.
      ctx.fillStyle = '#c8ccd2'; rr(ctx, x, y, T, T, 2); ctx.fill();
      ctx.fillStyle = '#dfe3e9'; rr(ctx, x+2, y+2, T-4, T-4, 2); ctx.fill();
      ctx.strokeStyle = '#8a9199'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
      for(let i=0;i<4;i++){                                   // world-seeded cracks
        let px = x + hash(c, r+i)*T, py = y + hash(c+7, r+i)*T;
        ctx.beginPath(); ctx.moveTo(px, py);
        for(let k=0;k<3;k++){
          px += (hash(c+k, r+i+k)-0.5)*15; py += (hash(c+k+9, r+i)-0.5)*15;
          ctx.lineTo(px, py);
        }
        ctx.stroke();
      }
      ctx.fillStyle = '#ffc93c';                              // hazard flash
      ctx.fillRect(x+2, y+T/2-2, T-4, 4);
      ctx.fillStyle = 'rgba(43,49,56,.5)';
      for(let i=0;i<3;i++) ctx.fillRect(x+3+i*11, y+T/2-2, 5, 4);

    } else if(t==='L'){
      // THE DOOR A DOGGO LOCKED. No reader, no panel, nothing to show the chip.
      ctx.fillStyle = '#39414c'; rr(ctx, x, y, T, T, 3); ctx.fill();
      ctx.fillStyle = '#4d5764'; rr(ctx, x+3, y+2, T-6, T-4, 2); ctx.fill();
      ctx.strokeStyle = '#2a3038'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x+2, y+T*0.3); ctx.lineTo(x+T-2, y+T*0.3);
      ctx.moveTo(x+2, y+T*0.75); ctx.lineTo(x+T-2, y+T*0.75); ctx.stroke();
      ctx.fillStyle = '#8b939e';                              // bolts, from the far side
      [0.3, 0.75].forEach(f => { [6, T-6].forEach(dx2 => {
        ctx.beginPath(); ctx.arc(x+dx2, y+T*f, 2.6, 0, 7); ctx.fill(); }); });

    } else if(t==='w'){
      // THE FLOODED STAIRWELL. It goes a long way down.
      const surf = r === 18;
      ctx.fillStyle = surf ? 'rgba(70,150,190,.55)' : 'rgba(30,90,130,.72)';
      ctx.fillRect(x, y, T, T);
      if(surf){
        ctx.fillStyle = 'rgba(210,245,255,.75)';
        for(let i=0;i<T;i+=5)
          ctx.fillRect(x+i, y + 2 + Math.sin((c*T+i)*0.09 + spin*0.7)*2.2, 3.5, 2.5);
      }
      ctx.fillStyle = 'rgba(127,212,255,.22)';                // lights still on, far below
      if((c+r) % 3 === 0)
        ctx.fillRect(x+T/2-2, y+T/2-2 + Math.sin(spin*0.4+c)*3, 4, 4);

    } else if(t==='p'){
      // a cell partition. Reads as a wall, is not one — you walk straight past it.
      ctx.fillStyle = 'rgba(150,162,178,.42)';
      ctx.fillRect(x+8, y, T-16, T);
      ctx.fillStyle = 'rgba(110,122,138,.34)';
      ctx.fillRect(x+8, y, 3, T);
      ctx.fillRect(x+T-11, y, 3, T);

    } else if(t==='v'){
      // a vent. Too small, too high. Not today.
      ctx.fillStyle = '#3b434e'; rr(ctx, x+2, y+6, T-4, T-12, 3); ctx.fill();
      ctx.fillStyle = '#6d7783';
      for(let i=0;i<4;i++) ctx.fillRect(x+4, y+9+i*4.5, T-8, 2.4);

    } else if(t==='G'){
      // daylight. the first green in the game is up there.
      const gg = ctx.createLinearGradient(0, y-T, 0, y+2*T);
      gg.addColorStop(0, 'rgba(255,255,255,.95)');
      gg.addColorStop(1, 'rgba(180,235,160,0)');
      ctx.fillStyle = gg; ctx.fillRect(x-6, y-T, T+12, 3*T);
    }
  }

  COINS.forEach(c => {
    if(c.got || c.x - ox < -40 || c.x - ox > VIEW_W + 40) return;
    const [fi, flip, fat] = COIN_SEQ[(Math.floor(spin) + c.ph) % COIN_SEQ.length];
    const im = COIN_IMG[fi];
    if(!(im.complete && im.naturalWidth)) return;
    const h = COIN_H, w = h * im.naturalWidth / im.naturalHeight * fat;
    const bob = Math.sin(spin*0.5 + c.ph)*2.5;
    ctx.save();
    ctx.translate(c.x - ox, c.y + bob - oy);
    if(flip) ctx.scale(-1, 1);
    ctx.drawImage(im, -w/2, -h/2, w, h);
    ctx.restore();
  });

  orbs.forEach(o => {
    ctx.fillStyle = 'rgba(232,140,255,.32)';
    ctx.beginPath(); ctx.arc(o.x-ox, o.y-oy, 11, 0, 7); ctx.fill();
    ctx.fillStyle = '#f7d5ff';
    ctx.beginPath(); ctx.arc(o.x-ox, o.y-oy, 5, 0, 7); ctx.fill();
  });

  vapor.forEach(p => {
    const k = p.t / p.life;
    ctx.fillStyle = `rgba(255,255,255,${0.5*(1-k)*(1-k)})`;
    ctx.beginPath(); ctx.arc(p.x-ox, p.y-oy, 2.5 + k*9, 0, 7); ctx.fill();
  });

  if(player.gliding){                              // where this flight ends up
    const land = predictLanding();
    if(land){
      const lx = land.x - ox + player.w/2, ly = land.y - oy + player.h;
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 2.5;
      ctx.setLineDash([5,5]); ctx.lineDashOffset = -spin*4;
      ctx.beginPath();
      ctx.moveTo(player.x - ox + player.w/2, player.y - oy + player.h);
      ctx.lineTo(lx, ly); ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath(); ctx.ellipse(lx, ly, 11, 4.5, 0, 0, 7); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      ctx.beginPath(); ctx.ellipse(lx, ly, 11, 4.5, 0, 0, 7); ctx.fill();
      ctx.restore();
    }
  }

  drawEnemies();

  player.trail.forEach((p, i) => {                 // zoomies afterimages
    ctx.save();
    ctx.globalAlpha = 0.30 * (1 - i/player.trail.length);
    ctx.translate(Math.round(p.x-ox), Math.round(p.y-oy));
    drawDog(ctx, 0, 0, player.char, p.f, player.phase, {moving:true});
    ctx.restore();
  });
  // the dash — a hard streak, because it is the one thing that reads as "not a robot"
  if(player.dash > 0){
    const k = player.dash / DASH_TIME;
    ctx.save();
    ctx.globalAlpha = 0.42*k;
    for(let i=1;i<=3;i++){
      ctx.translate(-player.face*11, 0);
      drawDog(ctx, Math.round(player.x-ox), Math.round(player.y-oy),
              player.char, player.face, player.phase, {moving:true});
    }
    ctx.restore();
  }

  ctx.save();
  ctx.translate(Math.round(player.x-ox), Math.round(player.y-oy));
  // i-frames blink, so you can tell when the next hit will actually land
  if(player.hurt > 0) ctx.globalAlpha = (Math.floor(player.hurt*22) % 2) ? 0.35 : 1;
  drawDog(ctx, 0, 0, player.char, player.face, player.phase,
          {gliding:player.gliding, digging:player.digging, peri:player.peri,
           lifting:player.lifting,
           moving:Math.abs(player.vx) > 5 && player.coyote > 0});
  if(player.hurt > 0.6){
    ctx.globalCompositeOperation = 'source-atop';
    ctx.fillStyle = 'rgba(255,80,90,.75)';
    ctx.fillRect(-10, -20, player.w+20, player.h+30);
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();

  if(player.digging){
    ctx.fillStyle = 'rgba(180,130,80,.65)';
    for(let i=0;i<5;i++){
      const a = player.phase*2 + i*1.7;
      ctx.fillRect(player.x-ox+player.w/2+Math.cos(a)*13,
                   player.y-oy+player.h*0.6+Math.sin(a)*11, 3,3);
    }
  }
}

// ───────────────────────────────────────────── loop
let last = performance.now();
function frame(now){
  let dt = (now-last)/1000; last = now;
  dt = Math.min(dt, 1/30);
  update(dt); draw();
  requestAnimationFrame(frame);
}
fitCanvas();
drawCardArt();
hudCoins.textContent = `0 / ${COINS.length} coins`;
becomeDoggo(byId('barkmc'));
requestAnimationFrame(frame);
window.__bark = { player, grid, CAST, byId, becomeDoggo, doors, orbs, T,
                  enemies, lasers, SHUTTERS, hurtRobot, seen, checkpointOf:()=>checkpoint,
                  get cam(){ return {ox, oy}; },
                  get music(){ let pk = 0;
                    if(musMeter){ const d = new Float32Array(musMeter.fftSize);
                      musMeter.getFloatTimeDomainData(d);
                      for(const v of d) pk = Math.max(pk, Math.abs(v)); }
                    return {track:musTrack, on:musOn, notes:noteCount,
                            state:actx && actx.state, peak:+pk.toFixed(3)}; },
                  get plasmaOpen(){ return plasmaOpen; } };
})();
</script>
</body>
</html>
