<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>B.A.R.K. — kennel swap sandbox</title>
<style>
  :root{
    --bg:#12101a; --panel:#1b1830; --panel2:#241f3d; --line:#332c52;
    --tx:#eae6f4; --mut:#9b93b8; --doggo:#ffd166; --cool:#4cc9f0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
  #stage{position:fixed;inset:0;display:flex;flex-direction:column}
  #wrap{flex:1;position:relative;overflow:hidden}
  canvas#game{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block}

  #hud{position:absolute;left:14px;top:12px;pointer-events:none;z-index:5;
    background:rgba(255,255,255,.80);padding:7px 13px 8px;border-radius:13px}
  #who{font-weight:900;letter-spacing:.12em;font-size:14px;text-transform:uppercase;
    color:#1d3346;text-shadow:0 1px 0 rgba(255,255,255,.45)}
  #move{font-size:12.5px;color:#3f5b70;margin-top:2px;text-shadow:0 1px 0 rgba(255,255,255,.4)}
  #coins{font-size:12px;font-weight:800;color:#7a6a3c;margin-top:4px;letter-spacing:.06em}
  #biome{font-size:11px;color:#6d7f8e;margin-top:2px;letter-spacing:.14em;text-transform:uppercase}
  #tip{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;z-index:5;
    font-size:13px;color:var(--mut);text-align:center;pointer-events:none;
    background:rgba(18,16,26,.72);padding:6px 14px;border-radius:99px;border:1px solid var(--line)}
  #tip.hot{color:var(--cool);border-color:var(--cool)}
  #banner{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);z-index:6;
    font-weight:900;font-size:34px;letter-spacing:-.02em;color:#06d6a0;opacity:0;
    transition:opacity .3s;pointer-events:none;text-align:center}
  #banner.on{opacity:1}

  #toast{position:absolute;inset:0;z-index:7;display:flex;align-items:center;
    justify-content:center;pointer-events:none;opacity:0}
  /* Doggo Battles lettering: white caps, wide tracking, gold outline, no tilt */
  #toast span{
    font-family:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
    font-weight:900;font-size:clamp(46px,12vw,124px);letter-spacing:.14em;
    text-indent:.14em;color:#fff;
    -webkit-text-stroke:6px #e8a704;paint-order:stroke fill;
    text-shadow:0 6px 0 rgba(120,72,0,.55), 0 0 40px rgba(255,206,92,.6);
    transform:scale(2.4)}
  #toast.go{animation:toastFade 1.35s linear forwards}
  #toast.go span{animation:toastSmash 1.35s linear forwards}
  @keyframes toastFade{0%{opacity:0}5%{opacity:1}68%{opacity:1}100%{opacity:0}}
  /* slams in over ~90ms, overshoots, settles, then drifts out */
  @keyframes toastSmash{
    0%{transform:scale(2.4)}
    7%{transform:scale(.84)}
    13%{transform:scale(1.14)}
    19%{transform:scale(.96)}
    25%{transform:scale(1.03)}
    31%{transform:scale(1)}
    100%{transform:scale(1.07)}}

  #roster{position:absolute;inset:0;z-index:20;display:none;
    background:rgba(10,8,18,.9);backdrop-filter:blur(3px);
    align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:16px}
  #roster.on{display:flex}
  #roster h2{margin:0;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--cool)}
  #cards{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;
    max-width:1000px;max-height:66vh;overflow-y:auto;padding:4px}
  .card{width:114px;background:var(--panel);border:2px solid var(--line);border-radius:13px;
    padding:8px 7px;text-align:center;cursor:pointer;transition:border-color .12s,transform .12s}
  .card.sel{border-color:var(--doggo);transform:translateY(-3px)}
  .card.lock{opacity:.45}
  .card canvas{display:block;margin:0 auto 4px;background:var(--panel2);border-radius:8px}
  .card b{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;line-height:1.25}
  .card .stat{font-size:10px;color:var(--cool);margin-top:3px;letter-spacing:.04em}
  .card .abil{display:block;font-size:10.5px;color:var(--tx);margin-top:3px;line-height:1.3}
  .card .note{display:block;font-size:9.5px;color:var(--mut);margin-top:3px;line-height:1.3}
  #rhint{font-size:12px;color:var(--mut)}

  #pad{display:none;gap:8px;padding:10px 12px 14px;background:var(--panel);border-top:1px solid var(--line)}
  #pad button{flex:1;background:var(--panel2);color:var(--tx);border:1px solid var(--line);
    border-radius:12px;padding:16px 0;font-size:17px;font-weight:800;touch-action:none}
  #pad button:active{background:var(--line)}
  body.touch #pad{display:flex}

  /* one game: every screen can get back to the front door */
  #nav{position:fixed;left:14px;bottom:14px;z-index:30;font:700 11px/1 ui-sans-serif,system-ui,sans-serif;
    letter-spacing:.18em;text-transform:uppercase;text-decoration:none;color:#9b93b8;
    background:rgba(18,16,26,.82);border:1px solid #332c52;padding:9px 14px;border-radius:99px}
  #nav:hover{color:#ffd166;border-color:#ffd166}
</style>
</head>
<body>
<a id="nav" href="index.html">◀ Menu</a>
<div id="stage">
  <div id="wrap">
    <canvas id="game"></canvas>
    <div id="hud"><div id="who"></div><div id="move"></div>
      <div id="coins">0 / 9 coins</div><div id="biome">grass</div></div>
    <div id="tip"></div>
    <div id="banner">SANDBOX CLEAR</div>
    <div id="toast"><span>ZOOMIES</span></div>
    <div id="roster">
      <h2>Kennel — pick who goes out</h2>
      <div id="cards"></div>
      <div id="rhint">← → ↑ ↓ to browse · Enter to take them · Esc to cancel</div>
    </div>
  </div>
  <div id="pad">
    <button data-k="left">←</button>
    <button data-k="right">→</button>
    <button data-k="up">↑</button>
    <button data-k="use">E</button>
    <button data-k="jump">JUMP</button>
  </div>
</div>
<script>
(() => {
'use strict';

// ───────────────────────────────────────────── config
const T = 32;
const VIEW_W = 672, VIEW_H = 448;   // 21 x 14 tiles — zoomed in, so the camera pans vertically too

const GRAV      = 1800;
const MAX_FALL  = 900;
const RUN       = 215;
const ACCEL     = 2000;
const FRICTION  = 2400;
const JUMP_V    = -565;
const COYOTE    = 0.09;
const BUFFER    = 0.10;
const GLIDE_FALL= 50;
const GLIDE_RUN = 255;
// He flies whichever way he's already pointed — the mouse doesn't steer him. What
// it does is hold him up: cursor above his waist and he strains for it, spending a
// two-second reserve before the sag sets in. The sag is exponential, so a flight
// ends the way a paper plane does — level, level, level, gone. He never climbs,
// which is what keeps him off Alien's wall and Billie's wall.
const PLANE_RUN   = 335;
const PLANE_SINK0 = 30;     // px/s at the start of a glide
const PLANE_TAU   = 0.9;    // sink doubles about every 0.6s once the reserve is out
const PLANE_LIFT  = 2.0;    // seconds of "trying", refilled on landing
// Near-zero, not merely slow: at 30px/s he spent his whole altitude budget while
// straining and the reserve only bought about one extra second instead of two.
const PLANE_HOLD  = 4;
const PLANE_DIVE  = 720;    // cursor fully below him — nose down, and he drops
// The cursor is a STICK, not three buttons. PLANE_RANGE is how far it has to
// travel from his waist for full authority; everything between is a real value,
// so nothing snaps. PLANE_EASE is how fast the nose follows the stick.
const PLANE_RANGE = 120;
const PLANE_DEAD  = 0.12;   // soft deadzone, as a fraction of the range
const PLANE_EASE  = 7;
const DIG_SPEED = 135;
const ORB_SPEED = 430;
// ZOOMIES. Jump height goes with the SQUARE of takeoff speed, so 1.75x is already
// 3x the height — 8 tiles, where Alien's big jump only manages 4.7.
const ZOOM_TIME  = 45;
const ZOOM_SPEED = 1.9;
const ZOOM_JUMP  = 1.75;
// Small horizontal kick on purpose: a big shove would mean you can only wall-jump
// inside a shaft with two facing walls, and there aren't any. This way holding
// toward the wall re-contacts it, so a single face can be climbed.
const WALL_KICK  = 0.55;
const WALL_GRACE = 0.12;

// ───────────────────────────────────────────── the roster
// Stats and abilities are lifted straight from the Doggo Battles wiki — ANormalName1's
// canon, in menu order. `art` is set only where Adam has drawn something; everything
// else is a placeholder vector doggo wearing a hat until his real art lands.
// Drawn height per doggo, tuned so their BODIES match rather than their pictures.
// Two earlier attempts both failed: scaling by image height shrank whoever wore a
// hat, and scaling by nose-to-tail length made bodies equal on paper but not to the
// eye. These numbers come from the area of each drawing's lower body — the part no
// hat, crown or antenna touches — so a taller `dh` here means more of the picture is
// headgear, not that the dog is bigger. Verified by lining them all up side by side.
const DOG_H = 44;

const CAST = [
  // you. Xanboo78o's doggo, still wearing the collar he tore off.
  { id:'barkmc', name:'BARKmc', col:'#f5a623', w:26, h:34, tag:'ADAM',
    art:'BARKmc', bw:260, move:'chip',
    atk:'?', spd:'?', ability:'Stolen chip — robo doors open for you',
    note:'you · the one that got away' },
  { id:'dalmatian', name:'Dalmatian Doggo', col:'#e9e9ee', hat:'spots', w:26, h:34, tag:'DB',
    art:'Dalmatian-Doggo', bw:260,
    atk:'Normal', spd:'Normal', ability:'None', note:'#2 · runs a shop' },
  { id:'cowboy', name:'Cowboy Doggo', col:'#c98a4b', hat:'cowboy', w:26, h:34, tag:'DB',
    art:'Cowboy-Doggo', dh:50, bw:201,
    atk:'High', spd:'Normal', ability:'Extra damage', note:'#3' },
  { id:'knight', name:'Knight Doggo', col:'#9aa4b8', hat:'helm', w:26, h:34, tag:'DB',
    art:'Knight-Doggo', dh:46, bw:219, speedMul:0.62,
    atk:'High', spd:'Slow', ability:'More damage, less speed',
    note:'#4 · from Doggo Quest, year 1300' },
  { id:'alien', name:'Alien Doggo', col:'#7ee081', hat:'antenna', w:26, h:34, tag:'DB',
    art:'Alien-Doggo', dh:51, bw:199, jumpMul:1.3, move:'jump',
    atk:'Normal', spd:'Normal', ability:'Jump higher', note:'#5' },
  { id:'king', name:'King Doggo', col:'#ffd166', hat:'crown', w:26, h:34, tag:'DB',
    art:'King-Doggo', bw:203, dh:54, speedMul:1.2, jumpMul:1.05,
    atk:'High', spd:'High', ability:'Enhanced stats', note:'#6' },
  { id:'zombie', name:'Zombie Doggo', col:'#8fb06a', hat:'none', w:26, h:34, tag:'DB',
    art:'Zombie-Doggo', bw:258,
    atk:'Normal', spd:'Normal', ability:'Steal health', note:'#7' },
  { id:'cool', name:'Cool Doggo', col:'#4cc9f0', hat:'shades', w:26, h:34, tag:'DB',
    art:'Cool-Doggo', dh:43, bw:269, speedMul:1.4, move:'speed',
    accelMul:0.40, frictionMul:1.3,     // winds up over ~0.4s, still stops firmly
    atk:'Normal', spd:'High', ability:'Speed', note:'#8' },
  { id:'toxic', name:'Toxic Doggo', col:'#a3f542', hat:'none', w:26, h:34, tag:'DB',
    art:'Toxic-Doggo', bw:260,
    atk:'Normal', spd:'Normal', ability:'Poisons enemy',
    note:'#11 · his poison IS the infection' },
  { id:'plasma', name:'Plasma Doggo', col:'#8f7bf5', hat:'none', w:26, h:34, tag:'DB',
    art:'Plasma-Doggo', bw:260, move:'plasma',
    atk:'Non-melee', spd:'Normal', ability:'Shoots plasma orbs',
    note:'shop doggo · he became Qorvex' },
  { id:'qorvex', name:'Qorvex', col:'#5b4a8a', w:26, h:34, tag:'DB', locked:true,
    art:'Qorvex', art2:'Qorvex-glitch', bw:261,
    atk:'???', spd:'???', ability:'???', note:'was on the team. then the basement.' },

  { id:'billie', name:'Billie', col:'#ff7fbf', w:26, h:34, tag:'ADAM',
    art:'Billie', bw:194, move:'zoom',
    atk:'?', spd:'?', ability:'ZOOMIES — press E. 45 seconds.', note:'yours' },
  { id:'tall', name:'Tall Doggo', col:'#f6a623', w:26, h:34, tag:'ADAM',
    art:'Tall-Doggo', dh:60, bw:129, neck:{head:0.27, body:0.60}, move:'look',
    atk:'?', spd:'?', ability:'Periscope — hold ↑ to see ahead', note:'yours' },

  { id:'plane', name:'Airplane Doggo', col:'#f5a623', w:26, h:34, tag:'ADAM',
    art:'Airplane-Doggo', bw:261, move:'glide',
    atk:'?', spd:'?', ability:'Hold jump — thrust, then glide', note:'yours' },
  { id:'digger', name:'Miner Doggo', col:'#f4845f', w:26, h:34, tag:'ADAM',
    art:'Miner-Doggo', bw:223, dh:48, move:'dig',
    lamp:{ x:0.66, y:0.18 },          // where the helmet lamp sits in his drawing
    atk:'?', spd:'?', ability:'Digs loose dirt · headlamp', note:'yours' },
];
const byId = id => CAST.find(c => c.id === id);

const IMG = {};
CAST.forEach(c => [c.art, c.art2].filter(Boolean).forEach(n => {
  if(IMG[n]) return;
  const im = new Image();
  im.onload = () => drawCardArt();
  im.src = 'doggos/' + n + '.png';
  IMG[n] = im;
}));

// Three tiers, four spin frames each: silver 1, green 2, red 5.
const COIN_TIERS = [
  { pre:1, value:1, rate:1.00 },
  { pre:2, value:2, rate:1.18 },
  { pre:3, value:5, rate:1.42 },
];
COIN_TIERS.forEach(t => {
  t.img = [1,2,3,4].map(n => {
    const im = new Image(); im.src = `doggos/coin${t.pre}${n}.png`; return im;
  });
});
// A real spin is 360° and four frames only cover 90°, so run them out and back,
// flipping horizontally after each edge-on step — that's where a coin's visible face
// actually swaps. [frame, flipped, width multiplier].
//
// All four of Adam's frames are used. His edge frame is a 23px sliver, which is
// three pixels at game scale, so it gets widened — enough to have thickness, not
// so much that its straight sides read as a blocky bar.
// Silhouette widths land on 27 / 22 / 14 / 8.
// [frame, flipped]. Width comes from COIN_FACE below, not from the drawing —
// each tier's frames are drawn at slightly different widths, and a per-frame
// multiplier tuned to one tier made the others bulge at the edge-on frame, which
// looked like the coin changing size mid-spin.
const COIN_SEQ = [
  [0,0], [1,0], [2,0], [3,0], [2,1], [1,1],
  [0,1], [1,1], [2,1], [3,1], [2,0], [1,0],
];
// silhouette width as a fraction of the coin's diameter, roughly cos(angle)
const COIN_FACE = [1.00, 0.78, 0.42, 0.22];
const COIN_H = 27;

// Adam's five biome sheets. Each is a ground strip plus a set of floating-platform
// blobs; every colour below was sampled out of his own art.
const BASE_C = {
  stone:'#a3a9b6', stoneLow:'#848b9a', stoneEdge:'#6a7180',
  loose:'#b07c48', looseLow:'#8d6136', looseEdge:'#6f4c2a', crack:'#5e3f22',
};
const BIOMES = {
  grass: { plats:5, stripH:92, C:{
    skyTop:'#5bb4e8', skyLow:'#b9e4f7', hill:'#93c584', hillFar:'#b2d9ac',
    earth:'#48200e', earthLow:'#3a170a', earthEdge:'#2a1006',
    under:'#331509', underMud:'#250e05', grass:'#1c9336', grassEdge:'#14561f' } },
  rock: { plats:7, stripH:30, C:{
    skyTop:'#7d8fa8', skyLow:'#c8d4e0', hill:'#8a8f99', hillFar:'#adb4bd',
    earth:'#717171', earthLow:'#5a5a5a', earthEdge:'#414141',
    under:'#3a3a3a', underMud:'#2c2c2c', grass:'#5f5f5f', grassEdge:'#3d3d3d' } },
  wildfire: { plats:6, stripH:30, C:{
    skyTop:'#c96a2e', skyLow:'#f0c27a', hill:'#6b5b3a', hillFar:'#8a7a55',
    earth:'#276425', earthLow:'#1c4a1b', earthEdge:'#123310',
    under:'#1a3318', underMud:'#12240f', grass:'#2a2710', grassEdge:'#1a1809' } },
  water: { plats:5, stripH:30, C:{
    skyTop:'#123a5c', skyLow:'#2b7ba0', hill:'#1a4a63', hillFar:'#2a6a85',
    earth:'#224668', earthLow:'#1a3550', earthEdge:'#12253a',
    under:'#132a41', underMud:'#0d1e30', grass:'#19264e', grassEdge:'#101a36' } },
  city: { plats:5, stripH:56, C:{
    skyTop:'#8fa3b8', skyLow:'#cdd8e2', hill:'#5d5754', hillFar:'#7a7370',
    earth:'#524a46', earthLow:'#423b38', earthEdge:'#332d2b',
    under:'#2e2826', underMud:'#221d1b', grass:'#5d5754', grassEdge:'#3d3835' } },
};
const BIOME_NAMES = Object.keys(BIOMES);
const TERRAIN_IMG = {};
BIOME_NAMES.forEach(k => {
  const load = n => { const im = new Image(); im.src = 'doggos/'+n+'.png'; TERRAIN_IMG[n] = im; };
  load(k + '-ground');
  for(let i=1;i<=BIOMES[k].plats;i++) load(k + '-plat' + i);
});
['Kennel','Plasma-Orb'].forEach(n => {
  const im = new Image(); im.src = 'doggos/' + n + '.png';
  TERRAIN_IMG[n === 'Kennel' ? 'kennel' : 'orb'] = im;
});
const KENNEL_H = 70, ORB_H = 17;
let biome = 'grass';

// ───────────────────────────────────────────── level
// '.' air  '#' solid  'd' loose dirt  'K' kennel  'R' robo door
// 'B' plasma barrier  'S' plasma target  'G' goal
const MAP_W = 126, MAP_H = 21;
const grid = Array.from({length:MAP_H}, () => Array(MAP_W).fill('.'));
const fill = (x,y,w,h,ch) => { for(let r=y;r<y+h;r++) for(let c=x;c<x+w;c++)
  if(r>=0&&r<MAP_H&&c>=0&&c<MAP_W) grid[r][c]=ch; };
const put = (x,y,ch) => fill(x,y,1,1,ch);

fill(0,15,MAP_W,6,'#');          // ground slab, walking surface = row 15

// A — start
put(7,14,'K');

// B — a gap only a glide crosses (fall in and you walk the stairs back; that's the point)
fill(14,15,9,5,'.');
fill(14,16,1,5,'#'); fill(15,17,1,4,'#'); fill(16,18,1,3,'#'); fill(17,19,1,2,'#');

// C — dig under the wall
put(26,14,'K');
fill(30,5,2,10,'#');
fill(27,15,2,1,'d');
fill(27,16,9,2,'.');
fill(34,17,1,1,'#'); fill(35,16,1,2,'#');
fill(33,15,3,1,'.');

// D — a six-tile wall. Alien's big jump tops out at 4.7 tiles; only Zoomies clears it.
put(40,14,'K');
fill(45,9,9,6,'#');

// E — robo door
put(57,14,'K');
fill(62,0,1,12,'#'); fill(62,12,1,3,'R');

// F — another glide gap
put(66,14,'K');
fill(72,15,9,5,'.');
fill(72,16,1,5,'#'); fill(73,17,1,4,'#'); fill(74,18,1,3,'#'); fill(75,19,1,2,'#');

// G — five tiles: too far for a normal run-up, fine if you're fast
put(84,14,'K');
fill(88,15,5,5,'.');
fill(88,16,1,5,'#'); fill(89,17,1,4,'#'); fill(90,18,1,3,'#');

// H — a four-tile wall. no ledge, no ramp. you either jump it or you don't
put(97,14,'K');
fill(102,11,2,4,'#');

// I — the window. stand on the ledge, put an orb through it, the barrier drops
put(105,14,'K');
fill(107,13,2,2,'#');            // firing ledge
fill(112,8,1,4,'#');             // wall above the window
fill(112,13,1,2,'B');            // barrier below it
put(116,12,'S');                 // target

// floating platforms — somewhere for Adam's blob pieces to live, and a high route
fill(35,12,3,1,'#'); fill(67,11,3,1,'#'); fill(94,12,3,1,'#');

put(122,14,'G');
fill(0,0,1,MAP_H,'#'); fill(MAP_W-1,0,1,MAP_H,'#');

// Hand-placed, one at a time, each somewhere a particular doggo can reach and the
// others can't — the pit floors are the consolation prize for picking wrong.
// [col, row, tier] — silver where anyone can reach, green behind an ability, red on
// top of the two walls almost nobody gets over. Worth 20 all told.
const COINS = [
  [11,13,0], [19,19,0], [78,19,0], [120,13,0],
  [31,17,1], [59,10,1], [68,10,1],
  [49,8,2],  [102,10,2],
].map(([c,r,tier]) => ({ x:c*T + T/2, y:r*T + T/2, got:false, tier,
                         ph:(c*7 + r*3) % 12 }));
const COIN_TOTAL = COINS.reduce((a,c) => a + COIN_TIERS[c.tier].value, 0);
let coinsGot = 0, coinValue = 0;
const coinLabel = () => `${coinsGot}/${COINS.length} found · ${coinValue} coins`;

const doors = [];
for(let c=0;c<MAP_W;c++){
  let run = null;
  for(let r=0;r<MAP_H;r++){
    if(grid[r][c]==='R'){ if(!run){ run={c,r0:r,r1:r,open:false}; doors.push(run);} else run.r1=r; }
    else run = null;
  }
}
const doorAt = (c,r) => doors.find(d => d.c===c && r>=d.r0 && r<=d.r1);
let plasmaOpen = false;

// Terrain is a tile grid for collision but must not LOOK like one. Merge runs of
// tiles into as few big rectangles as possible, then draw those as one rounded
// mass — Doggo Battles' chunky slabs, no grid seams.
function mergeRects(pred){
  const used = Array.from({length:MAP_H}, () => new Array(MAP_W).fill(false));
  const out = [];
  for(let r=0;r<MAP_H;r++) for(let c=0;c<MAP_W;c++){
    if(used[r][c] || !pred(c,r)) continue;
    let w = 1;
    while(c+w < MAP_W && pred(c+w,r) && !used[r][c+w]) w++;
    let h = 1;
    grow: while(r+h < MAP_H){
      for(let i=0;i<w;i++) if(!pred(c+i, r+h) || used[r+h][c+i]) break grow;
      h++;
    }
    for(let rr=r;rr<r+h;rr++) for(let cc=c;cc<c+w;cc++) used[rr][cc] = true;
    out.push({x:c*T, y:r*T, w:w*T, h:h*T});
  }
  return out;
}
const ROCK = mergeRects((c,r) => grid[r][c]==='#');
const DIRT = mergeRects((c,r) => grid[r][c]==='d');
const SURFACE = 15*T;            // everything below this line is underground

// anything standing PROUD of the ground line is a stone wall; anything sitting at
// the ground line is earth with a grass cap; anything below it is buried earth.
// (shape is the wrong test — the ground slab is 6 tiles deep, so short stretches
// of it are taller than they are wide and were coming out as walls.)
ROCK.forEach(r => {
  r.platform = r.y < SURFACE && r.h <= 2*T && r.w <= 4*T;   // small and floating
  r.stone    = r.y < SURFACE && !r.platform;
  r.grass    = r.y === SURFACE;
});

// ───────────────────────────────────────────── player
const player = {
  char: byId('barkmc'), x: 3*T, y: 15*T-36, w:28, h:36,
  vx:0, vy:0, onGround:false, face:1, phase:0, coyote:0, buffer:0,
  gliding:false, digging:false, peri:0,
  zoom:0, wall:0, wallCoyote:0, trail:[],
  thrusting:false, lifting:false, flightT:0, lift:PLANE_LIFT,
  stepPhase:0, digT:0, wasGround:true, pitch:0
};
const vapor = [];        // wingtip condensation
const orbs = [];

function solidFor(ch, c, r){
  if(c<0||c>=MAP_W||r<0||r>=MAP_H) return true;
  const t = grid[r][c];
  if(t==='#') return true;
  if(t==='d') return ch.move !== 'dig';
  if(t==='B') return !plasmaOpen;
  if(t==='R'){ const d = doorAt(c,r); return !(d && d.open); }
  return false;
}
const isDirt = (c,r) => c>=0&&c<MAP_W&&r>=0&&r<MAP_H && grid[r][c]==='d';

function box(p){
  return { c0:Math.floor(p.x/T), c1:Math.floor((p.x+p.w-1)/T),
           r0:Math.floor(p.y/T), r1:Math.floor((p.y+p.h-1)/T) };
}
function overlapsDirt(p){
  const {c0,c1,r0,r1} = box(p);
  for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++) if(isDirt(c,r)) return true;
  return false;
}
function collide(axis){
  const {c0,c1,r0,r1} = box(player);
  for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++){
    if(!solidFor(player.char,c,r)) continue;
    if(axis==='x'){
      if(player.vx>0){ player.x = c*T - player.w; player.wall = 1; player.wallCoyote = WALL_GRACE; }
      else if(player.vx<0){ player.x = (c+1)*T; player.wall = -1; player.wallCoyote = WALL_GRACE; }
      player.vx = 0;
    } else {
      if(player.vy>0){ player.y = r*T - player.h; player.vy=0; player.onGround=true; }
      else if(player.vy<0){ player.y = (r+1)*T; player.vy=0; }
    }
  }
}
function blocked(ch,x,y,w,h){
  const c0=Math.floor(x/T), c1=Math.floor((x+w-1)/T);
  const r0=Math.floor(y/T), r1=Math.floor((y+h-1)/T);
  for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++) if(solidFor(ch,c,r)) return true;
  return false;
}

function becomeDoggo(ch){
  const feet = player.y + player.h;
  let ny = feet - ch.h, nx = player.x + (player.w - ch.w)/2;
  if(blocked(ch,nx,ny,ch.w,ch.h)){
    for(let k=1;k<=6;k++){ if(!blocked(ch,nx,ny-k*4,ch.w,ch.h)){ ny -= k*4; break; } }
  }
  const swapped = player.char !== ch;
  player.char = ch; player.w = ch.w; player.h = ch.h;
  player.x = nx; player.y = ny; player.vy = Math.min(player.vy,0); player.peri = 0;
  if(swapped) sfx('bark', 0.5);
  player.zoom = 0; player.trail.length = 0; player._zshown = -1;   // zoomies don't survive a swap
  if(swapped) musicForBiome();                                     // ...and neither does its track
  hudWho.textContent = ch.name;
  hudMove.textContent = `atk ${ch.atk} · spd ${ch.spd} — ${ch.ability}`;
}

// ───────────────────────────────────────────── sound
// The three short ones are Scratch's own library sounds, straight out of Doggo
// Battles. Played through Audio elements, not fetch + decodeAudioData, because
// fetch is blocked on file:// and this page gets opened by double-clicking it.
function sfx(name, vol, rate){
  const a = new Audio('sfx/' + name + '.wav');
  a.volume = vol; if(rate) a.playbackRate = rate;
  a.play().catch(() => {});
}

// ───────────────────────────────────────────── music
// Original score, synthesised live — no files, nothing borrowed. The DB project's
// music is other people's (Funkytown, Fortnite rips, stock trailer beds), so there
// was nothing there to build a theme on.
//
// Notes are MIDI numbers; melody events are [startBeat, lengthInBeats, note].
const SCORES = {
  // THE DOGGO THEME. A minor, slow. The hook is the first two bars — a rising
  // call that falls back down, like someone saying a dog's name across a field.
  doggo: {
    bpm: 70, len: 32, lead: 'triangle',
    chords: [[57,60,64],[53,57,60],[48,52,55],[55,59,62],
             [57,60,64],[53,57,60],[48,52,55],[55,59,62]],
    bass:   [45,41,36,43,45,41,36,43],
    mel: [[0,2,69],[2,1,72],[3,1,71],   [4,3,69],[7,1,67],
          [8,1,67],[9,1,64],[10,2,67],  [12,2,62],[14,2,64],
          [16,2,76],[18,1,74],[19,1,72],[20,3,72],[23,1,69],
          [24,1,71],[25,1,67],[26,2,64],[28,4,62]],
  },
  // Underground and stone. D minor, slower, mostly silence.
  deep: {
    bpm: 58, len: 16, lead: 'sine',
    chords: [[50,53,57],[46,50,53],[53,57,60],[45,49,52]],
    bass:   [38,34,41,33],
    mel: [[0,3,62],[3,1,65], [4,2,64],[6,2,62], [8,4,57], [12,2,60],[14,2,62]],
  },
  // ZOOMIES. Not a different tune — it IS the doggo theme, every note halved so the
  // same melody rips past at four times the speed, chords changing twice as often,
  // an octave-up square doubling the lead, and a kit under it. Same dog, lost it.
  zoomies: {
    bpm: 144, len: 16, lead: 'triangle', chordEvery: 2, octave: true,
    chords: [[57,60,64],[53,57,60],[48,52,55],[55,59,62],
             [57,60,64],[53,57,60],[48,52,55],[55,59,62]],
    bass:   [45,41,36,43,45,41,36,43],
    mel: [[0,1,69],[1,.5,72],[1.5,.5,71],[2,1.5,69],[3.5,.5,67],
          [4,.5,67],[4.5,.5,64],[5,1,67],[6,1,62],[7,1,64],
          [8,1,76],[9,.5,74],[9.5,.5,72],[10,1.5,72],[11.5,.5,69],
          [12,.5,71],[12.5,.5,67],[13,1,64],[14,2,62]],
  },
  // Water and ash. E minor, floating, no real tune — just long tones drifting.
  drift: {
    bpm: 54, len: 16, lead: 'sine',
    chords: [[52,55,59],[48,52,55],[57,60,64],[50,54,57]],
    bass:   [40,36,45,38],
    mel: [[0,4,64],[4,4,67],[8,4,69],[12,2,71],[14,2,67]],
  },
};
SCORES.zoomies.perc = [
  // kick on every beat plus pickups, snare on the backbeat plus ghosts,
  // sixteenth hats, a crash on each half, and a tom fill into the loop point
  ...Array.from({length:16}, (_,i) => [i,'k']),
  ...[1.75, 3.5, 7.5, 9.75, 11.5].map(b => [b,'k']),
  ...[2,6,10,14].map(b => [b,'s']),
  ...[3.75, 7.25, 13.75].map(b => [b,'s']),
  ...Array.from({length:64}, (_,i) => [i*0.25, i % 8 === 6 ? 'o' : 'h']),
  [0,'c'], [8,'c'],
  [15,'t'], [15.25,'t'], [15.5,'t'], [15.75,'t'],
];
// overdriven power chords: eighth-note chugs on the root, held stab on each change
SCORES.zoomies.gtr = [];
for(let b=0; b<16; b+=0.5)
  SCORES.zoomies.gtr.push([b, SCORES.zoomies.bass[Math.floor(b/2)] + 12, 0.40, 0.055]);
for(let b=0; b<16; b+=2)
  SCORES.zoomies.gtr.push([b, SCORES.zoomies.bass[b/2] + 12, 1.7, 0.075]);

const BIOME_TRACK = { grass:'doggo', rock:'deep', city:'deep', water:'drift', wildfire:'drift' };

// Synthesised effects. Footsteps and digging have to vary per hit or they turn
// into a machine gun, so they're generated rather than sampled.
let sfxBus = null, noiseBuf = null;
function makeNoise(){
  const n = actx.sampleRate * 0.5;
  noiseBuf = actx.createBuffer(1, n, actx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = Math.random()*2 - 1;
}
function hiss(t, dur, freq, q, peak, type, dest){
  const s = actx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = actx.createBiquadFilter(); f.type = type || 'bandpass';
  f.frequency.value = freq; f.Q.value = q;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(dest || sfxBus);
  s.start(t); s.stop(t + dur + 0.05);
}
function swoop(t, f0, f1, dur, peak, type, dest){
  const o = actx.createOscillator(); o.type = type || 'sine';
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f1), t + dur);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest || sfxBus);
  o.start(t); o.stop(t + dur + 0.05);
}
const rnd = (a,b) => a + Math.random()*(b-a);

const SND = {
  step(){ const t = actx.currentTime;
    hiss(t, 0.085, rnd(900,1500), 1.1, 0.10);
    swoop(t, rnd(150,190), 70, 0.07, 0.045); },
  dig(){ const t = actx.currentTime;
    hiss(t, 0.16, rnd(380,620), 0.8, 0.13);
    hiss(t + 0.02, 0.10, rnd(160,240), 1.4, 0.09, 'lowpass'); },
  land(v){ const t = actx.currentTime, k = Math.min(1, v/700);
    swoop(t, 170, 55, 0.16, 0.06 + 0.13*k);
    hiss(t, 0.10, 500, 0.7, 0.05 + 0.10*k); },
  jump(){ const t = actx.currentTime; swoop(t, 300, 620, 0.13, 0.09, 'triangle'); },
  kick(){ const t = actx.currentTime;
    swoop(t, 420, 880, 0.12, 0.10, 'triangle'); hiss(t, 0.07, 2200, 1.2, 0.07); },
  shoot(){ const t = actx.currentTime;
    swoop(t, 1100, 190, 0.26, 0.13, 'sawtooth'); hiss(t, 0.13, 1800, 0.9, 0.07); },
  barrier(){ const t = actx.currentTime;
    swoop(t, 700, 90, 0.5, 0.14, 'sawtooth');
    hiss(t, 0.45, 900, 0.5, 0.10); },
  door(){ const t = actx.currentTime;
    hiss(t, 0.09, 260, 1.6, 0.14, 'lowpass');
    hiss(t + 0.11, 0.09, 200, 1.6, 0.11, 'lowpass');
    swoop(t + 0.14, 320, 700, 0.35, 0.07, 'triangle'); },
  zoomies(){ const t = actx.currentTime;
    swoop(t, 200, 1500, 0.55, 0.16, 'sawtooth');
    hiss(t, 0.6, 1200, 0.5, 0.13, 'highpass');
    swoop(t + 0.5, 900, 300, 0.3, 0.10, 'square'); },
  clear(){ const t = actx.currentTime;
    [0,0.11,0.22].forEach((d,i) => swoop(t+d, [523,659,784][i], [523,659,784][i], 0.3, 0.12, 'triangle')); },
};
function snd(name, arg){
  if(!actx || !musOn) return;
  try { SND[name](arg); } catch(e) {}
}

let driveNode = null;
function makeDrive(){
  const ws = actx.createWaveShaper(), n = 1024, c = new Float32Array(n), k = 48;
  for(let i=0;i<n;i++){ const x = i*2/n - 1; c[i] = (1+k)*x / (1 + k*Math.abs(x)); }
  ws.curve = c; ws.oversample = '4x';
  const tone = actx.createBiquadFilter();
  tone.type = 'lowpass'; tone.frequency.value = 2600; tone.Q.value = 0.8;
  const lvl = actx.createGain(); lvl.gain.value = 0.5;
  ws.connect(tone); tone.connect(lvl); lvl.connect(musDry);
  return ws;
}
// power chord — root, fifth, octave, the way a guitar actually voices it
function guitar(t, midi, dur, peak){
  [0, 7, 12].forEach((iv, i) => {
    const o = actx.createOscillator();
    o.type = 'sawtooth'; o.frequency.value = hz(midi + iv);
    o.detune.value = (i - 1) * 6;
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak * (i ? 0.6 : 1), t + 0.008);
    g.gain.setTargetAtTime(0.0001, t + dur*0.55, dur*0.30);
    o.connect(g); g.connect(driveNode);
    o.start(t); o.stop(t + dur + 0.3);
  });
}
function drum(t, k){
  if(k==='k'){ swoop(t,165,44,0.18,0.60,'sine',musDry); hiss(t,0.03,110,1,0.22,'lowpass',musDry); }
  else if(k==='s'){ hiss(t,0.15,1750,0.7,0.30,'bandpass',musDry);
                    swoop(t,330,175,0.09,0.16,'triangle',musDry); }
  else if(k==='h'){ hiss(t,0.035,7500,0.6,0.09,'highpass',musDry); }
  else if(k==='o'){ hiss(t,0.15,6500,0.5,0.10,'highpass',musDry); }
  else if(k==='c'){ hiss(t,0.9,5200,0.35,0.16,'highpass',musDry); }   // crash
  else if(k==='t'){ swoop(t,240,120,0.16,0.34,'sine',musDry);         // tom
                    hiss(t,0.09,420,1.2,0.12,'bandpass',musDry); }
}
let musDry = null;
let actx = null, musBus = null, musOn = true, musTrack = null, musMeter = null;
let beatCursor = 0, nextBeatAt = 0, musTimer = null;

function initAudio(){
  if(actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  musBus = actx.createGain(); musBus.gain.value = 0;
  const lp = actx.createBiquadFilter();          // takes the edge off — no chiptune buzz
  lp.type = 'lowpass'; lp.frequency.value = 3200; lp.Q.value = 0.6;
  const dly = actx.createDelay(1.0); dly.delayTime.value = 0.36;
  const fb = actx.createGain(); fb.gain.value = 0.3;
  const wet = actx.createGain(); wet.gain.value = 0.3;
  // A limiter on the end so the whole thing can sit at a real listening level
  // without the pad, bass and melody peaks stacking up into clipping.
  const comp = actx.createDynamicsCompressor();
  comp.threshold.value = -12; comp.knee.value = 8;
  comp.ratio.value = 6; comp.attack.value = 0.01; comp.release.value = 0.2;
  musBus.connect(lp); lp.connect(comp);
  lp.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(wet); wet.connect(comp);
  sfxBus = actx.createGain(); sfxBus.gain.value = 0.9;
  sfxBus.connect(comp);
  musDry = actx.createGain(); musDry.gain.value = 0.85;
  musDry.connect(comp);
  driveNode = makeDrive();                    // dry — effects skip the music delay
  makeNoise();
  musMeter = actx.createAnalyser(); musMeter.fftSize = 2048;
  comp.connect(musMeter);
  comp.connect(actx.destination);
}
const hz = m => 440 * Math.pow(2, (m - 69) / 12);

let noteCount = 0;
function voice(t, midi, dur, peak, type, detune){
  noteCount++;
  const o = actx.createOscillator();
  o.type = type; o.frequency.value = hz(midi); o.detune.value = detune || 0;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + 0.07);          // soft attack, never a click
  g.gain.setTargetAtTime(0.0001, t + dur * 0.6, dur * 0.3);
  o.connect(g); g.connect(musBus);
  o.start(t); o.stop(t + dur + 1.4);
}

function musicTick(){
  if(!musTrack || !actx) return;
  const s = SCORES[musTrack], spb = 60 / s.bpm;
  while(nextBeatAt < actx.currentTime + 0.3){
    const b = beatCursor % s.len, t = nextBeatAt;
    const every = s.chordEvery || 4;
    if(b % every === 0){
      const bar = (b / every) | 0;
      s.chords[bar].forEach((n, i) => {            // pad, two slightly detuned layers
        voice(t, n, spb * 3.8, 0.055, 'sine', -6);
        voice(t, n + 12, spb * 3.8, 0.026, 'sine', 6 + i * 3);
      });
      voice(t, s.bass[bar], spb * 3.6, 0.150, 'sine');
      voice(t, s.bass[bar] + 12, spb * 3.6, 0.045, 'triangle');
    }
    s.mel.forEach(e => {
      if(Math.floor(e[0]) !== b) return;
      const tt = t + (e[0] - b) * spb;                 // fractional beats allowed
      voice(tt, e[2], e[1] * spb, 0.190, s.lead, -4);  // two detuned copies = warmth
      voice(tt, e[2], e[1] * spb, 0.120, s.lead, 5);
      voice(tt, e[2] - 12, e[1] * spb, 0.045, 'sine');
      if(s.octave) voice(tt, e[2] + 12, e[1] * spb * 0.6, 0.055, 'square', 7);
    });
    if(s.perc) s.perc.forEach(e => {
      if(Math.floor(e[0]) !== b) return;
      drum(t + (e[0] - b) * spb, e[1]);
    });
    if(s.gtr) s.gtr.forEach(e => {
      if(Math.floor(e[0]) !== b) return;
      guitar(t + (e[0] - b) * spb, e[1], e[2] * spb, e[3]);
    });
    beatCursor++; nextBeatAt += spb;
  }
}

function startMusic(){
  if(!musOn) return;
  initAudio();
  if(actx.state === 'suspended') actx.resume();
  if(musTimer) return;
  musTrack = BIOME_TRACK[biome] || 'doggo';
  beatCursor = 0; nextBeatAt = actx.currentTime + 0.15;
  musBus.gain.setTargetAtTime(1.0, actx.currentTime, 0.45);
  musTimer = setInterval(musicTick, 30);
}
function setTrack(want){
  if(!musTimer || want === musTrack){ musTrack = want; return; }
  musTrack = want; beatCursor = 0; nextBeatAt = actx.currentTime + 0.12;
}
function musicForBiome(){
  setTrack(player.zoom > 0 ? 'zoomies' : (BIOME_TRACK[biome] || 'doggo'));
}
function toggleMusic(){
  musOn = !musOn;
  if(musOn){ startMusic(); }
  else {
    if(musBus) musBus.gain.setTargetAtTime(0, actx.currentTime, 0.25);
    clearInterval(musTimer); musTimer = null;
  }
  hudBiome.textContent = biome + (musOn ? '' : ' · muted');
}

// ───────────────────────────────────────────── input
const keys = {};
const held = { left:false, right:false, up:false, jump:false, use:false };
// any real gesture anywhere unlocks audio, not just the on-screen buttons
addEventListener('pointerdown', startMusic);

// where Airplane Doggo is aiming. Canvas space; add ox/oy for world space.
let mouseX = null, mouseY = null;
addEventListener('pointermove', e => {
  const r = cv.getBoundingClientRect();
  if(!r.width || !r.height) return;
  mouseX = (e.clientX - r.left) / r.width  * VIEW_W;
  mouseY = (e.clientY - r.top)  / r.height * VIEW_H;
});
addEventListener('keydown', e => {
  startMusic();
  if(e.code==='KeyM'){ toggleMusic(); return; }
  if(keys[e.code]) return; keys[e.code] = true;
  if(rosterOpen) rosterKey(e);
  else if(e.code==='KeyE') action();
  if(e.code==='KeyR') reset();
  if(e.code==='KeyB' && !rosterOpen)
    setBiome(BIOME_NAMES[(BIOME_NAMES.indexOf(biome)+1) % BIOME_NAMES.length]);
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
const L = () => held.left  || keys.ArrowLeft  || keys.KeyA;
const R = () => held.right || keys.ArrowRight || keys.KeyD;
const U = () => held.up    || keys.ArrowUp    || keys.KeyW;
const D = () => keys.ArrowDown || keys.KeyS;
const J = () => held.jump  || keys.Space;      // up is for LOOKING, not jumping

if(matchMedia('(pointer:coarse)').matches) document.body.classList.add('touch');
document.querySelectorAll('#pad button').forEach(b => {
  const k = b.dataset.k;
  const on  = e => { e.preventDefault(); startMusic();
                     if(k==='use') action(); else held[k]=true; };
  const off = e => { e.preventDefault(); if(k!=='use') held[k]=false; };
  b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off);
  b.addEventListener('pointercancel',off); b.addEventListener('pointerleave',off);
});

// one action button: a kennel if you're standing at one, otherwise whatever this doggo does
function action(){
  if(rosterOpen) return;
  if(nearKennel()) { openRoster(); return; }
  if(player.char.move === 'zoom'){
    player.zoom = ZOOM_TIME;
    sfx('bark', 0.7); snd('zoomies');
    toastEl.classList.remove('go'); void toastEl.offsetWidth;   // restart the animation
    toastEl.classList.add('go');
    musicForBiome();
    return;
  }
  if(player.char.move === 'plasma' && orbs.length < 3){
    orbs.push({ x: player.x + player.w/2 + player.face*10,
                y: player.y + player.h*0.45, vx: player.face*ORB_SPEED, life: 2.4 });
    snd('shoot');
  }
}

// ───────────────────────────────────────────── kennel + roster ui
const rosterEl = document.getElementById('roster');
const cardsEl  = document.getElementById('cards');
const hudWho   = document.getElementById('who');
const hudMove  = document.getElementById('move');
const tipEl    = document.getElementById('tip');
const hudCoins = document.getElementById('coins');
const hudBiome = document.getElementById('biome');
const bannerEl = document.getElementById('banner');
const toastEl  = document.getElementById('toast');
let rosterOpen = false, rosterSel = 0;
const cardCtx = [];

CAST.forEach((c,i) => {
  const card = document.createElement('div');
  card.className = 'card' + (c.locked ? ' lock' : '');
  const cv = document.createElement('canvas'); cv.width = 100; cv.height = 62;
  card.append(cv);
  const b = document.createElement('b'); b.textContent = c.name;
  const st = document.createElement('div'); st.className = 'stat';
  st.textContent = `${c.atk} · ${c.spd}`;
  const ab = document.createElement('span'); ab.className = 'abil'; ab.textContent = c.ability;
  const nt = document.createElement('span'); nt.className = 'note';
  nt.textContent = `${c.tag} — ${c.note}`;
  card.append(b,st,ab,nt);
  card.addEventListener('click', () => { rosterSel = i; pickRoster(); });
  card.addEventListener('mouseenter', () => { rosterSel = i; drawRoster(); });
  cardsEl.append(card);
  cardCtx.push({g: cv.getContext('2d'), c});
});
function drawCardArt(){
  cardCtx.forEach(({g,c}) => {
    g.clearRect(0,0,100,62);
    if(c.art){
      const im = IMG[c.art];
      if(!(im && im.complete && im.naturalWidth)) return;
      drawDog(g, 50-c.w/2, 58-c.h, c, 1, 0, {dh:50, moving:false});   // cards: uniform
    }
    else {
      g.save(); g.translate(50 - c.w*1.25/2, 57 - c.h*1.25);
      g.scale(1.25,1.25); drawDog(g, 0, 0, c, 1, 0, {moving:false}); g.restore();
    }
  });
}
function drawRoster(){
  [...cardsEl.children].forEach((el,i) => {
    const on = i===rosterSel;
    el.classList.toggle('sel', on);
    if(on) el.scrollIntoView({block:'nearest'});
  });
}
function openRoster(){
  rosterOpen = true; rosterSel = Math.max(0, CAST.indexOf(player.char));
  sfx('pop', 0.5);
  rosterEl.classList.add('on'); drawRoster();
}
function closeRoster(){ rosterOpen = false; rosterEl.classList.remove('on'); }
function pickRoster(){
  const c = CAST[rosterSel];
  if(c.locked) return;             // nobody gets Qorvex yet
  becomeDoggo(c); closeRoster();
}
function perRow(){
  return Math.max(1, Math.floor(cardsEl.clientWidth / (cardsEl.children[0].offsetWidth + 9)));
}
function rosterKey(e){
  const n = CAST.length, k = perRow();
  if(e.code==='ArrowLeft'){ rosterSel = (rosterSel+n-1)%n; drawRoster(); }
  if(e.code==='ArrowRight'){ rosterSel = (rosterSel+1)%n; drawRoster(); }
  if(e.code==='ArrowUp'){ rosterSel = (rosterSel-k+n)%n; drawRoster(); }
  if(e.code==='ArrowDown'){ rosterSel = (rosterSel+k)%n; drawRoster(); }
  if(e.code==='Enter'||e.code==='KeyE'||e.code==='Space') pickRoster();
  if(e.code==='Escape') closeRoster();
}
function nearKennel(){
  const cx = (player.x+player.w/2)/T, cy = (player.y+player.h/2)/T;
  for(let r=0;r<MAP_H;r++) for(let c=0;c<MAP_W;c++)
    if(grid[r][c]==='K' && Math.abs(c+0.5-cx)<1.4 && Math.abs(r+1-cy)<2) return {c,r};
  return null;
}

function reset(){
  doors.forEach(d => d.open = false);
  plasmaOpen = false; orbs.length = 0; vapor.length = 0;
  COINS.forEach(c => c.got = false);
  coinsGot = 0; coinValue = 0; hudCoins.textContent = coinLabel();
  player.x = 3*T; player.vx = 0; player.vy = 0;
  becomeDoggo(byId('barkmc'));
  player.y = 15*T - player.h;
  bannerEl.classList.remove('on'); cleared = false;
}

// ───────────────────────────────────────────── update
let cleared = false, spin = 0;
function update(dt){
  if(rosterOpen) return;
  const ch = player.char;
  player.digging = ch.move==='dig' && overlapsDirt(player);

  if(player.digging){
    const ix = (R()?1:0) - (L()?1:0);
    const iy = (D()?1:0) - (U()||J()?1:0);
    player.vx = ix*DIG_SPEED; player.vy = iy*DIG_SPEED || 40;
    if(ix) player.face = ix;
    player.gliding = false;
  } else {
    const ix = (R()?1:0) - (L()?1:0);
    if(ix){
      // Turning gets full bite, so a doggo that takes a while to WIND UP still
      // answers the stick immediately — that's the difference between "heavy" and
      // "slippery".
      const turning = ix * player.vx < 0;
      player.vx += ix * ACCEL * (ch.accelMul || 1) * (turning ? 2.8 : 1) * dt;
      player.face = ix;
    } else {
      const f = FRICTION * (ch.frictionMul || 1) * dt;
      player.vx = Math.abs(player.vx) <= f ? 0 : player.vx - Math.sign(player.vx)*f;
    }
    const zooming = player.zoom > 0;
    const flying  = ch.move==='glide' && !player.onGround && player.vy > 0 && J();
    const base = RUN * (ch.speedMul || 1) * (zooming ? ZOOM_SPEED : 1);
    const cap  = flying ? PLANE_RUN : base;
    player.vx = Math.max(-cap, Math.min(cap, player.vx));

    if(player.onGround){ player.coyote = COYOTE; player.wallCoyote = 0; }
    else player.coyote -= dt;
    player.wallCoyote -= dt;
    if(J() && !keys._jheld) player.buffer = BUFFER; else player.buffer -= dt;
    keys._jheld = J();

    const jm = (ch.jumpMul || 1) * (zooming ? ZOOM_JUMP : 1);
    if(player.buffer>0 && player.coyote>0){
      player.vy = JUMP_V * jm;
      player.buffer = 0; player.coyote = 0; player.onGround = false;
      snd('jump');
    } else if(zooming && player.buffer>0 && player.wallCoyote>0 && player.wall){
      player.vy = JUMP_V * jm * 0.92;              // wall kick, away from the wall
      player.vx = -player.wall * RUN * ZOOM_SPEED * WALL_KICK;
      player.face = Math.sign(player.vx);
      player.buffer = 0; player.wallCoyote = 0;
      snd('kick');
    }
    const cut = -170 * jm;
    if(player.vy < cut && !J()) player.vy = cut;

    if(player.onGround){ player.flightT = 0; player.lift = PLANE_LIFT; player.pitch = 0; }
    player.gliding = player.thrusting = flying;
    if(flying){
      const waist = player.y + player.h*0.5;
      const my = mouseY === null ? waist : mouseY + oy;
      // -1 nose fully up · 0 trimmed · +1 nose fully down. Smoothed, so the
      // transition through level is a slope and not a cliff.
      const raw  = Math.max(-1, Math.min(1, (my - waist) / PLANE_RANGE));
      const want = Math.abs(raw) < PLANE_DEAD ? 0 : raw;
      player.pitch += (want - player.pitch) * Math.min(1, PLANE_EASE*dt);

      const up = Math.max(0, -player.pitch), down = Math.max(0, player.pitch);
      player.lifting = up > 0.15 && player.lift > 0;
      player.diving  = down > 0.15;
      // the reserve drains only as hard as he is actually pulling, and the
      // decay clock slows while he's straining instead of stopping dead
      if(up > 0 && player.lift > 0) player.lift -= dt*up;
      player.flightT += dt * (1 - up*0.85);

      const decay = Math.min(MAX_FALL, PLANE_SINK0 * Math.exp(player.flightT / PLANE_TAU));
      const hold  = player.lift > 0 ? PLANE_HOLD : decay;
      const sink  = down > 0 ? decay + (PLANE_DIVE - decay) * down*down
                             : decay + (hold - decay) * up;
      player.vy += (sink - player.vy) * Math.min(1, (5.5 + down*7)*dt);
    } else {
      player.lifting = player.diving = false; player.pitch = 0;
      player.vy += GRAV*dt;
      player.vy = Math.min(player.vy, MAX_FALL);
    }
  }

  const fellAt = player.vy;
  player.onGround = false;
  player.x += player.vx*dt; collide('x');
  player.y += player.vy*dt; collide('y');

  // footsteps pace themselves off the walk cycle, so they speed up when he does
  if(player.onGround && Math.abs(player.vx) > 25 && !player.digging){
    player.stepPhase += Math.abs(player.vx)*dt;
    if(player.stepPhase > 34){ player.stepPhase = 0; snd('step'); }
  } else player.stepPhase = 0;
  if(player.onGround && !player.wasGround && fellAt > 260) snd('land', fellAt);
  player.wasGround = player.onGround;

  if(player.digging){
    player.digT -= dt;
    if(player.digT <= 0){ player.digT = 0.15; snd('dig'); }
  } else player.digT = 0;

  // the chip: robo doors just open for whoever is wearing one, and stay open
  if(ch.move==='chip'){
    const c0=Math.floor((player.x-6)/T), c1=Math.floor((player.x+player.w+5)/T);
    const r0=Math.floor(player.y/T), r1=Math.floor((player.y+player.h-1)/T);
    for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++){
      const d = doorAt(c,r); if(d && !d.open){ d.open = true; d.t = 0; snd('door'); }
    }
  }
  doors.forEach(d => { if(d.open) d.t = Math.min(1, (d.t||0) + dt*3); });

  // plasma orbs
  for(let i=orbs.length-1;i>=0;i--){
    const o = orbs[i];
    o.x += o.vx*dt; o.life -= dt;
    const c = Math.floor(o.x/T), r = Math.floor(o.y/T);
    const t = (c>=0&&c<MAP_W&&r>=0&&r<MAP_H) ? grid[r][c] : '#';
    if(t==='S'){ plasmaOpen = true; snd('barrier'); orbs.splice(i,1); continue; }
    const hard = t==='#' || t==='d' || (t==='B' && !plasmaOpen) ||
                 (t==='R' && !(doorAt(c,r)||{}).open);
    if(hard || o.life<=0) orbs.splice(i,1);
  }

  // periscope — coyote, not onGround: standing still makes onGround flicker frame to frame
  const wantPeri = ch.move==='look' && player.coyote > 0 && Math.abs(player.vx) < 12 && U();
  player.peri = Math.max(0, Math.min(1, player.peri + (wantPeri ? dt*2.2 : -dt*3.2)));

  if(player.zoom > 0){
    player.zoom = Math.max(0, player.zoom - dt);
    player.trail.unshift({x:player.x, y:player.y, f:player.face});
    if(player.trail.length > 7) player.trail.pop();
    const left = Math.ceil(player.zoom);
    if(left !== player._zshown){
      player._zshown = left;
      hudMove.textContent = left ? `ZOOMIES — ${left}s` : ch.blurbCache || ch.ability;
    }
    if(player.zoom === 0){
      player.trail.length = 0; musicForBiome();
      hudMove.textContent = `atk ${ch.atk} · spd ${ch.spd} — ${ch.ability}`;
    }
  } else if(player.trail.length) player.trail.length = 0;

  // wingtip condensation — spawn off the back of the wing while the engine is lit,
  // then let each puff drift, swell and thin out
  if(player.thrusting){
    const tipX = player.x + (player.face > 0 ? 2 : player.w - 2);
    const tipY = player.y + player.h*0.72;
    for(let i=0;i<(player.lifting?3:2);i++)      // denser while he's straining
      vapor.push({ x: tipX, y: tipY + (i?5:-3),
                   vx: -player.face*(40 + Math.random()*50) + player.vx*0.12,
                   vy: -14 - Math.random()*22,
                   t: 0, life: 0.55 + Math.random()*0.35 });
  }
  for(let i=vapor.length-1;i>=0;i--){
    const p = vapor[i];
    p.t += dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= 0.94; p.vy *= 0.96;
    if(p.t >= p.life) vapor.splice(i,1);
  }

  spin += dt*8.5;
  COINS.forEach(c => {
    if(c.got) return;
    if(player.x < c.x+13 && player.x+player.w > c.x-13 &&
       player.y < c.y+15 && player.y+player.h > c.y-15){
      const tier = COIN_TIERS[c.tier];
      c.got = true; coinsGot++; coinValue += tier.value;
      sfx('coin', 0.35, tier.rate);
      hudCoins.textContent = coinLabel();
    }
  });

  player.phase += Math.abs(player.vx)*dt*0.06;

  const gx = 122*T, gy = 14*T;
  if(!cleared && player.x+player.w > gx && player.x < gx+T &&
     player.y+player.h > gy && player.y < gy+2*T){
    cleared = true; bannerEl.classList.add('on'); snd('clear');
  }

  const k = nearKennel();
  tipEl.classList.toggle('hot', !!k);
  const fire = ch.move==='plasma' ? ' · E to shoot'
             : ch.move==='zoom'   ? ' · E for ZOOMIES'
             : ch.move==='glide'  ? ' · hold jump, steer with the mouse' : '';
  tipEl.textContent = k ? 'KENNEL — press E to change doggo'
    : (document.body.classList.contains('touch')
        ? '← → move · ↑ look · JUMP' + (fire ? ' · E shoot' : '')
        : '← → / A D move · Space jump · ↑ look · E at a kennel' + fire + ' · B biome · M music · R restart');
}

// ───────────────────────────────────────────── drawing
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
function fitCanvas(){
  const wrap = document.getElementById('wrap');
  const s = Math.min(wrap.clientWidth/VIEW_W, wrap.clientHeight/VIEW_H);
  const dpr = Math.min(2, devicePixelRatio||1);
  cv.width = Math.round(VIEW_W*s*dpr); cv.height = Math.round(VIEW_H*s*dpr);
  cv.style.width = (VIEW_W*s)+'px'; cv.style.height = (VIEW_H*s)+'px';
  ctx.setTransform(s*dpr,0,0,s*dpr,0,0);
}
addEventListener('resize', fitCanvas);

function rr(g,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  g.beginPath();
  g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}
function shade(hex,amt){
  const n = parseInt(hex.slice(1),16);
  const cl = v => Math.max(0,Math.min(255,v));
  return '#'+[(n>>16)+amt,((n>>8)&255)+amt,(n&255)+amt]
    .map(v=>cl(v).toString(16).padStart(2,'0')).join('');
}

// Adam's art if this doggo has any, otherwise a placeholder vector doggo in a hat.
function drawDog(g,x,y,ch,face,phase,st){
  // Qorvex carries a second, torn-up drawing — flick to it now and then so he
  // never quite holds still.
  const key = (ch.art2 && Math.floor(spin*2.4) % 11 === 0) ? ch.art2 : ch.art;
  const img = key && IMG[key];
  if(img && img.complete && img.naturalWidth){
    const dh = st.dh || ch.dh || DOG_H;
    const s  = dh / img.naturalHeight;
    const dw = img.naturalWidth * s;
    const moving = !!st.moving;
    const bob  = moving ? Math.abs(Math.sin(phase*2))*2.2 : 0;
    const tilt = st.gliding ? (st.pitch || 0) * 0.42   // banks with the nose
               : (moving ? Math.sin(phase)*0.045 : 0);
    g.save();
    g.translate(x + ch.w/2, y + ch.h);
    g.rotate(tilt*(face<0?-1:1));
    g.scale(face<0?-1:1, 1);
    const N = ch.neck;
    if(N && st.peri > 0.01){
      const iw = img.naturalWidth, ih = img.naturalHeight, s = dh/ih;
      const hSrc = N.head*ih, nSrc = (N.body-N.head)*ih, bSrc = (1-N.body)*ih;
      const ext = st.peri * dh * 0.7;
      const bTop = -bSrc*s, nTop = bTop - nSrc*s - ext, hTop = nTop - hSrc*s;
      g.drawImage(img, 0, N.body*ih, iw, bSrc, -dw/2, bTop, dw, bSrc*s);
      g.drawImage(img, 0, N.head*ih, iw, nSrc, -dw/2, nTop, dw, nSrc*s + ext);
      g.drawImage(img, 0, 0,         iw, hSrc, -dw/2, hTop, dw, hSrc*s);
    } else {
      g.drawImage(img, -dw/2, -dh + bob, dw, dh);
    }
    g.restore();
    return;
  }

  const w = ch.w, h = ch.h, col = ch.col;
  const bodyH = h*0.70, legTop = y + bodyH;
  const swing = Math.sin(phase)*Math.min(5, w*0.22);
  const dark = shade(col,-45);

  g.strokeStyle = dark; g.lineWidth = Math.max(3, w*0.14); g.lineCap = 'round';
  g.beginPath();
  g.moveTo(x+w*0.30+swing, legTop-1); g.lineTo(x+w*0.30+swing*0.4, y+h-1);
  g.moveTo(x+w*0.70-swing, legTop-1); g.lineTo(x+w*0.70-swing*0.4, y+h-1);
  g.stroke();

  g.strokeStyle = col; g.lineWidth = Math.max(3, w*0.13);
  g.beginPath();
  const tx = face>0 ? x : x+w;
  g.moveTo(tx, y+bodyH*0.45);
  g.quadraticCurveTo(tx-face*w*0.28, y+bodyH*0.30, tx-face*w*0.22, y+bodyH*0.02);
  g.stroke();

  g.fillStyle = dark;
  if(st.gliding){
    g.beginPath();
    g.moveTo(x+w*0.18, y+bodyH*0.22);
    g.lineTo(x-w*0.55, y+bodyH*0.02); g.lineTo(x+w*0.20, y+bodyH*0.50); g.fill();
    g.beginPath();
    g.moveTo(x+w*0.82, y+bodyH*0.22);
    g.lineTo(x+w*1.55, y+bodyH*0.02); g.lineTo(x+w*0.80, y+bodyH*0.50); g.fill();
  } else {
    g.beginPath();
    g.moveTo(x+w*0.20, y+bodyH*0.30); g.lineTo(x+w*0.10, y-bodyH*0.22);
    g.lineTo(x+w*0.46, y+bodyH*0.12); g.fill();
    g.beginPath();
    g.moveTo(x+w*0.80, y+bodyH*0.30); g.lineTo(x+w*0.90, y-bodyH*0.22);
    g.lineTo(x+w*0.54, y+bodyH*0.12); g.fill();
  }

  g.fillStyle = col; rr(g,x,y,w,bodyH,Math.min(w,bodyH)*0.42); g.fill();

  if(ch.hat === 'spots'){
    g.fillStyle = '#2c2a33';
    [[0.28,0.30,0.11],[0.62,0.52,0.09],[0.44,0.72,0.07]].forEach(([a,b,r])=>{
      g.beginPath(); g.arc(x+w*a, y+bodyH*b, w*r, 0, 7); g.fill();
    });
  }

  g.fillStyle = shade(col,22);
  const sx = face>0 ? x+w*0.58 : x+w*0.06;
  rr(g,sx,y+bodyH*0.46,w*0.36,bodyH*0.34,bodyH*0.16); g.fill();
  g.fillStyle = '#241f3d';
  g.beginPath();
  g.arc(face>0 ? sx+w*0.30 : sx+w*0.06, y+bodyH*0.60, Math.max(1.6,w*0.065), 0, 7); g.fill();

  const ex = face>0 ? x+w*0.56 : x+w*0.44;
  if(ch.hat === 'shades'){
    g.fillStyle = '#1b1830';
    rr(g, x+w*0.34, y+bodyH*0.20, w*0.52, bodyH*0.20, 3); g.fill();
  } else {
    g.fillStyle = '#fff';
    g.beginPath(); g.arc(ex, y+bodyH*0.30, Math.max(2.6,w*0.13), 0, 7); g.fill();
    g.fillStyle = '#1b1830';
    g.beginPath(); g.arc(ex+face*w*0.035, y+bodyH*0.31, Math.max(1.4,w*0.065), 0, 7); g.fill();
  }

  const hx = x+w*0.5, hy = y - bodyH*0.06;
  switch(ch.hat){
    case 'cowboy':
      g.fillStyle = '#7a4a24';
      rr(g, x-w*0.16, hy-2, w*1.32, 5, 2.5); g.fill();
      rr(g, x+w*0.24, hy-11, w*0.52, 11, 3); g.fill();
      break;
    case 'crown':
      g.fillStyle = '#ffd75e';
      g.beginPath();
      g.moveTo(x+w*0.22, hy); g.lineTo(x+w*0.22, hy-9); g.lineTo(x+w*0.36, hy-4);
      g.lineTo(x+w*0.50, hy-12); g.lineTo(x+w*0.64, hy-4); g.lineTo(x+w*0.78, hy-9);
      g.lineTo(x+w*0.78, hy); g.closePath(); g.fill();
      break;
    case 'helm':
      g.fillStyle = '#c3cad8';
      rr(g, x+w*0.16, hy-11, w*0.68, 14, 5); g.fill();
      g.fillStyle = '#3a4152';
      rr(g, x+w*0.20, hy-4, w*0.60, 3.5, 1.5); g.fill();
      break;
    case 'antenna':
      g.strokeStyle = shade(col,-55); g.lineWidth = 2.4;
      g.beginPath(); g.moveTo(hx, hy); g.lineTo(hx+3, hy-12); g.stroke();
      g.fillStyle = '#ff4d6d';
      g.beginPath(); g.arc(hx+3, hy-14, 3.4, 0, 7); g.fill();
      break;
    case 'party':
      g.fillStyle = '#4cc9f0';
      g.beginPath();
      g.moveTo(x+w*0.34, hy); g.lineTo(x+w*0.62, hy); g.lineTo(x+w*0.46, hy-15);
      g.closePath(); g.fill();
      g.fillStyle = '#ffd166';
      g.beginPath(); g.arc(x+w*0.46, hy-16, 2.6, 0, 7); g.fill();
      break;
  }
}

// Two passes so the whole mass reads as one shape: every rect fattened and drawn
// in the dark shade first, then every rect drawn in its gradient on top. Abutting
// rects overlap by PAD*2 so no seam or corner notch survives, and the only dark
// left showing is the outline around the outside — a darker version of the fill,
// never black.
const PAD = 2, OUT = 10, GRASS_H = 15;
let C = { ...BASE_C, ...BIOMES[biome].C };
function setBiome(name){
  biome = name;
  C = { ...BASE_C, ...BIOMES[name].C };
  hudBiome.textContent = name + (musOn ? '' : ' · muted');
  musicForBiome();
}
const radOf = r => 8 + ((r.x*7 + r.y*13) % 5) * 1.6;

// deterministic in WORLD space so the squiggle doesn't crawl when the camera moves
function droop(wx){
  return Math.sin(wx*0.13)*2.4 + Math.sin(wx*0.041 + 1.7)*3.4 + Math.sin(wx*0.0071 + 0.4)*2.6
       + Math.pow(Math.max(0, Math.sin(wx*0.023 + 2.2)), 7) * 15;
}
const hash = (a,b) => { const s = Math.sin(a*12.9898 + b*78.233)*43758.5453; return s - Math.floor(s); };

// Seed and place textures in WORLD space, then subtract the camera. Seeding from
// screen coords re-rolls the noise every pixel of scroll and the ground boils.
function blobs(wx, wy, w, h, n, col, rmin, rmax){
  ctx.fillStyle = col;
  for(let i=0;i<n;i++){
    const bx = wx + hash(i, wy)*w, by = wy + hash(i+91, wx)*h;
    const rad = rmin + hash(i+37, wy+i)*(rmax-rmin);
    ctx.beginPath();
    ctx.ellipse(bx-ox, by-oy, rad, rad*(0.6 + hash(i+7,wx)*0.5), hash(i,i)*3, 0, 7);
    ctx.fill();
  }
}

// subtle cracks and # marks, world-anchored
function stoneMarks(r){
  const n = Math.max(2, (r.w*r.h)/7000|0);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(52,58,70,.26)'; ctx.lineWidth = 2;
  for(let i=0;i<n;i++){
    let cx = r.x + hash(i, r.y)*r.w, cy = r.y + hash(i+61, r.x)*r.h;
    ctx.beginPath(); ctx.moveTo(cx-ox, cy-oy);
    for(let k=0;k<3;k++){
      cx += (hash(i+k, k+3)-0.5)*26; cy += (hash(i+k+17, k)-0.35)*30;
      ctx.lineTo(cx-ox, cy-oy);
    }
    ctx.stroke();
  }
  const m = Math.max(2, (r.w*r.h)/5500|0);
  ctx.lineWidth = 1.8;
  for(let i=0;i<m;i++){
    const hx = r.x + hash(i+3, r.y+9)*r.w - ox, hy = r.y + hash(i+29, r.x+5)*r.h - oy;
    const s = 6 + hash(i, r.x)*4;
    ctx.strokeStyle = hash(i,i+1) > 0.5 ? 'rgba(255,255,255,.22)' : 'rgba(52,58,70,.24)';
    ctx.beginPath();
    ctx.moveTo(hx-s, hy-s*0.35); ctx.lineTo(hx+s, hy-s*0.35);
    ctx.moveTo(hx-s, hy+s*0.35); ctx.lineTo(hx+s, hy+s*0.35);
    ctx.moveTo(hx-s*0.35, hy-s); ctx.lineTo(hx-s*0.35, hy+s);
    ctx.moveTo(hx+s*0.35, hy-s); ctx.lineTo(hx+s*0.35, hy+s);
    ctx.stroke();
  }
}

function drawTerrain(){
  const vis = ROCK.filter(r => r.x - ox < VIEW_W + 60 && r.x + r.w - ox > -60 &&
                               r.y - oy < VIEW_H + 60 && r.y + r.h - oy > -60);

  vis.forEach(r => {                                   // outline: darker shade, never black
    if(r.platform) return;                             // his blobs carry their own outline
    const ex = r.x-ox-PAD-OUT, ey = r.y-oy-PAD-OUT;
    const ew = r.w+(PAD+OUT)*2, eh = r.h+(PAD+OUT)*2, er = radOf(r)+OUT;
    ctx.fillStyle = r.stone ? C.stoneEdge : C.earthEdge;
    rr(ctx, ex, ey, ew, eh, er); ctx.fill();
    if(r.grass){
      // the rim ABOVE a grass mass belongs to the grass, so it's dark green, not
      // dark brown — the sides stay brown because the sides are dirt
      ctx.save();
      ctx.beginPath(); ctx.rect(ex, ey, ew, OUT+PAD+1); ctx.clip();
      ctx.fillStyle = C.grassEdge;
      rr(ctx, ex, ey, ew, eh, er); ctx.fill();
      ctx.restore();
    }
  });

  vis.forEach(r => {
    if(r.platform){
      const n = BIOMES[biome].plats;
      const im = TERRAIN_IMG[biome + '-plat' + ((((r.x/T)|0) + ((r.y/T)|0)) % n + 1)];
      if(im && im.complete && im.naturalWidth)
        ctx.drawImage(im, r.x-ox-7, r.y-oy-6, r.w+14, r.h+13);
      return;
    }
    const x = r.x-ox-PAD, y = r.y-oy-PAD, w = r.w+PAD*2, h = r.h+PAD*2;
    ctx.save();
    rr(ctx, x, y, w, h, radOf(r)); ctx.clip();

    if(r.stone){
      const g = ctx.createLinearGradient(0, y, 0, y + Math.min(h, 260));
      g.addColorStop(0, C.stone); g.addColorStop(1, C.stoneLow);
      ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
      stoneMarks(r);
    } else {
      const g = ctx.createLinearGradient(0, y, 0, y + Math.min(h, 300));
      g.addColorStop(0, C.earth); g.addColorStop(1, C.earthLow);
      ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
      blobs(r.x, r.y, r.w, r.h, Math.max(3, (r.w*r.h)/5200|0), 'rgba(60,38,20,.30)', 5, 15);

      if(r.grass){
        const im = TERRAIN_IMG[biome + '-ground'], STRIP_H = BIOMES[biome].stripH;
        if(im && im.complete && im.naturalWidth){
          // Tile his strip, aligned to WORLD positions so it can't slide as you walk.
          const s = STRIP_H / im.naturalHeight, tw = im.naturalWidth * s;
          const x0 = Math.floor(r.x / tw) * tw;
          for(let px = x0; px < r.x + r.w + tw; px += tw)
            ctx.drawImage(im, Math.round(px-ox), Math.round(r.y-oy-PAD),
                          Math.ceil(tw)+1, STRIP_H);
        } else {
          ctx.fillStyle = C.grass; ctx.fillRect(x, y, w, GRASS_H);
        }
      }
    }
    ctx.restore();
  });
}

function drawLooseDirt(){
  const vis = DIRT.filter(r => r.x - ox < VIEW_W + 60 && r.x + r.w - ox > -60 &&
                               r.y - oy < VIEW_H + 60 && r.y + r.h - oy > -60);
  ctx.fillStyle = C.looseEdge;
  vis.forEach(r => { rr(ctx, r.x-ox-PAD-OUT, r.y-oy-PAD-OUT,
                         r.w+(PAD+OUT)*2, r.h+(PAD+OUT)*2, 8+OUT); ctx.fill(); });
  vis.forEach(r => {
    const x = r.x-ox-PAD, y = r.y-oy-PAD, w = r.w+PAD*2, h = r.h+PAD*2;
    ctx.save(); rr(ctx, x, y, w, h, 6); ctx.clip();
    const g = ctx.createLinearGradient(0, y, 0, y+h);
    g.addColorStop(0, C.loose); g.addColorStop(1, C.looseLow);
    ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = C.crack; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    for(let i=0;i<Math.max(4, (r.w*r.h)/700|0); i++){      // crackle, world-anchored
      let cx = r.x + hash(i, r.y)*r.w, cy = r.y + hash(i+53, r.x)*r.h;
      ctx.beginPath(); ctx.moveTo(cx-ox, cy-oy);
      for(let k=0;k<3;k++){
        cx += (hash(i+k, k)-0.5)*16; cy += (hash(i+k+9, k)-0.5)*16;
        ctx.lineTo(cx-ox, cy-oy);
      }
      ctx.stroke();
    }
    ctx.restore();
  });
}

function drawSky(){
  const sy = SURFACE - oy;                               // ground line, in screen space
  const g = ctx.createLinearGradient(0, -oy, 0, sy);
  g.addColorStop(0, C.skyTop); g.addColorStop(1, C.skyLow);
  ctx.fillStyle = g; ctx.fillRect(0, 0, VIEW_W, Math.max(0, sy));

  ctx.fillStyle = 'rgba(255,255,255,.72)';               // clouds
  for(let i=0;i<14;i++){
    const cx = ((i*337 - ox*0.18) % (VIEW_W+420)) - 210;
    const cy = 40 + (i%4)*62 - oy*0.35, s = 20 + (i%3)*10;
    ctx.beginPath();
    ctx.ellipse(cx, cy, s*1.9, s*0.72, 0, 0, 7);
    ctx.ellipse(cx+s*0.9, cy-s*0.34, s*1.1, s*0.66, 0, 0, 7);
    ctx.ellipse(cx-s*1.0, cy-s*0.14, s*0.9, s*0.52, 0, 0, 7);
    ctx.fill();
  }
  [[0.10, C.hillFar, 118], [0.22, C.hill, 74]].forEach(([par, col, amp]) => {
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, sy);
    for(let x=0; x<=VIEW_W; x+=14){
      const wx = x + ox*par;
      ctx.lineTo(x, sy - amp - Math.sin(wx*0.0032)*amp*0.42 - Math.sin(wx*0.0011+2)*amp*0.3);
    }
    ctx.lineTo(VIEW_W, sy); ctx.closePath(); ctx.fill();
  });

  const deep = MAP_H*T;                                   // underground backdrop
  ctx.fillStyle = C.under;
  ctx.fillRect(0, sy, VIEW_W, VIEW_H - sy);
  ctx.save(); ctx.beginPath(); ctx.rect(0, sy, VIEW_W, VIEW_H - sy); ctx.clip();
  ctx.fillStyle = C.underMud;                             // mud spots, pinned to world cells
  const CELL = 210, k0 = Math.floor(ox/CELL)-1, k1 = Math.ceil((ox+VIEW_W)/CELL);
  for(let k=k0;k<=k1;k++) for(let j=0;j<4;j++){
    const bx = k*CELL + hash(k, j)*CELL - ox;
    const by = SURFACE + hash(k+5, j)*(deep-SURFACE) - oy;
    const rad = 9 + hash(k+11, j)*21;
    ctx.beginPath();
    ctx.ellipse(bx, by, rad, rad*(0.55 + hash(k, j+3)*0.5), hash(k,j)*3, 0, 7);
    ctx.fill();
  }
  ctx.restore();
}

// Runs the exact flight model forward from where he is now, assuming you hold the
// cursor where it is, and reports where he'd touch down. He stays level in the air,
// so this marker is the only thing telling you where you're actually going.

// Headlamp. The cone stops at the first solid tile in front of him — and because
// loose dirt isn't solid to a digger, his beam reaches straight through the stuff
// he's about to tunnel into.
function drawLamp(){
  const ch = player.char;
  if(!ch.lamp) return;
  const im = IMG[ch.art];
  if(!(im && im.complete && im.naturalWidth)) return;
  const dh = ch.dh || DOG_H, dw = dh * im.naturalWidth / im.naturalHeight;
  const fx = player.face > 0 ? ch.lamp.x : 1 - ch.lamp.x;
  const wx = player.x + player.w/2 - dw/2 + dw*fx;
  const wy = player.y + player.h - dh + dh*ch.lamp.y;
  const dir = player.face;

  let len = 200;
  const row = Math.floor(wy / T);
  for(let d=12; d<200; d+=8){
    if(solidFor(ch, Math.floor((wx + dir*d)/T), row)){ len = d; break; }
  }
  const lx = wx - ox, ly = wy - oy, spread = 0.30;

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createLinearGradient(lx, ly, lx + dir*len, ly);
  g.addColorStop(0,   'rgba(255,244,190,.50)');
  g.addColorStop(0.45,'rgba(255,236,155,.20)');
  g.addColorStop(1,   'rgba(255,228,130,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(lx, ly);
  ctx.lineTo(lx + dir*len, ly - len*spread);
  ctx.lineTo(lx + dir*len, ly + len*spread);
  ctx.closePath(); ctx.fill();
  const rg = ctx.createRadialGradient(lx, ly, 0, lx, ly, 15);
  rg.addColorStop(0,'rgba(255,251,225,.70)'); rg.addColorStop(1,'rgba(255,240,180,0)');
  ctx.fillStyle = rg;
  ctx.beginPath(); ctx.arc(lx, ly, 15, 0, 7); ctx.fill();
  ctx.restore();
}

let camX = 0, camY = 0, ox = 0, oy = 0;
function draw(){
  const cx = player.x + player.w/2 + player.face*330*player.peri;
  const tx = Math.max(0, Math.min(MAP_W*T - VIEW_W, cx - VIEW_W/2));
  const ty = Math.max(0, Math.min(MAP_H*T - VIEW_H,
                                  player.y + player.h/2 - VIEW_H*0.56));
  camX += (tx - camX)*0.12;
  camY += (ty - camY)*0.09;
  ox = Math.round(camX); oy = Math.round(camY);

  drawSky();
  drawTerrain();
  drawLooseDirt();

  const c0 = Math.max(0, Math.floor(ox/T)-1), c1 = Math.min(MAP_W-1, Math.ceil((ox+VIEW_W)/T));
  const rr0 = Math.max(0, Math.floor(oy/T)-2), rr1 = Math.min(MAP_H-1, Math.ceil((oy+VIEW_H)/T)+1);
  for(let r=rr0;r<=rr1;r++) for(let c=c0;c<=c1;c++){
    const t = grid[r][c], x = c*T-ox, y = r*T-oy;
    if(t==='K'){
      const im = TERRAIN_IMG.kennel;
      if(im && im.complete && im.naturalWidth){
        const kh = KENNEL_H, kw = kh * im.naturalWidth / im.naturalHeight;
        ctx.drawImage(im, x + T/2 - kw/2, y + T - kh, kw, kh);   // stood on the ground
      } else {
        ctx.fillStyle = '#c0392b'; ctx.fillRect(x-6, y-T, T+12, 2*T);
      }
    } else if(t==='R'){
      const d = doorAt(c,r), k = d && d.open ? d.t : 0;
      ctx.fillStyle = d && d.open ? 'rgba(6,214,160,.18)' : '#ff4d6d';
      ctx.fillRect(x+3, y, T-6, T*(1-k*0.86));
      ctx.fillStyle = d && d.open ? '#06d6a0' : '#ffd166';
      ctx.fillRect(x+3, y, T-6, 3);
    } else if(t==='B'){
      if(plasmaOpen){
        ctx.fillStyle = 'rgba(232,140,255,.13)'; ctx.fillRect(x+4,y,T-8,T);
      } else {
        // bright magenta so it never reads as terrain now the rock is purple
        ctx.fillStyle = '#4a2a63'; rr(ctx,x+2,y-1,T-4,T+2,5); ctx.fill();
        ctx.fillStyle = '#e88cff'; rr(ctx,x+5,y,T-10,T,4); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.35)';
        for(let i=0;i<3;i++) ctx.fillRect(x+5, y+6+i*10, T-10, 2);
      }
    } else if(t==='S'){
      const on = plasmaOpen;
      ctx.strokeStyle = on ? '#06d6a0' : '#e88cff'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(x+T/2, y+T/2, 10, 0, 7); ctx.stroke();
      ctx.fillStyle = on ? '#06d6a0' : '#e88cff';
      ctx.beginPath(); ctx.arc(x+T/2, y+T/2, 4.5, 0, 7); ctx.fill();
    } else if(t==='G'){
      ctx.fillStyle = '#06d6a0';
      ctx.fillRect(x+T/2-2, y-T, 4, 2*T);
      ctx.beginPath(); ctx.moveTo(x+T/2+2, y-T); ctx.lineTo(x+T/2+26, y-T+10);
      ctx.lineTo(x+T/2+2, y-T+20); ctx.fill();
    }
  }

  COINS.forEach(c => {
    if(c.got || c.x - ox < -40 || c.x - ox > VIEW_W + 40) return;
    const [fi, flip] = COIN_SEQ[(Math.floor(spin) + c.ph) % COIN_SEQ.length];
    const im = COIN_TIERS[c.tier].img[fi];
    if(!(im.complete && im.naturalWidth)) return;
    const h = COIN_H, w = h * COIN_FACE[fi];
    const bob = Math.sin(spin*0.5 + c.ph)*2.5;
    ctx.save();
    ctx.translate(c.x - ox, c.y + bob - oy);
    if(flip) ctx.scale(-1, 1);
    ctx.drawImage(im, -w/2, -h/2, w, h);
    ctx.restore();
  });

  orbs.forEach(o => {
    const im = TERRAIN_IMG.orb;
    ctx.save();
    ctx.translate(o.x-ox, o.y-oy);
    ctx.fillStyle = 'rgba(232,140,255,.30)';
    ctx.beginPath(); ctx.arc(0, 0, 13, 0, 7); ctx.fill();
    if(im && im.complete && im.naturalWidth){
      const h = ORB_H, w = h * im.naturalWidth / im.naturalHeight;
      if(o.vx < 0) ctx.scale(-1, 1);
      ctx.drawImage(im, -w/2, -h/2, w, h);
    } else {
      ctx.fillStyle = '#f7d5ff';
      ctx.beginPath(); ctx.arc(0, 0, 5, 0, 7); ctx.fill();
    }
    ctx.restore();
  });

  vapor.forEach(p => {
    const k = p.t / p.life;
    ctx.fillStyle = `rgba(255,255,255,${0.5*(1-k)*(1-k)})`;
    ctx.beginPath(); ctx.arc(p.x-ox, p.y-oy, 2.5 + k*9, 0, 7); ctx.fill();
  });

  player.trail.forEach((p, i) => {                 // zoomies afterimages
    ctx.save();
    ctx.globalAlpha = 0.30 * (1 - i/player.trail.length);
    ctx.translate(Math.round(p.x-ox), Math.round(p.y-oy));
    drawDog(ctx, 0, 0, player.char, p.f, player.phase, {moving:true});
    ctx.restore();
  });
  drawLamp();
  ctx.save();
  ctx.translate(Math.round(player.x-ox), Math.round(player.y-oy));
  drawDog(ctx, 0, 0, player.char, player.face, player.phase,
          {gliding:player.gliding, digging:player.digging, peri:player.peri,
           lifting:player.lifting, pitch:player.pitch,
           moving:Math.abs(player.vx) > 5 && player.coyote > 0});
  ctx.restore();

  if(player.digging){
    ctx.fillStyle = 'rgba(180,130,80,.65)';
    for(let i=0;i<5;i++){
      const a = player.phase*2 + i*1.7;
      ctx.fillRect(player.x-ox+player.w/2+Math.cos(a)*13,
                   player.y-oy+player.h*0.6+Math.sin(a)*11, 3,3);
    }
  }
}

// ───────────────────────────────────────────── loop
let last = performance.now();
function frame(now){
  let dt = (now-last)/1000; last = now;
  dt = Math.min(dt, 1/30);
  update(dt); draw();
  requestAnimationFrame(frame);
}
fitCanvas();
drawCardArt();
hudCoins.textContent = coinLabel();
becomeDoggo(byId('barkmc'));
requestAnimationFrame(frame);
window.__bark = { player, grid, CAST, byId, becomeDoggo, doors, orbs, T,
                  get cam(){ return {ox, oy}; },
                  get music(){ let pk = 0;
                    if(musMeter){ const d = new Float32Array(musMeter.fftSize);
                      musMeter.getFloatTimeDomainData(d);
                      for(const v of d) pk = Math.max(pk, Math.abs(v)); }
                    return {track:musTrack, on:musOn, notes:noteCount,
                            state:actx && actx.state, peak:+pk.toFixed(3)}; },
                  get plasmaOpen(){ return plasmaOpen; } };
})();
</script>
