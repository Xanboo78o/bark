<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>B.A.R.K. — kennel swap sandbox</title>
<style>
  :root{
    --bg:#12101a; --panel:#1b1830; --panel2:#241f3d; --line:#332c52;
    --tx:#eae6f4; --mut:#9b93b8; --doggo:#ffd166; --cool:#4cc9f0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
  #stage{position:fixed;inset:0;display:flex;flex-direction:column}
  #wrap{flex:1;position:relative;overflow:hidden}
  canvas#game{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block}

  #hud{position:absolute;left:14px;top:12px;pointer-events:none;z-index:5;
    background:rgba(255,255,255,.80);padding:7px 13px 8px;border-radius:13px}
  #who{font-weight:900;letter-spacing:.12em;font-size:14px;text-transform:uppercase;
    color:#1d3346;text-shadow:0 1px 0 rgba(255,255,255,.45)}
  #move{font-size:12.5px;color:#3f5b70;margin-top:2px;text-shadow:0 1px 0 rgba(255,255,255,.4)}
  #coins{font-size:12px;font-weight:800;color:#7a6a3c;margin-top:4px;letter-spacing:.06em}
  #biome{font-size:11px;color:#6d7f8e;margin-top:2px;letter-spacing:.14em;text-transform:uppercase}
  #tip{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;z-index:5;
    font-size:13px;color:var(--mut);text-align:center;pointer-events:none;
    background:rgba(18,16,26,.72);padding:6px 14px;border-radius:99px;border:1px solid var(--line)}
  #tip.hot{color:var(--cool);border-color:var(--cool)}
  #banner{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);z-index:6;
    font-weight:900;font-size:34px;letter-spacing:-.02em;color:#06d6a0;opacity:0;
    transition:opacity .3s;pointer-events:none;text-align:center}
  #banner.on{opacity:1}

  #toast{position:absolute;inset:0;z-index:7;display:flex;align-items:center;
    justify-content:center;pointer-events:none;opacity:0}
  /* Doggo Battles lettering: white caps, wide tracking, gold outline, no tilt */
  #toast span{
    font-family:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
    font-weight:900;font-size:clamp(46px,12vw,124px);letter-spacing:.14em;
    text-indent:.14em;color:#fff;
    -webkit-text-stroke:6px #e8a704;paint-order:stroke fill;
    text-shadow:0 6px 0 rgba(120,72,0,.55), 0 0 40px rgba(255,206,92,.6);
    transform:scale(2.4)}
  #toast.go{animation:toastFade 1.35s linear forwards}
  #toast.go span{animation:toastSmash 1.35s linear forwards}
  @keyframes toastFade{0%{opacity:0}5%{opacity:1}68%{opacity:1}100%{opacity:0}}
  /* slams in over ~90ms, overshoots, settles, then drifts out */
  @keyframes toastSmash{
    0%{transform:scale(2.4)}
    7%{transform:scale(.84)}
    13%{transform:scale(1.14)}
    19%{transform:scale(.96)}
    25%{transform:scale(1.03)}
    31%{transform:scale(1)}
    100%{transform:scale(1.07)}}

  #roster{position:absolute;inset:0;z-index:20;display:none;
    background:rgba(10,8,18,.9);backdrop-filter:blur(3px);
    align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:16px}
  #roster.on{display:flex}
  #roster h2{margin:0;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--cool)}
  #cards{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;
    max-width:1000px;max-height:66vh;overflow-y:auto;padding:4px}
  .card{width:114px;background:var(--panel);border:2px solid var(--line);border-radius:13px;
    padding:8px 7px;text-align:center;cursor:pointer;transition:border-color .12s,transform .12s}
  .card.sel{border-color:var(--doggo);transform:translateY(-3px)}
  .card.lock{opacity:.45}
  .card canvas{display:block;margin:0 auto 4px;background:var(--panel2);border-radius:8px}
  .card b{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;line-height:1.25}
  .card .stat{font-size:10px;color:var(--cool);margin-top:3px;letter-spacing:.04em}
  .card .abil{display:block;font-size:10.5px;color:var(--tx);margin-top:3px;line-height:1.3}
  .card .note{display:block;font-size:9.5px;color:var(--mut);margin-top:3px;line-height:1.3}
  #rhint{font-size:12px;color:var(--mut)}

  #pad{display:none;gap:8px;padding:10px 12px 14px;background:var(--panel);border-top:1px solid var(--line)}
  #pad button{flex:1;background:var(--panel2);color:var(--tx);border:1px solid var(--line);
    border-radius:12px;padding:16px 0;font-size:17px;font-weight:800;touch-action:none}
  #pad button:active{background:var(--line)}
  body.touch #pad{display:flex}

  /* one game: every screen can get back to the front door */
  #nav{position:fixed;left:14px;bottom:14px;z-index:30;font:700 11px/1 ui-sans-serif,system-ui,sans-serif;
    letter-spacing:.18em;text-transform:uppercase;text-decoration:none;color:#9b93b8;
    background:rgba(18,16,26,.82);border:1px solid #332c52;padding:9px 14px;border-radius:99px}
  #nav:hover{color:#ffd166;border-color:#ffd166}
</style>
</head>
<body>
<a id="nav" href="index.html">◀ Menu</a>
<div id="stage">
  <div id="wrap">
    <canvas id="game"></canvas>
    <div id="hud"><div id="who"></div><div id="move"></div>
      <div id="coins">0 / 9 coins</div><div id="biome">grass</div></div>
    <div id="tip"></div>
    <div id="banner">SANDBOX CLEAR</div>
    <div id="toast"><span>ZOOMIES</span></div>
    <div id="roster">
      <h2>Kennel — pick who goes out</h2>
      <div id="cards"></div>
      <div id="rhint">← → ↑ ↓ to browse · Enter to take them · Esc to cancel</div>
    </div>
  </div>
  <div id="pad">
    <button data-k="left">←</button>
    <button data-k="right">→</button>
    <button data-k="up">↑</button>
    <button data-k="use">E</button>
    <button data-k="jump">JUMP</button>
  </div>
</div>
<script>
(() => {
'use strict';

// ───────────────────────────────────────────── config
const T = 32;
const VIEW_W = 672, VIEW_H = 448;   // 21 x 14 tiles — zoomed in, so the camera pans vertically too

const GRAV      = 1800;
const MAX_FALL  = 900;
const RUN       = 215;
const ACCEL     = 2000;
const FRICTION  = 2400;
const JUMP_V    = -565;
const COYOTE    = 0.09;
const BUFFER    = 0.10;
const GLIDE_FALL= 50;
const GLIDE_RUN = 255;
// He flies whichever way he's already pointed — the mouse doesn't steer him. What
// it does is hold him up: cursor above his waist and he strains for it, spending a
// two-second reserve before the sag sets in. The sag is exponential, so a flight
// ends the way a paper plane does — level, level, level, gone. He never climbs,
// which is what keeps him off Alien's wall and Billie's wall.
const PLANE_RUN   = 335;
const PLANE_SINK0 = 30;     // px/s at the start of a glide
const PLANE_TAU   = 0.9;    // sink doubles about every 0.6s once the reserve is out
const PLANE_LIFT  = 2.0;    // seconds of "trying", refilled on landing
// Near-zero, not merely slow: at 30px/s he spent his whole altitude budget while
// straining and the reserve only bought about one extra second instead of two.
const PLANE_HOLD  = 4;
const PLANE_DIVE  = 720;    // cursor fully below him — nose down, and he drops
// The cursor is a STICK, not three buttons. PLANE_RANGE is how far it has to
// travel from his waist for full authority; everything between is a real value,
// so nothing snaps. PLANE_EASE is how fast the nose follows the stick.
const PLANE_RANGE = 120;
const PLANE_DEAD  = 0.12;   // soft deadzone, as a fraction of the range
const PLANE_EASE  = 7;
const DIG_SPEED = 135;
const ORB_SPEED = 430;
// ZOOMIES. Jump height goes with the SQUARE of takeoff speed, so 1.75x is already
// 3x the height — 8 tiles, where Alien's big jump only manages 4.7.
const ZOOM_TIME  = 45;
const ZOOM_SPEED = 1.9;
const ZOOM_JUMP  = 1.75;
// Small horizontal kick on purpose: a big shove would mean you can only wall-jump
// inside a shaft with two facing walls, and there aren't any. This way holding
// toward the wall re-contacts it, so a single face can be climbed.
const WALL_KICK  = 0.55;
const WALL_GRACE = 0.12;

// ───────────────────────────────────────────── the roster
// Stats and abilities are lifted straight from the Doggo Battles wiki — ANormalName1's
// canon, in menu order. `art` is set only where Adam has drawn something; everything
// else is a placeholder vector doggo wearing a hat until his real art lands.
// Drawn height per doggo, tuned so their BODIES match rather than their pictures.
// Two earlier attempts both failed: scaling by image height shrank whoever wore a
// hat, and scaling by nose-to-tail length made bodies equal on paper but not to the
// eye. These numbers come from the area of each drawing's lower body — the part no
// hat, crown or antenna touches — so a taller `dh` here means more of the picture is
// headgear, not that the dog is bigger. Verified by lining them all up side by side.
const DOG_H = 44;

const CAST = [
  // you. Xanboo78o's doggo, still wearing the collar he tore off.
  { id:'barkmc', name:'BARKmc', col:'#f5a623', w:26, h:34, tag:'ADAM',
    art:'BARKmc', bw:260, move:'chip',
    atk:'?', spd:'?', ability:'Stolen chip — robo doors open for you',
    note:'you · the one that got away' },
  { id:'dalmatian', name:'Dalmatian Doggo', col:'#e9e9ee', hat:'spots', w:26, h:34, tag:'DB',
    art:'Dalmatian-Doggo', bw:260,
    atk:'Normal', spd:'Normal', ability:'None', note:'#2 · runs a shop' },
  { id:'cowboy', name:'Cowboy Doggo', col:'#c98a4b', hat:'cowboy', w:26, h:34, tag:'DB',
    art:'Cowboy-Doggo', dh:50, bw:201,
    atk:'High', spd:'Normal', ability:'Extra damage', note:'#3' },
  { id:'knight', name:'Knight Doggo', col:'#9aa4b8', hat:'helm', w:26, h:34, tag:'DB',
    art:'Knight-Doggo', dh:46, bw:219, speedMul:0.62,
    atk:'High', spd:'Slow', ability:'More damage, less speed',
    note:'#4 · from Doggo Quest, year 1300' },
  { id:'alien', name:'Alien Doggo', col:'#7ee081', hat:'antenna', w:26, h:34, tag:'DB',
    art:'Alien-Doggo', dh:51, bw:199, jumpMul:1.3, move:'jump',
    atk:'Normal', spd:'Normal', ability:'Jump higher', note:'#5' },
  { id:'king', name:'King Doggo', col:'#ffd166', hat:'crown', w:26, h:34, tag:'DB',
    art:'King-Doggo', bw:203, dh:54, speedMul:1.2, jumpMul:1.05,
    atk:'High', spd:'High', ability:'Enhanced stats', note:'#6' },
  { id:'zombie', name:'Zombie Doggo', col:'#8fb06a', hat:'none', w:26, h:34, tag:'DB',
    art:'Zombie-Doggo', bw:258,
    atk:'Normal', spd:'Normal', ability:'Steal health', note:'#7' },
  { id:'cool', name:'Cool Doggo', col:'#4cc9f0', hat:'shades', w:26, h:34, tag:'DB',
    art:'Cool-Doggo', dh:43, bw:269, speedMul:1.4, move:'speed',

    atk:'Normal', spd:'High', ability:'Speed', note:'#8' },
  { id:'toxic', name:'Toxic Doggo', col:'#a3f542', hat:'none', w:26, h:34, tag:'DB',
    art:'Toxic-Doggo', bw:260,
    atk:'Normal', spd:'Normal', ability:'Poisons enemy',

  { id:'plasma', name:'Plasma Doggo', col:'#8f7bf5', hat:'none', w:26, h:34, tag:'DB',
    art:'Plasma-Doggo', bw:260, move:'plasma',
    atk:'Non-melee', spd:'Normal', ability:'Shoots plasma orbs',
    note:'shop doggo · he became Qorvex' },
  { id:'qorvex', name:'Qorvex', col:'#5b4a8a', w:26, h:34, tag:'DB', locked:true,
    art:'Qorvex', art2:'Qorvex-glitch', bw:261,
    atk:'???', spd:'???', ability:'???', note:'was on the team. then the basement.' },

  { id:'billie', name:'Billie', col:'#ff7fbf', w:26, h:34, tag:'ADAM',
    art:'Billie', bw:194, move:'zoom',

  { id:'nano', name:'Nano Doggo', col:'#f6a623', w:26, h:34, tag:'ADAM',

    dh:44, move:'size',
    atk:'?', spd:'?', ability:'Shrink ↓ · Expand ↑', note:'yours' },

  { id:'plane', name:'Airplane Doggo', col:'#f5a623', w:26, h:34, tag:'ADAM',
    art:'Airplane-Doggo', bw:261, move:'glide',
    atk:'?', spd:'?', ability:'Hold jump — thrust, then glide', note:'yours' },
  { id:'digger', name:'Miner Doggo', col:'#f4845f', w:26, h:34, tag:'ADAM',
    art:'Miner-Doggo', bw:223, dh:48, move:'dig',
    lamp:{ x:0.66, y:0.18 },          // where the helmet lamp sits in his drawing
    atk:'?', spd:'?', ability:'Digs loose dirt · headlamp', note:'yours' },
];
// ── UNLOCK ORDER. The island hands you one doggo at a time, at the point where

// wall kick -- walks over every height gate on the floor, so the whole tutorial
// collapses into "be Billie". She's the LAST thing you get, by which point
// there's nothing left for her to trivialise. maxX only ever grows, so heading
// back left along the top keeps everything you earned on the way out.
const UNLOCK = { barkmc:0, dalmatian:0, nano:0,
                 alien:36, knight:55, cool:90, plane:130,
                 cowboy:165, king:175, zombie:185, toxic:195,
                 billie:205, plasma:215, digger:225 };
CAST.forEach(c => c.needX = UNLOCK[c.id] ?? 0);
let maxX = 0;
const held_ = c => !c.locked && maxX >= c.needX;

const byId = id => CAST.find(c => c.id === id);

const IMG = {};
CAST.forEach(c => [c.art, c.art2, c.artBig, c.artSmall].filter(Boolean).forEach(n => {
  if(IMG[n]) return;
  const im = new Image();
  im.onload = () => drawCardArt();
  im.src = 'doggos/' + n + '.png';
  IMG[n] = im;
}));

// Three tiers, four spin frames each: silver 1, green 2, red 5.
const COIN_TIERS = [
  { pre:1, value:1, rate:1.00 },
  { pre:2, value:2, rate:1.18 },
  { pre:3, value:5, rate:1.42 },
];
COIN_TIERS.forEach(t => {
  t.img = [1,2,3,4].map(n => {
    const im = new Image(); im.src = `doggos/coin${t.pre}${n}.png`; return im;
  });
});
// A real spin is 360° and four frames only cover 90°, so run them out and back,
// flipping horizontally after each edge-on step — that's where a coin's visible face
// actually swaps. [frame, flipped, width multiplier].
//
// All four of Adam's frames are used. His edge frame is a 23px sliver, which is
// three pixels at game scale, so it gets widened — enough to have thickness, not
// so much that its straight sides read as a blocky bar.
// Silhouette widths land on 27 / 22 / 14 / 8.
// [frame, flipped]. Width comes from COIN_FACE below, not from the drawing —
// each tier's frames are drawn at slightly different widths, and a per-frame
// multiplier tuned to one tier made the others bulge at the edge-on frame, which
// looked like the coin changing size mid-spin.
const COIN_SEQ = [
  [0,0], [1,0], [2,0], [3,0], [2,1], [1,1],
  [0,1], [1,1], [2,1], [3,1], [2,0], [1,0],
];
// silhouette width as a fraction of the coin's diameter, roughly cos(angle)
const COIN_FACE = [1.00, 0.78, 0.42, 0.22];
const COIN_H = 27;

// Adam's five biome sheets. Each is a ground strip plus a set of floating-platform
// blobs; every colour below was sampled out of his own art.
const BASE_C = {
  stone:'#a3a9b6', stoneLow:'#848b9a', stoneEdge:'#6a7180',
  loose:'#b07c48', looseLow:'#8d6136', looseEdge:'#6f4c2a', crack:'#5e3f22',
};
const BIOMES = {
  grass: { plats:5, stripH:92, C:{
    skyTop:'#5bb4e8', skyLow:'#b9e4f7', hill:'#93c584', hillFar:'#b2d9ac',
    earth:'#48200e', earthLow:'#3a170a', earthEdge:'#2a1006',
    under:'#331509', underMud:'#250e05', grass:'#1c9336', grassEdge:'#14561f' } },
  rock: { plats:7, stripH:30, C:{
    skyTop:'#7d8fa8', skyLow:'#c8d4e0', hill:'#8a8f99', hillFar:'#adb4bd',
    earth:'#717171', earthLow:'#5a5a5a', earthEdge:'#414141',
    under:'#3a3a3a', underMud:'#2c2c2c', grass:'#5f5f5f', grassEdge:'#3d3d3d' } },
  wildfire: { plats:6, elbows:[1], stripH:30, C:{
    skyTop:'#c96a2e', skyLow:'#f0c27a', hill:'#6b5b3a', hillFar:'#8a7a55',
    earth:'#276425', earthLow:'#1c4a1b', earthEdge:'#123310',
    under:'#1a3318', underMud:'#12240f', grass:'#2a2710', grassEdge:'#1a1809' } },
  water: { plats:5, noRotate:true, stripH:30, C:{
    skyTop:'#123a5c', skyLow:'#2b7ba0', hill:'#1a4a63', hillFar:'#2a6a85',
    earth:'#224668', earthLow:'#1a3550', earthEdge:'#12253a',
    under:'#132a41', underMud:'#0d1e30', grass:'#19264e', grassEdge:'#101a36' } },
  city: { plats:5, stripH:56, C:{
    skyTop:'#8fa3b8', skyLow:'#cdd8e2', hill:'#5d5754', hillFar:'#7a7370',
    earth:'#524a46', earthLow:'#423b38', earthEdge:'#332d2b',
    under:'#2e2826', underMud:'#221d1b', grass:'#5d5754', grassEdge:'#3d3835' } },
};
const BIOME_NAMES = Object.keys(BIOMES);
const TERRAIN_IMG = {};
BIOME_NAMES.forEach(k => {
  const load = n => { const im = new Image(); im.src = 'doggos/'+n+'.png'; TERRAIN_IMG[n] = im; };
  load(k + '-ground');
  for(let i=1;i<=BIOMES[k].plats;i++) load(k + '-plat' + i);
});
// ── Adam's shapes as POLYGONS, traced from his Scratch SVG export by svgcut.py.
// Deliberately not bitmaps: an outline baked into a PNG scales with the sprite,
// so it goes thin on small pieces and uneven on stretched ones and can never
// hold the heavy constant weight his style calls for. Points are normalised
// into each piece's own box; the game fits them to a rect, fills, and strokes
// LAST at exactly OUT px, which is uniform at any size, stretch or rotation.
// His costumes come out at game scale already — 1 tile = 32 SVG units.
// Inlined rather than fetched because fetch is blocked on file://.
const PIECES = {

// NOTHING IS EVER STRETCHED (Adam's rule). One uniform scale for both axes, so
// his shapes keep their proportions exactly as drawn; a rect that's taller than
// it is wide gets a slab TURNED ON ITS SIDE, never a squashed one. Because the
// scale is uniform, dividing the line width by it puts the stroke at exactly
// OUT screen px whatever size the piece ends up.
function trace(pts, W, H){
  ctx.beginPath();
  ctx.moveTo((pts[0][0]-0.5)*W, (pts[0][1]-0.5)*H);
  for(let i = 1; i < pts.length; i++) ctx.lineTo((pts[i][0]-0.5)*W, (pts[i][1]-0.5)*H);
}

function drawPoly(p, x, y, w, h, rot){
  const pw = rot ? p.h : p.w, ph = rot ? p.w : p.h;
  const s  = Math.max(w / pw, h / ph);      // cover the rect, same scale both ways
  ctx.save();
  ctx.translate(x + w/2, y + h/2);
  if(rot) ctx.rotate(Math.PI/2);
  ctx.scale(s, s);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';

  // A PROP carries the outline he drew, at the width he drew it, painted the way
  // SVG paints: fill, then a centred stroke. TERRAIN has no outline of its own and
  // gets the heavy constant one — stroked at double width with the fill over its
  // inner half, so the whole OUT px reads outside. Adding the terrain treatment to
  // a prop spills 10px past its box and makes everything overlap everything.
  const own = p.sw > 0;
  trace(p.pts, p.w, p.h); ctx.closePath();
  if(!own){ ctx.strokeStyle = p.edge; ctx.lineWidth = (OUT * 2) / s; ctx.stroke(); }
  const g = ctx.createLinearGradient(0, -p.h/2, 0, p.h/2);
  g.addColorStop(0, p.fill); g.addColorStop(1, p.fillLow);
  ctx.fillStyle = g; ctx.fill();
  if(own && p.edge !== 'none'){
    ctx.strokeStyle = p.edge; ctx.lineWidth = p.sw; ctx.stroke();
  }

  // Whatever he drew on this piece — rock's cracks and # marks, wildfire's ash,
  // underwater's seaweed and bubbles. Held in the piece's own coordinates, and
  // deliberately allowed outside 0..1: that's how seaweed stands proud of the
  // platform instead of being squashed down into it.
  for(const d of p.on){
    trace(d.p, p.w, p.h);
    if(d.f !== 'none'){ ctx.closePath(); ctx.fillStyle = d.f; ctx.fill(); }
    if(d.e !== 'none'){
      ctx.strokeStyle = d.e;
      ctx.lineWidth = d.sw > 0 ? d.sw : (OUT / 2) / s;   // his width where he set one
      ctx.stroke();
    }
  }
  ctx.restore();
}

// Sort Adam's blobs into wide pieces (platforms) and tall ones (pillars) by the
// aspect of the drawing itself — handing a wide rect a tall sprite squashes his
// art flat. Elbows are corner pieces, listed by hand in BIOMES and never
// auto-filled; auto-detection can't tell an elbow from a chunky blob, and it
// mistook every seaweed-topped water platform for one.
const POOLS = {};
function pools(b){
  const cached = POOLS[b];
  if(cached && cached.ready) return cached;
  const skip = BIOMES[b].elbows || [];
  const p = { wide:[], tall:[], elbow:[], ready:true };
  for(let i = 1; i <= BIOMES[b].plats; i++){
    const im = TERRAIN_IMG[b + '-plat' + i];
    if(!im || !im.complete || !im.naturalWidth){ p.ready = false; continue; }
    (skip.includes(i) ? p.elbow
      : im.naturalWidth >= im.naturalHeight ? p.wide : p.tall).push(im);
  }
  POOLS[b] = p;
  return p;
}

// Slice fraction taken off each end as an undistorted cap. His blobs are drawn
// as a rounded end, a flat run, then a rounded end — so scaling the whole sprite
// to the rect is what wrecks them. Caps keep their shape, the middle takes up
// the slack, and a piece fits any length without deforming.
const PIECE_CAP = 0.22;

function slice9(im, x, y, w, h, vertical){
  const sw = im.naturalWidth, sh = im.naturalHeight;
  if(vertical){
    const capS = sh * PIECE_CAP, capD = Math.min(capS * (w / sw), h / 2);
    if(capD < 1 || h - capD*2 < 1) return ctx.drawImage(im, x, y, w, h);
    ctx.drawImage(im, 0, 0,          sw, capS,          x, y,          w, capD);
    ctx.drawImage(im, 0, capS,       sw, sh - capS*2,   x, y + capD,   w, h - capD*2);
    ctx.drawImage(im, 0, sh - capS,  sw, capS,          x, y + h-capD, w, capD);
  } else {
    const capS = sw * PIECE_CAP, capD = Math.min(capS * (h / sh), w / 2);
    if(capD < 1 || w - capD*2 < 1) return ctx.drawImage(im, x, y, w, h);
    ctx.drawImage(im, 0, 0,          capS, sh,          x, y,          capD, h);
    ctx.drawImage(im, capS, 0,       sw - capS*2, sh,   x + capD, y,   w - capD*2, h);
    ctx.drawImage(im, sw - capS, 0,  capS, sh,          x + w-capD, y, capD, h);
  }
}

// Draw one of his blobs into a rect. Picks whichever piece in the pool is
// closest in shape to the rect, so the middle has the least stretching to do.
// A biome with no pillar art borrows a wide piece turned 90°, unless its art is
// directional — water's seaweed grows upward and must never be laid on its side.
function drawPiece(r){
  // polygons win wherever they exist — they're the only way the outline stays put
  const poly = PIECES[biome];
  if(poly && poly.length){
    // Every piece is available in either orientation — a slab turned on its end is
    // just as valid a pillar as one drawn that way. Try both ways up for all of
    // them and take whichever shape fits the rect closest.
    const target = r.w / r.h;
    let best = poly[0], bestRot = false, bd = Infinity;
    for(const c of poly) for(const rot of [false, true]){
      const d = Math.abs(Math.log(((rot ? c.h : c.w) / (rot ? c.w : c.h)) / target));
      if(d < bd){ bd = d; best = c; bestRot = rot; }
    }
    drawPoly(best, r.x-ox, r.y-oy, r.w, r.h, bestRot);
    return true;
  }

  const p = pools(biome), want = r.pillar ? 'tall' : 'wide';
  let list = p[want], rot = false;
  if(!list.length){
    if(BIOMES[biome].noRotate) return false;
    list = p[r.pillar ? 'wide' : 'tall'];
    rot  = list.length > 0;
  }
  if(!list.length) return false;

  const x = r.x-ox-7, y = r.y-oy-6, w = r.w+14, h = r.h+13;
  // the art's long axis ends up across the rect's long axis once rotated
  const target = rot ? h / w : w / h;
  let im = list[0], best = Infinity;
  list.forEach(c => {
    const d = Math.abs(Math.log((c.naturalWidth / c.naturalHeight) / target));
    if(d < best){ best = d; im = c; }
  });

  if(rot){
    ctx.save();
    ctx.translate(x + w/2, y + h/2);
    ctx.rotate(Math.PI/2);
    slice9(im, -h/2, -w/2, h, w, false);   // rect's sides swap inside the rotated frame
    ctx.restore();
  } else slice9(im, x, y, w, h, r.pillar);
  return true;
}

// into the dig fork -- and the pocket branch pays the best on the island
[[86,90],[84,96],[82,100]].forEach(([c,r]) => coin(c, r, 0));
[[70,106],[64,106],[50,120],[44,120],[34,142]].forEach(([c,r]) => coin(c, r, 1));
coin(32, 142, 2);
[[78,120],[78,132],[70,146],[62,158],[48,174]].forEach(([c,r]) => coin(c, r, 1));

const COIN_TOTAL = COINS.reduce((a,c) => a + COIN_TIERS[c.tier].value, 0);
let coinsGot = 0, coinValue = 0;
const coinLabel = () => `${coinsGot}/${COINS.length} found · ${coinValue} coins`;

const doors = [];
for(let c=0;c<MAP_W;c++){
  let run = null;
  for(let r=0;r<MAP_H;r++){
    if(grid[r][c]==='R'){ if(!run){ run={c,r0:r,r1:r,open:false}; doors.push(run);} else run.r1=r; }
    else run = null;
  }
}
const doorAt = (c,r) => doors.find(d => d.c===c && r>=d.r0 && r<=d.r1);
let plasmaOpen = false;

// Terrain is a tile grid for collision but must not LOOK like one. Merge runs of
// tiles into as few big rectangles as possible, then draw those as one rounded
// mass — Doggo Battles' chunky slabs, no grid seams.
function mergeRects(pred){
  const used = Array.from({length:MAP_H}, () => new Array(MAP_W).fill(false));
  const out = [];
  for(let r=0;r<MAP_H;r++) for(let c=0;c<MAP_W;c++){
    if(used[r][c] || !pred(c,r)) continue;
    let w = 1;
    while(c+w < MAP_W && pred(c+w,r) && !used[r][c+w]) w++;
    let h = 1;
    grow: while(r+h < MAP_H){
      for(let i=0;i<w;i++) if(!pred(c+i, r+h) || used[r+h][c+i]) break grow;
      h++;
    }
    for(let rr=r;rr<r+h;rr++) for(let cc=c;cc<c+w;cc++) used[rr][cc] = true;
    out.push({x:c*T, y:r*T, w:w*T, h:h*T});
  }
  return out;
}
const ROCK = mergeRects((c,r) => grid[r][c]==='#');
const DIRT = mergeRects((c,r) => grid[r][c]==='d');
const SURFACE = GROUND_ROW*T;            // everything below this line is underground

// anything standing PROUD of the ground line is a stone wall; anything sitting at
// the ground line is earth with a grass cap; anything below it is buried earth.
// (shape is the wrong test — the ground slab is 6 tiles deep, so short stretches
// of it are taller than they are wide and were coming out as walls.)
ROCK.forEach(r => {
  const floating = r.y < SURFACE;
  r.platform = floating && r.h <= 2*T && r.w <= 4*T;              // small and floating
  r.pillar   = floating && !r.platform && r.w <= 2*T && r.h <= 8*T; // narrow and tall
  // pillars stay `stone` as well, so that if their art hasn't decoded yet the
  // procedural fallback still paints them grey rather than earth-brown
  r.stone    = floating && !r.platform;
  r.grass    = r.y === SURFACE;
});

// ───────────────────────────────────────────── player
const player = {
  char: byId('barkmc'), x: 8*T, y: (GROUND_ROW-3)*T-36, w:28, h:36,
  vx:0, vy:0, onGround:false, face:1, phase:0, coyote:0, buffer:0,
  gliding:false, digging:false, peri:0,
  zoom:0, wall:0, wallCoyote:0, trail:[],
  thrusting:false, lifting:false, flightT:0, lift:PLANE_LIFT,
  stepPhase:0, digT:0, wasGround:true, pitch:0
};
const vapor = [];        // wingtip condensation
const orbs = [];

function solidFor(ch, c, r){
  if(c<0||c>=MAP_W||r<0||r>=MAP_H) return true;
  const t = grid[r][c];
  if(t==='#') return true;
  if(t==='d') return ch.move !== 'dig';
  if(t==='B') return !plasmaOpen;
  if(t==='R'){ const d = doorAt(c,r); return !(d && d.open); }
  if(t==='^') return false;              // spikes kill, they don't block
  return !!crateAt(c, r);          // crates are solid to everything, including each other
}
const isDirt = (c,r) => c>=0&&c<MAP_W&&r>=0&&r<MAP_H && grid[r][c]==='d';

function box(p){
  return { c0:Math.floor(p.x/T), c1:Math.floor((p.x+p.w-1)/T),
           r0:Math.floor(p.y/T), r1:Math.floor((p.y+p.h-1)/T) };
}
function overlapsDirt(p){
  const {c0,c1,r0,r1} = box(p);
  for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++) if(isDirt(c,r)) return true;
  return false;
}
function collide(axis){
  const {c0,c1,r0,r1} = box(player);
  for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++){
    if(!solidFor(player.char,c,r)) continue;
    if(axis==='x'){
      if(player.vx>0){ player.x = c*T - player.w; player.wall = 1; player.wallCoyote = WALL_GRACE; }
      else if(player.vx<0){ player.x = (c+1)*T; player.wall = -1; player.wallCoyote = WALL_GRACE; }
      player.vx = 0;
    } else {
      if(player.vy>0){ player.y = r*T - player.h; player.vy=0; player.onGround=true; }
      else if(player.vy<0){ player.y = (r+1)*T; player.vy=0; }
    }
  }
}
function blocked(ch,x,y,w,h){
  const c0=Math.floor(x/T), c1=Math.floor((x+w-1)/T);
  const r0=Math.floor(y/T), r1=Math.floor((y+h-1)/T);
  for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++) if(solidFor(ch,c,r)) return true;
  return false;
}

// ───────────────────────────────────────────── darkness
// The dig fork is lightless. Everyone can walk into it; only Miner can see, and
// only in the cone his headlamp throws. Being able to ENTER blind is the point —
// you feel the wall, back out, and work out who to bring.
function inDark(px, py){
  for(const [x,y,w,h] of DARK)
    if(px >= x*T && px < (x+w)*T && py >= y*T && py < (y+h)*T) return true;
  return false;
}
function drawDark(){
  const lit = player.char.move === 'dig';
  let any = false;
  for(const [x,y,w,h] of DARK){
    const sx = x*T-ox, sy = y*T-oy;
    if(sx > VIEW_W || sy > VIEW_H || sx+w*T < 0 || sy+h*T < 0) continue;
    any = true;
    ctx.fillStyle = '#000'; ctx.fillRect(sx, sy, w*T, h*T);
  }
  if(!any || !lit) return;
  // punch the headlamp cone back out of the black
  const hx = player.x + player.w/2 - ox, hy = player.y + 10 - oy;
  const g = ctx.createRadialGradient(hx, hy, 8, hx, hy, 190);
  g.addColorStop(0, 'rgba(255,240,200,.95)');
  g.addColorStop(0.55, 'rgba(255,235,180,.35)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(hx, hy);
  const a = player.face > 0 ? 0 : Math.PI;
  ctx.arc(hx, hy, 190, a - 0.62, a + 0.62); ctx.closePath(); ctx.fill();
  ctx.restore();
}

// ───────────────────────────────────────────── spikes
// A pit you can't climb out of has to kill you, or it's just a trap. Respawn is
// the LAST KENNEL you touched, so the cost is the walk back and nothing else.
let checkX = 8*T, checkY = 0;
function spiked(){
  const c0=Math.floor((player.x+4)/T), c1=Math.floor((player.x+player.w-5)/T);
  const r0=Math.floor((player.y+4)/T), r1=Math.floor((player.y+player.h-3)/T);
  for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++)
    if(c>=0&&c<MAP_W&&r>=0&&r<MAP_H&&grid[r][c]==='^') return true;
  return false;
}
function respawn(){
  player.x = checkX; player.y = checkY;
  player.vx = player.vy = 0; player.zoom = 0; player.flightT = 0; player.lift = 0;
  snd('pop');
}

// ───────────────────────────────────────────── crates
// Grid-snapped, but they fall. A crate always comes to rest on whole tiles, so a
// puzzle built around one stays built; it just also drops, stacks and can be
// dropped onto things. (Fully loose physics would let Billie's zoomies fire one
// straight through the solution.)
const CRATE_SLIDE = 0.09;   // seconds of visual catch-up after a shove
const CRATE_FALL  = 0.07;   // seconds per tile of fall
const PUSH_GAP    = 0.16;   // seconds between shoves, so one press = one tile

const CRATES = [];
// one tile — a crate should read as doggo-sized, not tower over him
function addCrate(c, r, kind, tw, th){
  CRATES.push({ c, r, kind, tw: tw||1, th: th||1, ox:0, oy:0, fallT:0, pushT:0 });
}
function crateAt(c, r, skip){
  for(const k of CRATES){
    if(k === skip || k === carried) continue;    // what you're holding isn't terrain
    if(c >= k.c && c < k.c + k.tw && r >= k.r && r < k.r + k.th) return k;
  }
  return null;
}
// can this crate occupy (c,r) as its top-left corner?
function crateFits(k, c, r){
  for(let i = 0; i < k.tw; i++) for(let j = 0; j < k.th; j++){
    const cc = c+i, rr = r+j;
    if(cc < 0 || cc >= MAP_W || rr < 0 || rr >= MAP_H) return false;
    const t = grid[rr][cc];
    if(t === '#' || t === 'd') return false;
    if(t === 'B' && !plasmaOpen) return false;
    if(t === 'R'){ const d = doorAt(cc,rr); if(!(d && d.open)) return false; }
    if(crateAt(cc, rr, k)) return false;
  }
  return true;
}

// Heavy blocks are the Knight/King lock: everyone else just bounces off them.
const canShove = (ch, k) => k.kind !== 'heavy' || ch.id === 'knight' || ch.id === 'king';

function pushCrates(dt){
  const dir = R() ? 1 : L() ? -1 : 0;
  if(carried){
    // on his BACK, not over his head: sat behind the shoulder and riding low
    carried.c = Math.floor((player.x + player.w/2)/T);
    carried.r = Math.floor(player.y/T);
    carried.ox = -player.face * 9;
    carried.oy = -18;
  }
  for(const k of CRATES){
    if(k === carried) continue;
    k.pushT = Math.max(0, k.pushT - dt);
    k.ox += (0 - k.ox) * Math.min(1, dt / CRATE_SLIDE);
    k.oy += (0 - k.oy) * Math.min(1, dt / CRATE_SLIDE);

    // fall one tile at a time
    k.fallT += dt;
    if(k.fallT >= CRATE_FALL){
      k.fallT = 0;
      if(crateFits(k, k.c, k.r + 1)){ k.r++; k.oy -= T; }
    }
  }
  if(!dir || !player.onGround) return;

  // the crate you're leaning on: the one your body overlaps just ahead of you
  const nx = player.x + (dir > 0 ? player.w + 1 : -1);
  const r0 = Math.floor(player.y / T), r1 = Math.floor((player.y + player.h - 1) / T);
  for(let r = r0; r <= r1; r++){
    const k = crateAt(Math.floor(nx / T), r);
    if(!k || k.pushT > 0) continue;
    if(!canShove(player.char, k)){ k.ox = dir * 2; continue; }   // a nudge, no give
    if(crateFits(k, k.c + dir, k.r)){
      k.c += dir; k.ox -= dir * T; k.pushT = PUSH_GAP;
      snd('pop');
    }
    return;
  }
}

// first crates, out on the opening flat so the verb teaches itself
// sit each crate ON the wavy floor at its own column, rather than at a fixed row
const floorAt = c => GROUND_ROW + WAVE[(((c-4)/8)|0) % WAVE.length];
const onFloor = (c, kind) => addCrate(c, floorAt(c) - 1, kind);
onFloor(30, 'crate');
onFloor(38, 'crate');
onFloor(64, 'heavy');               // Knight/King only, by his button
onFloor(90, 'crackedCrate');

let carried = null;
function toggleCarry(){
  if(carried){                                   // set it down in front of you
    const dir = player.face > 0 ? 1 : -1;
    const c = Math.floor((player.x + player.w/2)/T) + dir;
    const r = Math.floor((player.y + player.h - 2)/T);
    for(let dy = 0; dy <= 2; dy++)
      if(crateFits(carried, c, r-dy)){
        carried.c = c; carried.r = r-dy; carried.ox = carried.oy = 0;
        carried = null; snd('pop'); return true;
      }
    return false;
  }
  if(player.char.id !== 'dalmatian') return false;
  const dir = player.face > 0 ? 1 : -1;
  const c = Math.floor((player.x + player.w/2)/T) + dir;
  for(let r = Math.floor(player.y/T); r <= Math.floor((player.y+player.h)/T); r++){
    const k = crateAt(c, r);
    if(k && k.kind !== 'heavy'){ carried = k; snd('pop'); return true; }
  }
  return false;
}

function drawCrates(){
  for(const k of CRATES){
    const p = PROPS[k.kind];
    if(!p) continue;
    const x = k.c*T + k.ox, y = k.r*T + k.oy;
    if(x - ox > VIEW_W + 80 || x - ox + k.tw*T < -80) continue;
    drawPoly(p, x - ox, y - oy, k.tw*T, k.th*T, false);
  }
}

function becomeDoggo(ch){
  const feet = player.y + player.h;
  let ny = feet - ch.h, nx = player.x + (player.w - ch.w)/2;
  if(blocked(ch,nx,ny,ch.w,ch.h)){
    for(let k=1;k<=6;k++){ if(!blocked(ch,nx,ny-k*4,ch.w,ch.h)){ ny -= k*4; break; } }
  }
  const swapped = player.char !== ch;
  player.char = ch; player.w = ch.w; player.h = ch.h;
  player.x = nx; player.y = ny; player.vy = Math.min(player.vy,0); player.peri = 0;
  if(swapped) sfx('bark', 0.5);
  player.zoom = 0; player.trail.length = 0; player._zshown = -1;   // zoomies don't survive a swap
  if(swapped) musicForBiome();                                     // ...and neither does its track
  hudWho.textContent = ch.name;
  hudMove.textContent = `atk ${ch.atk} · spd ${ch.spd} — ${ch.ability}`;
}

const BIOME_TRACK = { grass:'doggo', rock:'deep', city:'deep', water:'drift', wildfire:'drift' };

// Synthesised effects. Footsteps and digging have to vary per hit or they turn
// into a machine gun, so they're generated rather than sampled.
let sfxBus = null, noiseBuf = null;
function makeNoise(){
  const n = actx.sampleRate * 0.5;
  noiseBuf = actx.createBuffer(1, n, actx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = Math.random()*2 - 1;
}
function hiss(t, dur, freq, q, peak, type, dest){
  const s = actx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = actx.createBiquadFilter(); f.type = type || 'bandpass';
  f.frequency.value = freq; f.Q.value = q;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(dest || sfxBus);
  s.start(t); s.stop(t + dur + 0.05);
}
function swoop(t, f0, f1, dur, peak, type, dest){
  const o = actx.createOscillator(); o.type = type || 'sine';
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f1), t + dur);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest || sfxBus);
  o.start(t); o.stop(t + dur + 0.05);
}
const rnd = (a,b) => a + Math.random()*(b-a);

const SND = {
  step(){ const t = actx.currentTime;
    hiss(t, 0.085, rnd(900,1500), 1.1, 0.10);
    swoop(t, rnd(150,190), 70, 0.07, 0.045); },
  dig(){ const t = actx.currentTime;
    hiss(t, 0.16, rnd(380,620), 0.8, 0.13);
    hiss(t + 0.02, 0.10, rnd(160,240), 1.4, 0.09, 'lowpass'); },
  land(v){ const t = actx.currentTime, k = Math.min(1, v/700);
    swoop(t, 170, 55, 0.16, 0.06 + 0.13*k);
    hiss(t, 0.10, 500, 0.7, 0.05 + 0.10*k); },
  jump(){ const t = actx.currentTime; swoop(t, 300, 620, 0.13, 0.09, 'triangle'); },
  kick(){ const t = actx.currentTime;
    swoop(t, 420, 880, 0.12, 0.10, 'triangle'); hiss(t, 0.07, 2200, 1.2, 0.07); },
  shoot(){ const t = actx.currentTime;
    swoop(t, 1100, 190, 0.26, 0.13, 'sawtooth'); hiss(t, 0.13, 1800, 0.9, 0.07); },
  barrier(){ const t = actx.currentTime;
    swoop(t, 700, 90, 0.5, 0.14, 'sawtooth');
    hiss(t, 0.45, 900, 0.5, 0.10); },
  door(){ const t = actx.currentTime;
    hiss(t, 0.09, 260, 1.6, 0.14, 'lowpass');
    hiss(t + 0.11, 0.09, 200, 1.6, 0.11, 'lowpass');
    swoop(t + 0.14, 320, 700, 0.35, 0.07, 'triangle'); },
  zoomies(){ const t = actx.currentTime;
    swoop(t, 200, 1500, 0.55, 0.16, 'sawtooth');
    hiss(t, 0.6, 1200, 0.5, 0.13, 'highpass');
    swoop(t + 0.5, 900, 300, 0.3, 0.10, 'square'); },
  clear(){ const t = actx.currentTime;
    [0,0.11,0.22].forEach((d,i) => swoop(t+d, [523,659,784][i], [523,659,784][i], 0.3, 0.12, 'triangle')); },
};
function snd(name, arg){
  if(!actx || !musOn) return;
  try { SND[name](arg); } catch(e) {}
}

let driveNode = null;
function makeDrive(){
  const ws = actx.createWaveShaper(), n = 1024, c = new Float32Array(n), k = 48;
  for(let i=0;i<n;i++){ const x = i*2/n - 1; c[i] = (1+k)*x / (1 + k*Math.abs(x)); }
  ws.curve = c; ws.oversample = '4x';
  const tone = actx.createBiquadFilter();
  tone.type = 'lowpass'; tone.frequency.value = 2600; tone.Q.value = 0.8;
  const lvl = actx.createGain(); lvl.gain.value = 0.5;
  ws.connect(tone); tone.connect(lvl); lvl.connect(musDry);
  return ws;
}
// power chord — root, fifth, octave, the way a guitar actually voices it
function guitar(t, midi, dur, peak){
  [0, 7, 12].forEach((iv, i) => {
    const o = actx.createOscillator();
    o.type = 'sawtooth'; o.frequency.value = hz(midi + iv);
    o.detune.value = (i - 1) * 6;
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak * (i ? 0.6 : 1), t + 0.008);
    g.gain.setTargetAtTime(0.0001, t + dur*0.55, dur*0.30);
    o.connect(g); g.connect(driveNode);
    o.start(t); o.stop(t + dur + 0.3);
  });
}
function drum(t, k){
  if(k==='k'){ swoop(t,165,44,0.18,0.60,'sine',musDry); hiss(t,0.03,110,1,0.22,'lowpass',musDry); }
  else if(k==='s'){ hiss(t,0.15,1750,0.7,0.30,'bandpass',musDry);
                    swoop(t,330,175,0.09,0.16,'triangle',musDry); }
  else if(k==='h'){ hiss(t,0.035,7500,0.6,0.09,'highpass',musDry); }
  else if(k==='o'){ hiss(t,0.15,6500,0.5,0.10,'highpass',musDry); }
  else if(k==='c'){ hiss(t,0.9,5200,0.35,0.16,'highpass',musDry); }   // crash
  else if(k==='t'){ swoop(t,240,120,0.16,0.34,'sine',musDry);         // tom
                    hiss(t,0.09,420,1.2,0.12,'bandpass',musDry); }
}
let musDry = null;
let actx = null, musBus = null, musOn = true, musTrack = null, musMeter = null;
let beatCursor = 0, nextBeatAt = 0, musTimer = null;

function initAudio(){
  if(actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  musBus = actx.createGain(); musBus.gain.value = 0;
  const lp = actx.createBiquadFilter();          // takes the edge off — no chiptune buzz
  lp.type = 'lowpass'; lp.frequency.value = 3200; lp.Q.value = 0.6;
  const dly = actx.createDelay(1.0); dly.delayTime.value = 0.36;
  const fb = actx.createGain(); fb.gain.value = 0.3;
  const wet = actx.createGain(); wet.gain.value = 0.3;
  // A limiter on the end so the whole thing can sit at a real listening level
  // without the pad, bass and melody peaks stacking up into clipping.
  const comp = actx.createDynamicsCompressor();
  comp.threshold.value = -12; comp.knee.value = 8;
  comp.ratio.value = 6; comp.attack.value = 0.01; comp.release.value = 0.2;
  musBus.connect(lp); lp.connect(comp);
  lp.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(wet); wet.connect(comp);
  sfxBus = actx.createGain(); sfxBus.gain.value = 0.9;
  sfxBus.connect(comp);
  musDry = actx.createGain(); musDry.gain.value = 0.85;
  musDry.connect(comp);
  driveNode = makeDrive();                    // dry — effects skip the music delay
  makeNoise();
  musMeter = actx.createAnalyser(); musMeter.fftSize = 2048;
  comp.connect(musMeter);
  comp.connect(actx.destination);
}
const hz = m => 440 * Math.pow(2, (m - 69) / 12);

let noteCount = 0;
function voice(t, midi, dur, peak, type, detune){
  noteCount++;
  const o = actx.createOscillator();
  o.type = type; o.frequency.value = hz(midi); o.detune.value = detune || 0;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + 0.07);          // soft attack, never a click
  g.gain.setTargetAtTime(0.0001, t + dur * 0.6, dur * 0.3);
  o.connect(g); g.connect(musBus);
  o.start(t); o.stop(t + dur + 1.4);
}

function musicTick(){
  if(!musTrack || !actx) return;
  const s = SCORES[musTrack], spb = 60 / s.bpm;
  while(nextBeatAt < actx.currentTime + 0.3){
    const b = beatCursor % s.len, t = nextBeatAt;
    const every = s.chordEvery || 4;
    if(b % every === 0){
      const bar = (b / every) | 0;
      s.chords[bar].forEach((n, i) => {            // pad, two slightly detuned layers
        voice(t, n, spb * 3.8, 0.055, 'sine', -6);
        voice(t, n + 12, spb * 3.8, 0.026, 'sine', 6 + i * 3);
      });
      voice(t, s.bass[bar], spb * 3.6, 0.150, 'sine');
      voice(t, s.bass[bar] + 12, spb * 3.6, 0.045, 'triangle');
    }
    s.mel.forEach(e => {
      if(Math.floor(e[0]) !== b) return;
      const tt = t + (e[0] - b) * spb;                 // fractional beats allowed
      voice(tt, e[2], e[1] * spb, 0.190, s.lead, -4);  // two detuned copies = warmth
      voice(tt, e[2], e[1] * spb, 0.120, s.lead, 5);
      voice(tt, e[2] - 12, e[1] * spb, 0.045, 'sine');
      if(s.octave) voice(tt, e[2] + 12, e[1] * spb * 0.6, 0.055, 'square', 7);
    });
    if(s.perc) s.perc.forEach(e => {
      if(Math.floor(e[0]) !== b) return;
      drum(t + (e[0] - b) * spb, e[1]);
    });
    if(s.gtr) s.gtr.forEach(e => {
      if(Math.floor(e[0]) !== b) return;
      guitar(t + (e[0] - b) * spb, e[1], e[2] * spb, e[3]);
    });
    beatCursor++; nextBeatAt += spb;
  }
}

function startMusic(){
  if(!musOn) return;
  initAudio();
  if(actx.state === 'suspended') actx.resume();
  if(musTimer) return;
  musTrack = BIOME_TRACK[biome] || 'doggo';
  beatCursor = 0; nextBeatAt = actx.currentTime + 0.15;
  musBus.gain.setTargetAtTime(1.0, actx.currentTime, 0.45);
  musTimer = setInterval(musicTick, 30);
}
function setTrack(want){
  if(!musTimer || want === musTrack){ musTrack = want; return; }
  musTrack = want; beatCursor = 0; nextBeatAt = actx.currentTime + 0.12;
}
function musicForBiome(){
  setTrack(player.zoom > 0 ? 'zoomies' : (BIOME_TRACK[biome] || 'doggo'));
}
function toggleMusic(){
  musOn = !musOn;
  if(musOn){ startMusic(); }
  else {
    if(musBus) musBus.gain.setTargetAtTime(0, actx.currentTime, 0.25);
    clearInterval(musTimer); musTimer = null;
  }
  hudBiome.textContent = biome + (musOn ? '' : ' · muted');
}

// ───────────────────────────────────────────── input
const keys = {};
const held = { left:false, right:false, up:false, jump:false, use:false };
// any real gesture anywhere unlocks audio, not just the on-screen buttons
addEventListener('pointerdown', startMusic);

// where Airplane Doggo is aiming. Canvas space; add ox/oy for world space.
let mouseX = null, mouseY = null;
addEventListener('pointermove', e => {
  const r = cv.getBoundingClientRect();
  if(!r.width || !r.height) return;
  mouseX = (e.clientX - r.left) / r.width  * VIEW_W;
  mouseY = (e.clientY - r.top)  / r.height * VIEW_H;
});
addEventListener('keydown', e => {
  startMusic();
  if(e.code==='KeyM'){ toggleMusic(); return; }
  if(keys[e.code]) return; keys[e.code] = true;
  if(rosterOpen) rosterKey(e);
  else if(e.code==='KeyE') action();
  if(e.code==='KeyR') reset();
  if(e.code==='KeyB' && !rosterOpen)
    setBiome(BIOME_NAMES[(BIOME_NAMES.indexOf(biome)+1) % BIOME_NAMES.length]);
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
const L = () => held.left  || keys.ArrowLeft  || keys.KeyA;
const R = () => held.right || keys.ArrowRight || keys.KeyD;
const U = () => held.up    || keys.ArrowUp    || keys.KeyW;
const D = () => keys.ArrowDown || keys.KeyS;
const J = () => held.jump  || keys.Space;      // up is for LOOKING, not jumping

if(matchMedia('(pointer:coarse)').matches) document.body.classList.add('touch');
document.querySelectorAll('#pad button').forEach(b => {
  const k = b.dataset.k;
  const on  = e => { e.preventDefault(); startMusic();
                     if(k==='use') action(); else held[k]=true; };
  const off = e => { e.preventDefault(); if(k!=='use') held[k]=false; };
  b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off);
  b.addEventListener('pointercancel',off); b.addEventListener('pointerleave',off);
});

// one action button: a kennel if you're standing at one, otherwise whatever this doggo does
function action(){
  if(rosterOpen) return;
  if(nearKennel()) { openRoster(); return; }
  if(toggleCarry()) return;              // E doubles as pick up / put down
  if(player.char.move === 'zoom'){
    player.zoom = ZOOM_TIME;
    sfx('bark', 0.7); snd('zoomies');
    toastEl.classList.remove('go'); void toastEl.offsetWidth;   // restart the animation
    toastEl.classList.add('go');
    musicForBiome();
    return;
  }
  if(player.char.move === 'plasma' && orbs.length < 3){
    orbs.push({ x: player.x + player.w/2 + player.face*10,
                y: player.y + player.h*0.45, vx: player.face*ORB_SPEED, life: 2.4 });
    snd('shoot');
  }
}

// ───────────────────────────────────────────── kennel + roster ui
const rosterEl = document.getElementById('roster');
const cardsEl  = document.getElementById('cards');
const hudWho   = document.getElementById('who');
const hudMove  = document.getElementById('move');
const tipEl    = document.getElementById('tip');
const hudCoins = document.getElementById('coins');
const hudBiome = document.getElementById('biome');
const bannerEl = document.getElementById('banner');
const toastEl  = document.getElementById('toast');
let rosterOpen = false, rosterSel = 0;
const cardCtx = [];

CAST.forEach((c,i) => {
  const card = document.createElement('div');

  card.addEventListener('click', () => { rosterSel = i; pickRoster(); });
  card.addEventListener('mouseenter', () => { rosterSel = i; drawRoster(); });

  cardCtx.push({g: cv.getContext('2d'), c});
});
function drawCardArt(){
  cardCtx.forEach(({g,c}) => {
    g.clearRect(0,0,100,62);
    if(c.art){
      const im = IMG[c.art];
      if(!(im && im.complete && im.naturalWidth)) return;
      drawDog(g, 50-c.w/2, 58-c.h, c, 1, 0, {dh:50, moving:false});   // cards: uniform
    }
    else {
      g.save(); g.translate(50 - c.w*1.25/2, 57 - c.h*1.25);
      g.scale(1.25,1.25); drawDog(g, 0, 0, c, 1, 0, {moving:false}); g.restore();
    }
